  if (s.tab === 'route') inputs = egCard('بدائل الموردين والمسارات (للوحدة الواحدة)', 'قسم 14', (s.routes || []).map((r, i) => `<div class="sub" style="gap:8px"><b style="font-size:13px">${i === 0 ? 'الوضع الحالي — ' : 'بديل ' + i + ' — '}${esc(r.n || '')}</b>${egGrid(120, egTxt('scm', `routes.${i}.n`, 'الاسم') + egNum('scm', `routes.${i}.price`, 'سعر الشراء') + egNum('scm', `routes.${i}.freight`, 'الشحن') + egNum('scm', `routes.${i}.ins`, 'التأمين') + egNum('scm', `routes.${i}.duty`, 'الرسوم والجمارك') + egNum('scm', `routes.${i}.clr`, 'التخليص') + egNum('scm', `routes.${i}.store`, 'التخزين') + egNum('scm', `routes.${i}.days`, 'زمن التوريد (يوم)') + egNum('scm', `routes.${i}.rel`, 'الموثوقية %') + egNum('scm', `routes.${i}.geo`, 'مخاطر جيوسياسية 1–5') + egNum('scm', `routes.${i}.flex`, 'المرونة 1–5'))}</div>`).join('') + egGrid(200, egNum('scm', 'delayCost', 'تكلفة يوم التأخير لكل وحدة')));
  return `${engHead('NAIOSH SUPPLY CHAIN INTELLIGENCE · DIA-SCM', 'ذكاء سلاسل الإمداد واللوجستيات العالمية', 'لا يكتفي النظام بإخبارك أن هناك خطرًا؛ بل يوضح ما الذي قد يتأثر، ومتى، وبأي تكلفة محتملة، وما البدائل المتاحة، وما الأدلة التي تدعم التوصية.', engExport('SCM'))}
  ${egTabs('scm', [['case', 'تحديد الحالة'], ['mat', 'المواد والمخزون'], ['route', 'البدائل والمسارات'], ['risk', 'المخاطر والسيناريوهات']])}
  ${inputs}${egOut('scm')}`;
};
</script>
