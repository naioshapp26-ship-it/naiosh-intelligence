<script data-app="">
/* ================= Engines wave 3 (part B) =================

/* =========================================================================================

   ========================================================================================= */
const PMO_TYPE = { supportive: ['المكتب الداعم — تحكم منخفض', 'قوالب ومنهجيات واستشارات وتقارير إرشادية', 'مدير المشروع'], controlling: ['المكتب المسيطر — تحكم متوسط', 'بوابات اعتماد وضبط تغييرات ومتابعة ميزانية وتدقيق التزام', 'مدير مكتب إدارة المشاريع'], directive: ['المكتب التوجيهي — تحكم مرتفع', 'تعيين مديري المشاريع وتخصيص الموارد والتصعيد ضمن التفويض', 'لجنة المحفظة'] };
const PMO_A = [['A0', 'يدوي'], ['A1', 'مراقبة'], ['A2', 'تنبيه'], ['A3', 'تحليل'], ['A4', 'توصية'], ['A5', 'إعداد للمراجعة'], ['A6', 'تنفيذ بعد الموافقة'], ['A7', 'أتمتة محدودة ومراقبة'], ['A8', 'تدخل بشري إلزامي']];
const PMO_PROC = [['reports', 'إعداد التقارير الدورية', 0], ['remind', 'التذكيرات ومتابعة المواعيد', 0], ['assign', 'توزيع المهام وفق القواعد', 0], ['minutes', 'مسودات محاضر الاجتماعات', 0], ['budget', 'اعتماد الميزانيات والصرف', 1], ['scope', 'تغيير النطاق والجدول وخط الأساس', 1], ['riskAccept', 'قبول المخاطر الجوهرية', 1], ['proc', 'أوامر الشراء والعقود', 1]];
const PMO_GATES = [['G0', 'الفكرة والطلب'], ['G1', 'التقييم الأولي'], ['G2', 'دراسة الجدوى والاعتماد'], ['G3', 'التخطيط'], ['G4', 'التصريح بالتنفيذ'], ['G5', 'التنفيذ والمراقبة'], ['G6', 'التحقق والتسليم'], ['G7', 'الإغلاق الإداري'], ['G8', 'تحقق المنافع']];

EG_ROWS['pmo.projects'] = () => ({ n: 'مشروع جديد', obj: '', bac: 100000, dur: 12, pl: 0, act: 0, cost: 0, gate: 'G0', risks: 0, dec: 0, res: '', hrs: '', chk: {} });
EG_INIT.pmo = () => ({
  tab: 'portfolio', type: 'controlling', tier: 'pro', cap: 40,
  auto: { reports: 'A5', remind: 'A2', assign: 'A6', minutes: 'A5', budget: 'A8', scope: 'A6', riskAccept: 'A8', proc: 'A6' },

    { n: 'توسعة مستودع المنطقة الشرقية', obj: 'رفع الطاقة التشغيلية', bac: 2500000, dur: 52, pl: 58, act: 55, cost: 1420000, gate: 'G5', risks: 1, dec: 3, res: 'خالد، محمد', hrs: '20، 40', chk: {} },

function pmoModel() {
  const s0 = egS('pmo'); pmoEnsure(s0); const s = { ...s0, projects: s0.projects.map(p => ({ ...p, n: pmoName(p) })) }, esc2 = PMO_TYPE[s.type] ? PMO_TYPE[s.type][2] : 'مدير PMO';
  const P = s.projects.map((p, i) => {
    const bac = egN(p.bac), pv = bac * egN(p.pl) / 100, ev = bac * egN(p.act) / 100, ac = egN(p.cost);
    const spi = pv ? ev / pv : NaN, cpi = ac ? ev / ac : NaN, eac = isFinite(cpi) && cpi > 0 ? bac / cpi : bac, vac = bac - eac, fin = isFinite(spi) && spi > 0 ? egN(p.dur) / spi : egN(p.dur);
    const started = egN(p.pl) > 0 || egN(p.act) > 0;
    const rag = !started ? ['لم يبدأ التنفيذ', 't-n'] : (spi < 0.9 || cpi < 0.9 || egN(p.risks) >= 3) ? ['أحمر — يحتاج تدخلًا', 't-c'] : (spi < 0.97 || cpi < 0.97 || egN(p.dec) >= 2 || egN(p.risks) >= 2) ? ['أصفر — مراقبة', 't-m'] : ['أخضر — ضمن الخطة', 't-s'];
    return { i, p, bac, pv, ev, ac, sv: ev - pv, cv: ev - ac, spi, cpi, eac, vac, fin, delay: fin - egN(p.dur), rag, started };

    if (egN(x.p.risks) >= 2) alerts.push([x.p.n, 'مخاطر حرجة مفتوحة', `${egN(x.p.risks)} مخاطر حرجة`, 'مراجعة فاعلية خطط المعالجة ومؤشرات الإنذار', 'تصعيد للمالك المسؤول وتحديث سجل المخاطر', esc2]);
  });
  over.forEach(o => alerts.push([o.pr.join(' + '), 'تحميل زائد للموارد', `«${o.n}» مخصص ${o.h} ساعة أسبوعيًا مقابل طاقة ${egN(s.cap)}`, 'تعارض تخصيص بين مشاريع متعددة', 'إعادة توزيع مع مراعاة المهارات والصلاحيات وعدالة التوزيع', esc2]));

  const T = P.filter(x => x.started), tPV = T.reduce((a, x) => a + x.pv, 0), tEV = T.reduce((a, x) => a + x.ev, 0), tAC = T.reduce((a, x) => a + x.ac, 0);
  return { s, P, over, alerts, viol, people, tot: { bac: P.reduce((a, x) => a + x.bac, 0), spi: tPV ? tEV / tPV : NaN, cpi: tAC ? tEV / tAC : NaN, eac: T.reduce((a, x) => a + x.eac, 0) + P.filter(x => !x.started).reduce((a, x) => a + x.bac, 0) } };
}
EG_OUT.pmo = () => {
  const m = pmoModel(), s = m.s;
  if (s.tab === 'setup') return egCard('نموذج التحكم والأتمتة', 'PMO-25/30', `${anKpis([['نوع المكتب', PMO_TYPE[s.type][0].split(' — ')[0]], ['مستوى الخدمة', { starter: 'PMO Starter', pro: 'PMO Professional', enterprise: 'PMO Enterprise', advisory: 'Advisory & Managed' }[s.tier]], ['عمليات حرجة مخالفة', m.viol.length, m.viol.length ? 'bad' : 'good']])}
    ${m.viol.length ? `<div class="banner r">${ic('warn', 16)}<span>لا يجوز تشغيل «${m.viol.map(v => v[1]).join('، ')}» بأتمتة مستقلة (A7). القرارات المالية والتعاقدية وقبول المخاطر تبقى A6 كحد أقصى أو A8.</span></div>` : '<div class="banner g">مستويات الأتمتة متوافقة مع قاعدة: لا تتجاوز أي عملية آلية صلاحيات HUB-AUTH.</div>'}
    ${anTbl({ h: 'مستويات الأتمتة', cols: ['الرمز', 'المستوى'], rows: PMO_A })}${egNote('A8 ليس أعلى درجات الاستقلالية؛ بل فئة للعمليات التي يجب أن تبقى بيد الشخص المخول. المستويات اختيار تشغيلي وليست درجات جودة.')}`);
  if (s.tab === 'portfolio') return egCard('لوحة المحفظة والقيمة المكتسبة', 'PMO-01/05/21/22', `${anKpis([['المشاريع', m.P.length], ['تحتاج تدخلًا', m.P.filter(x => x.rag[1] === 't-c').length, m.P.some(x => x.rag[1] === 't-c') ? 'bad' : 'good'], ['SPI المحفظة', fmtN(m.tot.spi, 2), m.tot.spi < 0.95 ? 'bad' : 'good'], ['CPI المحفظة', fmtN(m.tot.cpi, 2), m.tot.cpi < 0.95 ? 'bad' : 'good'], ['الميزانية الكلية', fmtN(m.tot.bac, 0)], ['المتوقع عند الإكمال', fmtN(m.tot.eac, 0), m.tot.eac > m.tot.bac ? 'bad' : '']])}
    ${anTbl({ h: 'تحليل القيمة المكتسبة لكل مشروع', cols: ['المشروع', 'البوابة', 'PV', 'EV', 'AC', 'SPI', 'CPI', 'EAC', 'الإكمال المتوقع (أسبوع)', 'الحالة'], rows: m.P.map(x => [x.p.n, x.p.gate, fmtN(x.pv, 0), fmtN(x.ev, 0), fmtN(x.ac, 0), x.started ? fmtN(x.spi, 2) : '—', x.started ? fmtN(x.cpi, 2) : '—', fmtN(x.eac, 0), x.started ? fmtN(x.fin, 0) + ' / ' + egN(x.p.dur) : '—', x.rag[0]]) })}
    ${anChart({ bars: m.P.filter(x => x.started).sort((a, b) => b.cpi - a.cpi).map(x => [x.p.n + ' · CPI', +x.cpi.toFixed(2)]) })}
    ${egNote('SV = EV − PV · CV = EV − AC · SPI = EV ÷ PV · CPI = EV ÷ AC · EAC = BAC ÷ CPI. تتطلب هذه المؤشرات خط أساس معتمدًا وقواعد احتساب إنجاز موحدة، ولا تغني عن تحليل المسار الحرج وجودة المخرجات. الإنجاز في الموعد والميزانية لا يعني تحقق المنفعة.')}`);

  return egCard('الإنذار المبكر والموارد والتصعيد', 'PMO-12/15/16', `${anKpis([['تنبيهات نشطة', m.alerts.length, m.alerts.length ? 'bad' : 'good'], ['موارد محمّلة زائدًا', m.over.length, m.over.length ? 'bad' : 'good'], ['قرارات معلقة', s.projects.reduce((a, p) => a + egN(p.dec), 0)]])}
    <span class="mono faint" style="font-size:11px">DETECT → VALIDATE DATA → IDENTIFY IMPACT → ANALYZE CAUSE → ASSESS RISK → RECOMMEND ACTION → ESCALATE → VERIFY</span>
    ${anTbl({ h: 'قائمة الأعمال التي تحتاج تدخلًا إداريًا هذا الأسبوع', cols: ['المشروع', 'الإشارة', 'الدليل', 'السبب المحتمل (يحتاج تحققًا)', 'الإجراء المقترح', 'التصعيد إلى'], rows: m.alerts })}

/* ---- PMO reference lists (departments, job titles, activity types and names) + PMO project codes ---- */
const PMO_LISTS = {
  dept: ['الإدارة العامة', 'مكتب إدارة المشاريع PMO', 'الإدارة المالية', 'الموارد البشرية', 'تقنية المعلومات', 'العمليات', 'المشتريات والعقود', 'التسويق والمبيعات', 'خدمة العملاء', 'الشؤون القانونية', 'الجودة والتميز المؤسسي', 'سلاسل الإمداد والمستودعات', 'الاستراتيجية والتخطيط'],
  job: ['مدير مكتب إدارة المشاريع', 'مدير محفظة', 'مدير برنامج', 'مدير مشروع', 'منسق مشروع', 'مخطط مشاريع', 'محلل أعمال', 'محلل بيانات المشاريع', 'مسؤول الجودة', 'مسؤول المخاطر', 'مسؤول الحوكمة والامتثال', 'راعي المشروع', 'مدير إدارة'],
  atype: ['تخطيط', 'متابعة ورقابة', 'حوكمة واعتماد', 'تقارير ولوحات', 'إدارة الموارد', 'إدارة المخاطر', 'الجودة', 'التواصل وأصحاب المصلحة', 'إدارة التغيير', 'الإغلاق وتحقق المنافع'],
  act: [['إعداد ميثاق المشروع', 'تخطيط'], ['إعداد خطة المشروع وخط الأساس', 'تخطيط'], ['تقدير الميزانية والجدول', 'تخطيط'], ['متابعة الجدول والإنجاز', 'متابعة ورقابة'], ['تحليل القيمة المكتسبة', 'متابعة ورقابة'], ['اعتماد بوابة مرحلة', 'حوكمة واعتماد'], ['مراجعة الالتزام بالمنهجية', 'حوكمة واعتماد'], ['إعداد التقرير الدوري', 'تقارير ولوحات'], ['تحديث لوحة المحفظة', 'تقارير ولوحات'], ['توزيع الموارد وموازنة الأحمال', 'إدارة الموارد'], ['تحديث سجل المخاطر', 'إدارة المخاطر'], ['تصعيد خطر حرج', 'إدارة المخاطر'], ['ضمان الجودة ومراجعة المخرجات', 'الجودة'], ['اجتماع أصحاب المصلحة', 'التواصل وأصحاب المصلحة'], ['دراسة طلب تغيير', 'إدارة التغيير'], ['الإغلاق الإداري والدروس المستفادة', 'الإغلاق وتحقق المنافع'], ['قياس تحقق المنافع', 'الإغلاق وتحقق المنافع']]
};
const PMO_PK = { dept: ['الإدارة / القسم', 'architecture'], job: ['المسمى الوظيفي للمسؤول', 'agents'], atype: ['نوع نشاط PMO', 'pmo'], act: ['اسم نشاط PMO', 'execution'] };
const PMO_UI = { open: null };
function pmoEnsure(s) {

const pmoName = (p) => (p.code ? p.code + ' · ' : '') + p.n;

  const setVal = (val) => { const before = p[key]; p[key] = val; if (key === 'atype' && p.act && !s.lists.act.some(a => a[0] === p.act && a[1] === val)) p.act = ''; if (key === 'act' && !p.atype) { const t = s.lists.act.find(a => a[0] === val); if (t) p.atype = t[1]; } PMO_UI.open = null; save(); render(); if (before !== val) toast('«' + p.code + '»: ' + PMO_PK[key][0] + ' ← ' + val); };
  if (act === 'pmo-pp') { PMO_UI.last = +i; PMO_UI.open = PMO_UI.open === k ? null : k; render(); if (PMO_UI.open) setTimeout(() => { const q = document.querySelector('[data-pmo-q="' + k + '"]'); if (q) q.focus(); }, 0); return true; }
  if (act === 'pmo-pick') { setVal(el.dataset.v); return true; }
  if (act === 'pmo-add') {
    const q = document.querySelector('[data-pmo-q="' + k + '"]'), val = q ? q.value.trim() : '';
    if (!val) { toast('اكتب الاسم الجديد في خانة البحث ثم اضغط «إضافة»'); if (q) q.focus(); return true; }
    if (key === 'act') { if (!s.lists.act.some(a => a[0] === val)) s.lists.act.push([val, p.atype || s.lists.atype[0] || 'عام']); }
    else if (!s.lists[key].includes(val)) s.lists[key].push(val);
    log('د. عدنان', `أضاف «${val}» إلى قائمة ${PMO_PK[key][0]} في مكتب PMO`); setVal(val); return true;
  }
  if (act === 'pmo-ladd') {
    const inp = document.querySelector('[data-pmo-new="' + k + '"]'), val = inp ? inp.value.trim() : '';
    if (!val) { toast('اكتب الاسم أولًا'); return true; }
    if (k === 'act') { const t = document.querySelector('[data-pmo-newt]'); if (!s.lists.act.some(a => a[0] === val)) s.lists.act.push([val, t ? t.value : 'عام']); }
    else if (!s.lists[k].includes(val)) s.lists[k].push(val);
    save(); render(); toast('أُضيف «' + val + '»'); return true;
  }
  if (act === 'pmo-ldel') { const [lk, j] = String(k).split('|'); const x = s.lists[lk][+j]; s.lists[lk].splice(+j, 1); save(); render(); toast('حُذف «' + (Array.isArray(x) ? x[0] : x) + '» من القائمة'); return true; }
  return false;
}
document.addEventListener('input', (e) => {
  const q = e.target; if (!q.dataset || !q.dataset.pmoQ) return;
  const t = q.value.trim(), menu = q.closest('.pp-menu'); if (!menu) return;
  let any = false; menu.querySelectorAll('.pp-o').forEach(o => { const hit = !t || o.textContent.includes(t); o.style.display = hit ? '' : 'none'; if (hit) any = true; });
  const add = menu.querySelector('.pp-add'); if (add) add.textContent = t ? '+ إضافة «' + t + '»' : add.textContent.replace(/«.*»/, '').trim();
});
document.addEventListener('keydown', (e) => {
  const q = e.target; if (!q.dataset || !q.dataset.pmoQ) return;
  if (e.key === 'Escape') { PMO_UI.open = null; render(); }
  if (e.key === 'Enter') { e.preventDefault(); const t = q.value.trim(), m = q.closest('.pp-menu'), hit = m && [...m.querySelectorAll('.pp-o')].find(o => o.dataset.v === t); (hit || m.querySelector('.pp-add')).click(); }
});
document.addEventListener('click', (e) => {
  if (!PMO_UI.open || (e.target.closest && e.target.closest('.pp'))) return;
  PMO_UI.open = null; if (S.route === 'pmo') render();
});
</script>
