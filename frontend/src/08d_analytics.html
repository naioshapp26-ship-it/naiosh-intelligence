    out.imp = { title: 'قياس الأثر — هل تغيّر شيء بعد التاريخ المحدد؟', summary: `قبل ${lab[cut]}: ${fmtN(wt.ma)} · بعده: ${fmtN(wt.mb)} (${fmtP(pctCh(wt.ma, wt.mb))}). الفرق ${wt.p < 0.05 ? 'ذو دلالة إحصائية' : 'غير دال إحصائيًا'} (p=${fmtPv(wt.p)}، حجم الأثر d=${fmtN(wt.d, 2)}).${did !== null ? ` مقارنة بالمتوسط العام في الفترة نفسها، الأثر الصافي على «${focus}» = ${(did >= 0 ? '+' : '') + fmtN(did)}.` : ''}`,
      kpis: [['قبل', fmtN(wt.ma)], ['بعد', fmtN(wt.mb)], ['الدلالة p', fmtPv(wt.p)], ['حجم الأثر d', fmtN(wt.d, 2)]].concat(did !== null ? [['الأثر الصافي (فرق الفروق)', (did >= 0 ? '+' : '') + fmtN(did), did < 0 ? 'bad' : 'good']] : []),
      cut: true, notes: ['غيّر «تاريخ التدخل» لقياس أثر أي إجراء نُفّذ. الأثر الصافي يستبعد ما حدث للجميع في الفترة نفسها.'] };
  }
  return { out, ctx, groups };
}

/* ---------- feasibility (inputs editable) ---------- */
function anFeasDefaults(T, cfg) {
  const f = {};
  const find = (re) => T.cols.find(c => c.type === 'num' && re.test(c.name));
  const rev = find(/مبيعات|sales|إيراد|revenue/i), cost = find(/تكلفة|cost|مصروف|expense/i);
  const monthly = (() => { const s = cfg.date ? anSeries(T, cfg, cfg.target, 'all').keys : []; return s.length && s.every(k => k.endsWith('-01')); })();
  const annual = (col) => { if (!col) return null; const s = anSeries(T, cfg, col.name, cfg.focus || 'all').y.filter(v => v !== null); const last = s.slice(-12); return Math.round(st.mean(last) * (monthly ? 12 : 1)); };
  f.rev = annual(rev) || 300000; f.opex = annual(cost) || Math.round(f.rev * 0.7);
  f.capex = (S.res && S.res.capex) || Math.max(50000, Math.round(f.rev * 0.75 / 1000) * 1000); f.rate = 10; f.years = 5; f.growth = 3; f.src = (rev ? `الإيرادات والتكاليف من «${rev.name}»${cost ? ' و«' + cost.name + '»' : ''}` : 'الإيرادات والتكاليف افتراضية — عدّلها') + ((S.res && S.res.capex) ? '، والاستثمار من طلب التحليل' : '، والاستثمار الأولي تقدير افتراضي (75% من الإيرادات السنوية) — أدخل القيمة الفعلية');
  return f;
}
function anFeasCalc(f) {
  const cf = [-f.capex]; for (let t = 1; t <= f.years; t++) cf.push(f.rev * (1 + f.growth / 100) ** (t - 1) - f.opex * 1.03 ** (t - 1));
  const npv = (r) => cf.reduce((s, c, t) => s + c / (1 + r) ** t, 0);
  let lo = -0.99, hi = 5, irr = NaN; if (npv(lo) * npv(hi) < 0) { for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; } irr = (lo + hi) / 2 * 100; }
  let cum = 0, pay = null; for (let t = 0; t < cf.length; t++) { const prevCum = cum; cum += cf[t]; if (pay === null && t > 0 && cum >= 0) pay = t - 1 + (-prevCum) / cf[t]; }
  const NPV = npv(f.rate / 100), pvIn = NPV + f.capex;
  const sens = [['الإيرادات −20%', { ...f, rev: f.rev * 0.8 }], ['الإيرادات +20%', { ...f, rev: f.rev * 1.2 }], ['التكاليف +20%', { ...f, opex: f.opex * 1.2 }], ['معدل الخصم +2', { ...f, rate: f.rate + 2 }]].map(([n, g]) => { const c2 = [-g.capex]; for (let t = 1; t <= g.years; t++) c2.push(g.rev * (1 + g.growth / 100) ** (t - 1) - g.opex * 1.03 ** (t - 1)); return [n, c2.reduce((s, c, t) => s + c / (1 + g.rate / 100) ** t, 0)]; });
  // break-even annual revenue (NPV = 0), by bisection on revenue
  let a = 0, b = Math.max(f.rev, f.opex) * 4 + f.capex; const nv = (rv) => { let s = -f.capex; for (let t = 1; t <= f.years; t++) s += (rv * (1 + f.growth / 100) ** (t - 1) - f.opex * 1.03 ** (t - 1)) / (1 + f.rate / 100) ** t; return s; };
  for (let i = 0; i < 100; i++) { const m = (a + b) / 2; if (nv(m) < 0) a = m; else b = m; }
  return { cf, NPV, irr, pay, pi: f.capex ? pvIn / f.capex : NaN, be: (a + b) / 2, sens, ok: NPV > 0 && (!isFinite(irr) || irr > f.rate) };
}
function anFeas(T, cfg) {
  const f = Object.assign(anFeasDefaults(T, cfg), (S.res && S.res.feas) || {});
  const r = anFeasCalc(f), cur = (S.res && S.res.currency) || '';
  return { title: 'دراسة الجدوى الاقتصادية — هل المشروع مجدٍ؟', feas: f, summary: `${r.ok ? 'مجدٍ اقتصاديًا وفق الافتراضات' : 'غير مجدٍ وفق الافتراضات الحالية'}: صافي القيمة الحالية ${fmtN(r.NPV, 0)}${cur ? " " + cur : ""}، ومعدل العائد الداخلي ${isFinite(r.irr) ? fmtN(r.irr, 1) + '%' : 'غير محدد'} مقابل معدل خصم ${f.rate}%، وفترة الاسترداد ${r.pay !== null ? fmtN(r.pay, 1) + ' سنة' : 'أطول من ' + f.years + ' سنوات'}. الإيرادات السنوية اللازمة للتعادل ≈ ${fmtN(r.be, 0)}.`,
    kpis: [['صافي القيمة الحالية NPV', fmtN(r.NPV, 0), r.NPV > 0 ? 'good' : 'bad'], ['العائد الداخلي IRR', isFinite(r.irr) ? fmtN(r.irr, 1) + '%' : '—'], ['فترة الاسترداد', r.pay !== null ? fmtN(r.pay, 1) + ' سنة' : '—'], ['مؤشر الربحية', fmtN(r.pi, 2)]],
    tables: [{ h: 'التدفقات النقدية', cols: ['السنة', 'التدفق', 'التراكمي'], rows: r.cf.map((c, t) => [t, fmtN(c, 0), fmtN(r.cf.slice(0, t + 1).reduce((a, b) => a + b, 0), 0)]) }, { h: 'تحليل الحساسية', cols: ['الحالة', 'صافي القيمة الحالية'], rows: r.sens.map(([a, b]) => [a, fmtN(b, 0)]) }],
    notes: ['المصادر: ' + f.src + '. التكاليف تنمو 3% سنويًا للتضخم. الأرقام تقديرية للتخطيط وليست ضمانًا.'] };
}

/* ---------- sample dataset ---------- */
function anSampleCSV() {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }, nrm = () => { let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return s - 3; };
  const br = [['الفرع الشمالي', 0], ['الفرع الجنوبي', 4], ['الفرع الشرقي', 0], ['الفرع الغربي', -2]];
  const lines = ['الشهر,الفرع,مؤشر_الأداء,المبيعات,التكلفة,ساعات_التدريب,ساعات_العمل_الإضافي,دوران_الموظفين,الشكاوى,رضا_العملاء,زمن_التسليم_بالأيام'];
  for (let m = 0; m < 24; m++) {
    const d = new Date(Date.UTC(2024, 10 + m, 1)), key = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
    for (const [b, off] of br) {
      const north = b === 'الفرع الشمالي' && m >= 16, k = north ? (m - 15) / 8 : 0;
      const tr = Math.max(1, 8 - 5 * k + nrm() * 0.5), ot = 18 + 22 * k + nrm() * 2.5, dl = 3 + 1.6 * k + nrm() * 0.15, to = 1.2 + 2.2 * k + Math.abs(nrm()) * 0.3;
      const perf = 64 + 1.8 * tr - 0.15 * ot - 1.5 * (dl - 3) + off + nrm() * 1.2, comp = Math.max(0, Math.round(6 + (dl - 3) * 7 + nrm() * 1.5)), sat = 90 - comp * 0.8 + nrm();
      lines.push([key, b, perf.toFixed(1), Math.round(perf * 1500 + nrm() * 2000), Math.round(60000 + ot * 800 + nrm() * 1500), tr.toFixed(1), ot.toFixed(1), to.toFixed(1), comp, sat.toFixed(1), dl.toFixed(2)].join(','));
    }
  }
  return lines.join('\n');
}
