  if (s.tab === 'evidence') inputs = egCard('بوابة الأدلة متعددة الوسائط', 'FHI-INTAKE', pick + s.evid.map((e, j) => e.fac !== code ? '' : `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-items:end;padding-bottom:8px;border-bottom:1px dashed var(--line)"><span class="pmo-code" style="align-self:center;justify-self:start">${esc(e.id)}</span>${egSel('fhi', `evid.${j}.t`, 'النوع', FHI_ET)}${egTxt('fhi', `evid.${j}.d`, 'الوصف')}${egTxt('fhi', `evid.${j}.s`, 'المصدر')}${egTxt('fhi', `evid.${j}.date`, 'تاريخ الالتقاط')}${egSel('fhi', `evid.${j}.q`, 'جودة الاستخراج', FHI_Q)}${egSel('fhi', `evid.${j}.st`, 'حالة المراجعة', FHI_EST)}${egDel('fhi', 'evid', j)}</div>`).join('') + `<div class="row" style="gap:8px;margin-top:6px">${egAdd('fhi', 'evid', 'تسجيل دليل')}<span class="faint" style="font-size:11px">لرفع الملفات نفسها وتحليل جداولها استخدم «نتائج التحليل الفعلية» — تُقبل الصور والفيديو وPDF وExcel وWord.</span></div>`);
  if (s.tab === 'findings') inputs = egCard('إدخال النتائج', 'FHI-FINDINGS', pick + `<div style="max-width:300px">${egSel('fhi', 'rule', 'قاعدة الترتيب', FHI_RULE)}</div>` + s.finds.map((x, j) => x.fac !== code ? '' : `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;align-items:end;padding-bottom:8px;border-bottom:1px dashed var(--line)">${egSel('fhi', `finds.${j}.kind`, 'السجل', FHI_KIND)}${egTxt('fhi', `finds.${j}.x`, 'الملاحظة')}${egSel('fhi', `finds.${j}.ev`, 'الدليل', [['', 'بلا دليل']].concat(s.evid.filter(e => e.fac === code).map(e => [e.id, e.id + ' · ' + e.d])))}${egNum('fhi', `finds.${j}.sev`, 'الشدة/الأهمية 1–5')}${egNum('fhi', `finds.${j}.lik`, 'الاحتمال 1–5')}${egNum('fhi', `finds.${j}.urg`, 'الإلحاح 1–5')}${egNum('fhi', `finds.${j}.eco`, 'الأثر الاقتصادي')}${egNum('fhi', `finds.${j}.feas`, 'الجدوى 1–5')}${egTxt('fhi', `finds.${j}.owner`, 'المالك')}${egDel('fhi', 'finds', j)}</div>`).join('') + egAdd('fhi', 'finds', 'إضافة نتيجة'));
  if (s.tab === 'plan') inputs = egCard('الإجراءات ونمط التشغيل', 'FHI-PLAN', pick + egQ(1, 'نمط التشغيل', egCh('fhi', 'mode', FHI_MODE)) + egQ(2, 'الإجراءات — قبل وبعد لإثبات الأثر', s.acts.map((a, j) => a.fac !== code ? '' : `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;align-items:end;padding-bottom:8px;border-bottom:1px dashed var(--line)">${egTxt('fhi', `acts.${j}.x`, 'الإجراء')}${egTxt('fhi', `acts.${j}.owner`, 'المسؤول')}${egTxt('fhi', `acts.${j}.due`, 'الموعد')}${egNum('fhi', `acts.${j}.cost`, 'التكلفة')}${egSel('fhi', `acts.${j}.st`, 'الحالة', [['open', 'مفتوح'], ['doing', 'قيد التنفيذ'], ['done', 'منجز']])}${egNum('fhi', `acts.${j}.base`, 'القياس قبل')}${egNum('fhi', `acts.${j}.after`, 'القياس بعد')}${egDel('fhi', 'acts', j)}</div>`).join('') + egAdd('fhi', 'acts', 'إضافة إجراء')) + egQ(3, 'اختبارات القبول (اجتازت)', `<div class="row" style="gap:6px">${FHI_TESTS.map((n, j) => choice('eg-set', `fhi.tests.${j}`, (s.tests || {})[j] ? '' : '1', !!(s.tests || {})[j], n)).join('')}</div>`));
  return `${engHead('NAIOSH FACILITY & HOSPITALITY INTELLIGENCE 360 · NAIOSH-FHI', 'تحليل المطاعم والفنادق والفعاليات والمرافق', 'نواة تحليل واحدة لستة قطاعات — المطاعم والفنادق والإسكان والفعاليات والمرافق والعقارات: توثيق حالة المنشأة، تحليل أدائها، القوة والضعف والمخاطر والفرص، ثم خطة تحسين قابلة للقياس والتدقيق.', engExport('FHI'))}
  ${egTabs('fhi', [['facility', 'المنشأة والمؤشرات'], ['evidence', 'الأدلة وجودة البيانات'], ['findings', 'السجلات الأربعة'], ['plan', 'خطة التحسين والحوكمة']])}
  ${inputs}${egOut('fhi')}`;
};
document.addEventListener('change', (e) => {
  const el = e.target; if (!el.dataset || el.dataset.eg !== 'fhi') return;
  if (el.dataset.p === 'sel') { egS('fhi').sel = +el.value; render(); return; }
  if (/^facs\.\d+\.sector$/.test(el.dataset.p)) { const s = egS('fhi'), f = s.facs[+el.dataset.p.split('.')[1]]; f.k = fhiNewK(f.sector); render(); return; }
  if (el.dataset.p === 'rule') render();
});
