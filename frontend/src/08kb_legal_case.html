<script data-app="">
/* ================= DIA-LEGAL — case operations (v39) =================
   «منظومة نايوش للتحليل القانوني والحوكمة والتحليل القضائي»
   • سير القضية والحركات: a transaction log for every case (actions, hearings, documents, evidence, fees, expenses,
     payments, decisions, approvals) tied to the 10-step case workflow, plus a flowchart of where the case stands.
   • التقرير النهائي: the 12-section legal report, gated by the 9 mandatory governance rules — the system refuses a
     decisive result when sources are missing, outdated or conflicting, and nothing is final before human approval.
   • The 15 legal engines, the 4 jurisdiction layers and quality indicators (gov tab). */
const LG_TX = ['استلام', 'إجراء', 'جلسة', 'مستند', 'دليل', 'مراسلة', 'بحث قانوني', 'قرار', 'اعتماد', 'أتعاب', 'مصروف', 'دفعة'];
const LG_MONEY = { 'أتعاب': 1, 'مصروف': 1, 'دفعة': -1 };
const LG_ENG = [
  ['01', 'محرك المعرفة القانونية', 'LEGAL KNOWLEDGE', 'فهرسة التشريعات والأحكام واللوائح حسب الدولة والموضوع والمحكمة وتاريخ النفاذ', /./],
  ['02', 'محرك الدستور والتشريعات', 'CONSTITUTION & LEGISLATION', 'تحليل النصوص الدستورية والتشريعية وتعارضها وما يتطلب تفسيرًا متخصصًا', /دستور|إداري|دولي/],
  ['03', 'محرك القضايا والأحكام', 'CASE & PRECEDENT', 'استخراج الوقائع والمسائل والأسباب والمنطوق ومدى حجية الحكم', /./],
  ['04', 'محرك تحليل البيانات القانونية', 'LEGAL DATA ANALYTICS', 'تحليل الملفات والعقود والمراسلات والجداول واكتشاف التناقضات والفجوات', /./],
  ['05', 'محرك الجرائم الإلكترونية', 'CYBERCRIME', 'الاحتيال والابتزاز والتصيد والوصول غير المصرح به وانتحال الهوية', /معلومات|إلكترون|بيانات/],
  ['06', 'محرك الأدلة الرقمية', 'DIGITAL EVIDENCE', 'سلامة الدليل وسلسلة الحيازة والبيانات الوصفية ضمن الصلاحيات', /معلومات|إلكترون|نشر|بيانات/],
  ['07', 'محرك النشر والتواصل الاجتماعي', 'PUBLICATION & SOCIAL MEDIA', 'التشهير والخصوصية والملكية الفكرية والتحريض مع مراعاة حرية التعبير', /نشر|ملكية/],
  ['08', 'محرك القانون المدني والتجاري', 'CIVIL & COMMERCIAL', 'الالتزامات والعقود والتعويض والمسؤولية والمطالبات', /تجاري|عقود|مدني|عقاري|عمالي/],
  ['09', 'محرك فض النزاعات', 'DISPUTE RESOLUTION', 'التفاوض والوساطة والتسوية والتحكيم والتقاضي', /تجاري|عقود|مدني|عمالي|عقاري|أحوال/],
  ['10', 'محرك القانون الدولي وحقوق الإنسان', 'INTERNATIONAL & HUMAN RIGHTS', 'الاتفاقيات والمعايير الدولية ونطاق انطباقها على الدولة والواقعة', /دولي/],
  ['11', 'محرك السياسات والإجراءات', 'POLICY & PROCEDURE', 'مراجعة السياسات المؤسسية وكشف الثغرات واقتراح ضوابط الامتثال', /إداري|بيانات|عمالي/],
  ['12', 'محرك المخاطر والامتثال', 'LEGAL RISK & COMPLIANCE', 'المخاطر القانونية ومواعيد التقادم والطعن والإشعارات', /./],
  ['13', 'محرك الحلول والتوصيات', 'SOLUTIONS & RECOMMENDATIONS', 'بدائل قانونية بمزاياها ومخاطرها وتكاليفها وأدلتها', /./],
  ['14', 'محرك السيناريوهات والتوقعات', 'FORECAST & SCENARIOS', 'سيناريوهات عند توافر بيانات مناسبة مع بيان حدود التنبؤ', /./],
  ['15', 'محرك الحوكمة والتدقيق والجودة', 'GOVERNANCE, AUDIT & QUALITY', 'المصادر والصلاحيات والتغييرات ومراجعات المحامين وسجل كل إصدار', /./]];
const LG_LAYERS = [['1', 'النواة القانونية العالمية', 'المصادر، الأدلة، التحليل، إدارة القضايا، التحقق، المخاطر، التدقيق'], ['2', 'الولاية القضائية', 'الدولة، الدستور، التشريعات، اللوائح، السوابق والأحكام، الاختصاص'], ['3', 'السياق القانوني للقضية', 'مدني، جنائي، إلكتروني، تجاري، عمالي، نشر، بيانات، حقوق إنسان، فض نزاعات'], ['4', 'محرك القرار المنضبط', 'الوقائع والأدلة، النصوص المنطبقة، مقارنة التفسيرات، المخاطر والتوصيات']];

/* ---------- data: seed + migrate ---------- */
const _lgInit = EG_INIT.legal;
EG_INIT.legal = () => {
  const s = _lgInit(), d = (n) => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10), c = s.cases[0];
  Object.assign(c, { court: 'المحكمة التجارية بالرياض', law: 'نظام المعاملات المدنية + بنود العقد', intl: 'no',
    issues: [{ q: 'هل يحق للموكل المطالبة بكامل المستحقات رغم ادعاء العيوب؟', src: 'نظام المعاملات المدنية', pro: 'محضر استلام موقع دون تحفظ', con: 'خطاب الخصم بادعاء عيوب في الدفعة الثانية' }, { q: 'هل يستحق الموكل تعويضًا عن التأخير في السداد؟', src: 'بند الغرامات في العقد', pro: 'كشف الحساب يثبت تأخيرًا يتجاوز 90 يومًا', con: 'لم يُرسل إخطار رسمي بالتأخير في حينه' }],
    tx: [[-60, 'استلام', 1, 'فتح الملف واستلام العقد وطلب الموكل', 'أ. سارة', 0], [-59, 'أتعاب', 1, 'أتعاب المرحلة الأولى', 'الإدارة المالية', 20000], [-58, 'دفعة', 1, 'سداد الموكل للدفعة الأولى', 'شركة النخبة للتجارة', 20000], [-57, 'قرار', 2, 'فحص تضارب المصالح — لا تضارب', 'لجنة التضارب', 0], [-55, 'إجراء', 2, 'تحديد الاختصاص: المحكمة التجارية، والقانون الواجب التطبيق', 'أ. سارة', 0], [-50, 'دليل', 4, 'استلام محضر الاستلام وكشف الحساب وتوثيق البصمة الرقمية', 'أ. سارة', 0], [-45, 'مراسلة', 3, 'خطاب من الخصم يدعي عيوبًا في الدفعة الثانية', 'مؤسسة الأفق', 0], [-40, 'بحث قانوني', 5, 'التحقق من نفاذ نظام المعاملات المدنية والنسخة السارية', 'أ. سارة', 0], [-30, 'مصروف', 4, 'ترجمة وتصديق مستندات', 'أ. سارة', 3500], [-20, 'إجراء', 7, 'تقدير مسارات التفاوض والوساطة والتحكيم والتقاضي', 'أ. سارة', 0], [-10, 'جلسة', 7, 'جلسة تفاوض أولى — لم يُتفق على التسوية', 'أ. سارة', 0], [-5, 'أتعاب', 7, 'أتعاب مرحلة الوساطة', 'الإدارة المالية', 21000]]
      .map(([n, k, st, x, by, amt]) => ({ d: d(n), k, st, x, by, amt, void: false })) });
  c.evid.forEach((e, i) => Object.assign(e, i ? { at: d(-48) + ' 11:20 (GMT+3)', by: 'فريق تقنية الموكل', basis: 'موافقة الموكل على مراسلاته', sha: '' } : { at: d(-50) + ' 09:40 (GMT+3)', by: 'أ. سارة', basis: 'مستند مقدم من الموكل', sha: '9f2c41ab07de55e1c3b8a6f0d2e47c19b5a8e3f6d1c0b9a8e7f6d5c4b3a2918' }));
  const c4 = s.cases[3]; if (c4) c4.tx = [[-2, 'استلام', 1, 'بلاغ الموكل باختراق المتجر ورسالة ابتزاز', 'أ. محمد', 0], [-1, 'دليل', 4, 'طلب حفظ سجلات الخادم ورسائل الابتزاز قبل أي تعديل', 'أ. محمد', 0]].map(([n, k, st, x, by, amt]) => ({ d: d(n), k, st, x, by, amt, void: false }));
  return s;
};
const _lgEnsure = lgEnsure;
lgEnsure = function (s) {
  _lgEnsure(s);
  s.cases.forEach(c => {
    if (!Array.isArray(c.tx)) c.tx = []; if (!Array.isArray(c.issues)) c.issues = [];
    ['court', 'law'].forEach(k => { if (c[k] == null) c[k] = ''; }); if (!c.intl) c.intl = 'no'; if (!c.ver) c.ver = 0;
    c.evid.forEach(e => ['at', 'by', 'basis', 'sha'].forEach(k => { if (e[k] == null) e[k] = ''; }));
  });
};
function lgNewTx(c) { return { d: lgToday(), k: 'إجراء', st: Math.max(1, lgModel().steps.findIndex(x => !x) + 1) || 10, x: '', by: c.owner || '', amt: 0, void: false }; }

/* ---------- model ---------- */
const _lgModel = lgModel;
lgModel = function () {
  const m = _lgModel(), s = m.s, c = m.c;
  const srcs = c.srcs, rulings = srcs.filter(x => x.t === 'حكم قضائي'), juris = !!(c.country && c.court && c.law);
  const issuesOk = c.issues.filter(x => x.q && x.src).length;
  const pathsOn = m.paths.length, live = c.tx.filter(t => !t.void);
  m.steps = [!!(c.client && c.type && c.country && c.t), juris, m.nF > 0 && m.aiNoSrc === undefined ? true : m.nF > 0, c.evid.length > 0 && m.evOk === c.evid.length, srcs.length > 0, srcs.length > 0 && m.srcOk === srcs.length && issuesOk > 0, pathsOn > 0, false, !!m.reviewed, false];
  m.steps[2] = m.nF > 0 && c.facts.every(f => f.k !== 'ai' || String(f.s || '').trim());
  m.steps[7] = m.steps.slice(0, 7).every(Boolean);
  m.steps[9] = !!m.reviewed && c.ver > 0 && !!c.owner;
  m.curStep = m.steps.findIndex(x => !x);
  // transactions
  const sum = (k) => live.filter(t => t.k === k).reduce((a, t) => a + egN(t.amt), 0);
  m.tx = { live, n: live.length, fees: sum('أتعاب'), exp: sum('مصروف'), paid: sum('دفعة'), last: [...live].sort((a, b) => String(b.d).localeCompare(String(a.d)))[0], perStep: LG_STEPS.map((_, i) => live.filter(t => +t.st === i + 1).length) };
  m.tx.due = m.tx.fees + m.tx.exp - m.tx.paid;
  // governance rules (doc §7) — each: [rule, pass, evidence]
  const weakEv = c.evid.filter(e => e.hash !== 'yes' || e.chain !== 'yes'), aiNoSrc = c.facts.filter(f => f.k === 'ai' && !String(f.s || '').trim());
  const unverRul = rulings.filter(x => x.st !== 'in' || x.link !== 'yes');
  m.rules = [
    ['لا رأي قانوني جوهري بلا مصادر قابلة للتحقق', srcs.length > 0 && m.srcOk > 0, srcs.length ? `${m.srcOk} من ${srcs.length} مصدر نافذ ومتحقق منه` : 'لا مصادر مسجلة'],
    ['لا استشهاد بحكم دون التحقق من هويته ومصدره وسياقه', !unverRul.length, rulings.length ? (unverRul.length ? `${unverRul.length} حكم غير متحقق منه` : 'كل الأحكام متحقق منها') : 'لا أحكام مستشهد بها'],
    ['لا تطبيق لقانون دولة قبل تحديد الاختصاص والقانون الواجب التطبيق', juris, juris ? `${c.country} · ${c.court} · ${c.law}` : 'الدولة أو المحكمة أو القانون الواجب التطبيق غير محدد'],
    ['لا خلط بين الادعاء والواقعة المثبتة والاستنتاج التحليلي', !aiNoSrc.length && m.nF > 0, m.nF ? `${m.nP} مثبتة · ${m.nC} ادعاء · ${m.nA} استنتاج${aiNoSrc.length ? ` (${aiNoSrc.length} بلا مصدر)` : ''}` : 'لا وقائع مسجلة'],
    ['لا اختلاق لنصوص أو أرقام مواد أو أحكام — لكل مصدر اسم ورابط رسمي', srcs.length > 0 && srcs.every(x => String(x.n || '').trim() && x.link === 'yes'), `${srcs.filter(x => x.link === 'yes').length} من ${srcs.length} برابط رسمي`],
    ['لا قرار أو حكم نهائي يصدره النظام بصورة مستقلة — اعتماد بشري', !!m.reviewed, m.reviewed ? 'اعتمده ' + c.review.by : 'بانتظار مراجعة المحامي المخوّل'],
    ['لا استخدام لبيانات سرية خارج الصلاحيات — فحص التضارب والسرية', c.conflict === 'done', (LG_CONF.find(q => q[0] === c.conflict) || [, ''])[1]],
    ['لا تعديل أو حذف صامت للأدلة أو السجلات', weakEv.length === 0, weakEv.length ? `${weakEv.length} دليل بلا بصمة أو سلسلة حيازة مكتملة` : 'الأدلة موثقة · الحركات الملغاة تبقى ظاهرة'],
    ['لا توصية عالية المخاطر دون أدلة وقيود ومراجعة', !pathsOn || (!!m.reviewed && weakEv.length === 0), pathsOn ? `${pathsOn} مسار مقيّم` : 'لا توصية بعد']];
  m.rulesOk = m.rules.filter(r => r[1]).length;
  const conflicting = srcs.some(x => x.st === 'repealed' || x.st === 'draft') || (srcs.length && m.srcOk < srcs.length / 2);
  m.refuse = !srcs.length ? 'لا توجد مصادر قانونية مسجلة' : conflicting ? 'المصادر متضاربة أو قديمة أو غير مؤكدة الحالة' : !juris ? 'الاختصاص والقانون الواجب التطبيق غير محددين' : '';
  m.final = m.rulesOk === m.rules.length && !m.refuse;
  // strengths & weaknesses
  m.strong = [...c.facts.filter(f => f.k === 'proven').map(f => `واقعة مثبتة: ${f.x} (${f.s || 'دليل'})`), ...c.issues.filter(x => x.pro).map(x => `${x.q} — ${x.pro}`), ...c.evid.filter(e => e.hash === 'yes' && e.chain === 'yes').map(e => `دليل سليم السلسلة: ${e.n}`)];
  m.weak = [...c.facts.filter(f => f.k === 'claim').map(f => `ادعاء يحتاج إثباتًا: ${f.x}`), ...c.issues.filter(x => x.con).map(x => `${x.q} — ${x.con}`), ...weakEv.map(e => `دليل ناقص: ${e.n} (${e.hash !== 'yes' ? 'بلا بصمة' : ''}${e.hash !== 'yes' && e.chain !== 'yes' ? '، ' : ''}${e.chain !== 'yes' ? 'سلسلة حيازة ناقصة' : ''})`), ...srcs.filter(x => x.st !== 'in').map(x => `مصدر ${(LG_SRC_ST.find(q => q[0] === x.st) || [, ''])[1]}: ${x.n}`), ...aiNoSrc.map(f => `استنتاج آلي بلا مصدر: ${f.x}`)];
  m.engines = LG_ENG.filter(e => e[4].test(c.type) || (e[0] === '10' && c.intl === 'yes') || (e[0] === '06' && c.evid.length));
  return m;
};

/* ---------- flowchart (SVG) ---------- */
function lgFlowSvg(m) {
  const W = 360, X = 70, NW = 220, NH = 36, GAP = 16, st = m.steps, cur = m.curStep, c = m.c;
  const rows = []; LG_STEPS.forEach(([n], i) => { rows.push({ t: 'n', i, n }); if (i === 4) rows.push({ t: 'd', n: 'المصادر نافذة ومتحقق منها؟', ok: c.srcs.length > 0 && m.srcOk === c.srcs.length, back: 4 }); if (i === 8) rows.push({ t: 'd', n: 'اعتُمد التقرير؟', ok: !!m.reviewed, back: 5 }); });
  let y = 14; rows.forEach(r => { r.h = r.t === 'd' ? 44 : NH; r.y = y; y += r.h + GAP; });
  const H = y + 4, mid = X + NW / 2;
  const col = (i) => st[i] ? ['var(--greenfg)', 'rgba(52,199,89,.12)'] : i === cur ? ['var(--yellow)', 'rgba(255,205,17,.12)'] : ['var(--line3)', 'transparent'];
  const nodeY = (i) => rows.find(r => r.t === 'n' && r.i === i);
  let g = `<defs><marker id="lgA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--faint)"/></marker><marker id="lgR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--redsoft)"/></marker></defs>`;
  rows.forEach((r, k) => {
    const nx = rows[k + 1];
    if (nx) g += `<line x1="${mid}" y1="${r.y + r.h}" x2="${mid}" y2="${nx.y - 1}" stroke="var(--faint)" stroke-width="1.3" marker-end="url(#lgA)"/>`;
    if (r.t === 'n') {
      const [s, f] = col(r.i), n = m.tx.perStep[r.i];
      g += `<rect x="${X}" y="${r.y}" width="${NW}" height="${NH}" rx="9" fill="${f}" stroke="${s}" stroke-width="${r.i === cur ? 2 : 1.3}"/>`;
      g += `<text x="${X + NW - 12}" y="${r.y + NH / 2 + 4.5}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fg)">${String(r.i + 1).padStart(2, '0')} · ${esc(r.n)}</text>`;
      g += `<text x="${X + 14}" y="${r.y + NH / 2 + 4}" text-anchor="middle" font-size="12" fill="${s}">${st[r.i] ? '✓' : r.i === cur ? '●' : '○'}</text>`;
      if (n) g += `<circle cx="${X + NW + 18}" cy="${r.y + NH / 2}" r="11" fill="var(--raised)" stroke="var(--line2)"/><text x="${X + NW + 18}" y="${r.y + NH / 2 + 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--fg)">${n}</text>`;
    } else {
      const cx = mid, cy = r.y + r.h / 2, w = 118, h = r.h / 2, s = r.ok ? 'var(--greenfg)' : 'var(--orange)';
      g += `<path d="M${cx} ${cy - h}L${cx + w} ${cy}L${cx} ${cy + h}L${cx - w} ${cy}z" fill="var(--sunk)" stroke="${s}" stroke-width="1.3"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11.5" fill="var(--fg)">${esc(r.n)}</text>`;
      const tgt = nodeY(r.back), lx = 22;
      g += `<path d="M${cx - w} ${cy} H${lx} V${tgt.y + NH / 2} H${X - 2}" fill="none" stroke="var(--redsoft)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#lgR)"/><text x="${lx + 6}" y="${cy - 5}" font-size="10" fill="var(--redsoft)">لا</text><text x="${cx + 6}" y="${cy + h + 12}" font-size="10" fill="var(--greenfg)">نعم</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="مخطط سير القضية ${esc(c.ref)}">${g}</svg>`;
}

/* ---------- tab: سير القضية والحركات ---------- */
function lgFlowOut(m) {
  const c = m.c, cur = m.s.cur || '', T = m.tx, step = m.curStep >= 0 ? LG_STEPS[m.curStep][0] : 'مكتملة';
  const byKind = LG_TX.map(k => [k, T.live.filter(t => t.k === k)]).filter(([, l]) => l.length);
  const list = c.tx.map((t, j) => ({ t, j })).sort((a, b) => String(b.t.d).localeCompare(String(a.t.d)));
  return egCard(`سير القضية والحركات — ${esc(c.ref)} · ${esc(c.t)}`, 'LEGAL-FLOW', `${anKpis([['المرحلة الحالية', step, m.curStep < 0 ? 'good' : ''], ['مراحل مكتملة', m.steps.filter(Boolean).length + ' من 10'], ['عدد الحركات', T.n], ['آخر حركة', T.last ? T.last.d : '—'], ['الأتعاب والمصروفات', fmtN(T.fees + T.exp, 0) + ' ' + cur], ['المدفوع', fmtN(T.paid, 0) + ' ' + cur], ['المستحق على الموكل', fmtN(T.due, 0) + ' ' + cur, T.due > 0 ? 'bad' : 'good']])}
    <div class="lg-flow"><div class="sub" style="padding:10px">${lgFlowSvg(m)}<span class="faint" style="font-size:11px;display:block;margin-top:6px">✓ مكتملة · ● المرحلة الحالية · ○ لم تبدأ · الرقم الجانبي = حركات المرحلة · الخط الأحمر = العودة عند عدم تحقق الشرط</span></div>
    <div class="stack" style="gap:14px">${anTbl({ h: 'المراحل العشر — ما يُكملها وعدد حركاتها', cols: ['المرحلة', 'الحالة', 'الحركات', 'متطلب الإكمال'], rows: LG_STEPS.map(([n, d], i) => [String(i + 1).padStart(2, '0') + ' ' + n, m.steps[i] ? 'مكتملة' : i === m.curStep ? 'جارية' : 'لم تبدأ', String(T.perStep[i]), d]) })}
    ${anTbl({ h: 'ملخص الحركات حسب النوع', cols: ['النوع', 'العدد', 'المبلغ'], rows: byKind.map(([k, l]) => [k, String(l.length), LG_MONEY[k] ? fmtN(l.reduce((a, t) => a + egN(t.amt), 0), 0) + ' ' + cur : '—']) })}</div></div>
    <div class="stack" style="gap:6px"><span class="lbl">سجل حركات القضية (الأحدث أولًا)</span>${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>المرحلة</th><th>البيان</th><th>بواسطة</th><th>المبلغ</th></tr></thead><tbody>${list.map(({ t }) => `<tr class="${t.void ? 'lg-tx-void' : ''}"><td class="mono">${esc(t.d || '—')}</td><td>${esc(t.k)}</td><td>${esc((LG_STEPS[+t.st - 1] || ['—'])[0])}</td><td>${esc(t.x || '—')}${t.void ? ' <span class="tag t-c">ملغاة</span>' : ''}</td><td>${esc(t.by || '—')}</td><td class="mono">${LG_MONEY[t.k] ? (t.k === 'دفعة' ? '−' : '') + fmtN(egN(t.amt), 0) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="banner y">لا حركات بعد — أضف أول حركة (استلام الملف).</div>'}</div>
    ${egNote('كل حركة مرتبطة بمرحلة من المراحل العشر، فيظهر في المخطط أين وصلت القضية وما الذي تم في كل مرحلة. الحركة لا تُحذف: الإلغاء يُبقيها ظاهرة مشطوبة في السجل (لا تعديل أو حذف صامت). المستحق = الأتعاب + المصروفات − الدفعات.')}`);
}
function lgExtraInputs(s) {

}

/* ---------- tab: التقرير النهائي ---------- */
function lgReportSections(m) {
  const c = m.c, s = m.s, cur = s.cur || '', best = m.paths[0], T = m.tx;
  const SRC = (x) => (LG_SRC_ST.find(q => q[0] === x.st) || [, ''])[1];
  return [
    { h: '1. ملخص القضية', kv: kvx([['القضية', c.ref + ' · ' + c.t], ['الموكل', c.client || '—'], ['الطرف الآخر', c.party || '—'], ['نوع القضية', c.type], ['المرحلة', c.stage], ['طلب الموكل', c.t], ['المسؤول', c.owner || '—']]) },
    { h: '2. الولاية القضائية', kv: kvx([['الدولة', c.country || '—'], ['المحكمة أو الجهة', c.court || 'غير محددة'], ['القانون الواجب التطبيق', c.law || 'غير محدد'], ['عنصر دولي / تنازع قوانين', c.intl === 'yes' ? 'نعم — يحتاج تحليل تنازع القوانين' : 'لا']]) },
    { h: '3. الوقائع والأدلة — ما ثبت وما ادُّعي وما لم يُتحقق منه', cols: ['البيان', 'التصنيف', 'المصدر / الدليل'], rows: c.facts.map(f => [f.x, (LG_FACT.find(q => q[0] === f.k) || [, ''])[1], f.s || 'غير متحقق']) },
    { h: 'سجل الأدلة', cols: ['الدليل', 'المصدر', 'وقت الحصول', 'جمعه', 'الأساس القانوني', 'البصمة', 'سلسلة الحيازة'], rows: c.evid.map(e => [e.n, e.s || '—', e.at || '—', e.by || '—', e.basis || '—', e.hash === 'yes' ? (e.sha ? String(e.sha).slice(0, 16) + '…' : 'موثقة') : 'غير موثقة', e.chain === 'yes' ? 'مكتملة' : 'ناقصة']) },
    { h: '4. الأساس القانوني', cols: ['النص', 'النوع', 'الدولة', 'حالة النفاذ', 'آخر تحقق', 'رابط رسمي'], rows: c.srcs.filter(x => x.t !== 'حكم قضائي').map(x => [x.n, x.t, x.c, SRC(x), x.v || '—', x.link === 'yes' ? 'نعم' : 'لا']) },
    { h: '5. الأحكام المقارنة', cols: ['الحكم', 'الدولة', 'الحالة', 'آخر تحقق', 'الصلة بالقضية'], rows: c.srcs.filter(x => x.t === 'حكم قضائي').map(x => [x.n, x.c, SRC(x), x.v || '—', x.st === 'in' && x.link === 'yes' ? 'صالح للاستشهاد' : 'لا يُستشهد به قبل التحقق من هويته ومصدره وسياقه']) },
    { h: '6. التحليل — تطبيق القواعد على الوقائع', cols: ['المسألة', 'النص المنطبق', 'ما يؤيد', 'التفسير البديل / ما يعارض'], rows: c.issues.map(x => [x.q || '—', x.src || 'غير محدد', x.pro || '—', x.con || '—']) },
    { h: '7. نقاط القوة والضعف', cols: ['النوع', 'البيان'], rows: [...m.strong.map(x => ['قوة', x]), ...m.weak.map(x => ['ضعف / فجوة', x])] },
    { h: '8. المخاطر والمواعيد', cols: ['المستوى', 'الإشارة', 'الدليل', 'الإجراء'], rows: m.alerts.filter(a => a.x.c === c).map(a => [lgLvl[a.lvl][1], a.what, a.ev, a.todo]).concat(c.due ? [['—', 'الموعد القادم', c.due + ' · ' + (c.next || ''), 'يحتاج تأكيدًا محليًا وفق قواعد الإجراءات']] : []) },
    { h: '9. البدائل', cols: ['المسار', 'احتمال النجاح (تقدير المحامي)', 'التكلفة', 'المدة (شهر)', 'القيمة الصافية المتوقعة'], rows: m.paths.map(x => [x.n, fmtN(x.pr * 100, 0) + '%', fmtN(x.cost, 0) + ' ' + cur, fmtN(x.m, 0), fmtN(x.ev, 0) + ' ' + cur]) },
    { h: '10. التوصيات', bullets: m.refuse ? [`يمتنع النظام عن نتيجة حاسمة: ${m.refuse}. المطلوب استكمال المصادر والتحقق منها قبل أي توصية.`] : best ? [`المسار المقترح: ${best.n} — صافي متوقع ${fmtN(best.ev, 0)} ${cur} خلال ${fmtN(best.m, 0)} شهر.`, `المبررات: أعلى قيمة متوقعة بين ${m.paths.length} مسار مقيّم، بشرط صحة تقديرات الاحتمال والتكلفة ونفاذ المصادر (${m.srcOk} من ${c.srcs.length}).`, `الجهة المخوّلة بالاعتماد: ${c.review.by || 'المحامي المسؤول — لم يُعتمد بعد'}.`] : ['لم تُقيَّم مسارات بعد — أدخل تقديرات المسارات في «البدائل وتسوية النزاع».'] },
    { h: '11. مستوى الثقة', kv: kvx([['مستوى الثقة', m.conf + '%'], ['وقائع مثبتة', m.nP + ' من ' + m.nF], ['مصادر نافذة متحقق منها', m.srcOk + ' من ' + c.srcs.length], ['أدلة سليمة السلسلة', m.evOk + ' من ' + c.evid.length], ['القيود', 'الاحتمالات تقديرات بشرية؛ لا يختلق النظام نصًا أو حكمًا؛ المواعيد تحتاج تأكيدًا محليًا']]) },
    { h: '12. المراجعة والاعتماد', kv: kvx([['المراجع المخوّل', c.review.by || '—'], ['تاريخ المراجعة', c.review.at || '—'], ['القرار', m.reviewed ? 'اعتُمد بعد المراجعة' : 'لم يُعتمد بعد'], ['الإصدار', 'v' + ((c.ver || 0) + 1)], ['حالة التقرير', m.final ? 'تقرير نهائي معتمد' : 'مسودة — لا يُعتمد عليه']]) },
    { h: 'ملحق أ — سجل حركات القضية', cols: ['التاريخ', 'النوع', 'المرحلة', 'البيان', 'بواسطة', 'المبلغ'], rows: [...c.tx].sort((a, b) => String(a.d).localeCompare(String(b.d))).map(t => [t.d || '—', t.k + (t.void ? ' (ملغاة)' : ''), (LG_STEPS[+t.st - 1] || ['—'])[0], t.x || '—', t.by || '—', LG_MONEY[t.k] ? fmtN(egN(t.amt), 0) : '—']) },
    { h: 'ملحق ب — سير القضية', cols: ['المرحلة', 'الحالة', 'الحركات'], rows: LG_STEPS.map(([n], i) => [String(i + 1).padStart(2, '0') + ' ' + n, m.steps[i] ? 'مكتملة' : i === m.curStep ? 'جارية' : 'لم تبدأ', String(T.perStep[i])]) },
    { h: 'ملحق ج — الضوابط الحاكمة الإلزامية', cols: ['القاعدة', 'النتيجة', 'الدليل'], rows: m.rules.map(r => [r[0], r[1] ? 'مستوفاة' : 'غير مستوفاة', r[2]]) },
    { h: 'ملحق د — المحركات المستخدمة', cols: ['المحرك', 'النطاق'], rows: m.engines.map(e => [e[0] + ' ' + e[1], e[3]]) }];
}
function lgFinalOut(m) {
  const c = m.c, secs = lgReportSections(m);
  const head = m.final ? `<div class="banner g" style="font-size:13px">${ic('check', 16)}<span>تقرير نهائي — استوفى الضوابط التسع واعتمده ${esc(c.review.by)}. جاهز للإصدار.</span></div>`
    : m.refuse ? `<div class="banner" style="font-size:13px;background:rgba(255,46,77,.08);border:1px solid rgba(255,46,77,.3)">${ic('warn', 16, 'style="color:var(--redsoft)"')}<span><b>يمتنع النظام عن نتيجة حاسمة:</b> ${esc(m.refuse)}. يمكن إصدار مسودة فقط.</span></div>`
    : `<div class="banner y" style="font-size:13px">${ic('warn', 16)}<span>مسودة — ${m.rules.length - m.rulesOk} من الضوابط الحاكمة غير مستوفاة. التقرير يصدر بعلامة «مسودة» حتى استيفائها.</span></div>`;
  const view = (x) => x.kv ? `<div class="stack" style="gap:6px"><span class="lbl">${esc(x.h)}</span>${egGrid(200, x.kv.map(([a, b]) => `<div class="sub" style="gap:2px;padding:8px 11px"><span class="faint" style="font-size:11px">${esc(a)}</span><b style="font-size:13px">${esc(b)}</b></div>`).join(''))}</div>`
    : x.bullets ? `<div class="stack" style="gap:6px"><span class="lbl">${esc(x.h)}</span>${x.bullets.map(b => `<p style="margin:0;font-size:13px;line-height:1.8">• ${esc(b)}</p>`).join('')}</div>` : anTbl(x);
  return egCard(`التقرير النهائي — ${esc(c.ref)} · ${esc(c.t)}`, 'LEGAL-REPORT', `${anKpis([['حالة التقرير', m.final ? 'نهائي' : 'مسودة', m.final ? 'good' : 'bad'], ['الضوابط الحاكمة', m.rulesOk + ' من ' + m.rules.length, m.rulesOk === m.rules.length ? 'good' : 'bad'], ['مستوى الثقة', m.conf + '%', m.conf >= 70 ? 'good' : 'bad'], ['المراحل المكتملة', m.steps.filter(Boolean).length + ' من 10'], ['المحركات المستخدمة', m.engines.length + ' من 15']])}
    ${head}
    <div class="stack" style="gap:2px"><span class="lbl">الضوابط الحاكمة الإلزامية</span>${m.rules.map(r => `<div class="lg-rule"><span style="color:${r[1] ? 'var(--greenfg)' : 'var(--orange)'};font-weight:700">${r[1] ? '✓' : '✗'}</span><span><b>${esc(r[0])}</b><span class="faint" style="display:block;font-size:11.5px">${esc(r[2])}</span></span></div>`).join('')}</div>
    ${secs.slice(0, 13).map(view).join('')}
    ${egNote('القاعدة الحاكمة: النظام يحلل ويقترح ويجهّز؛ والجهة المخوّلة تعتمد؛ والنظام يوثّق؛ والمراجع يتحقق من النتيجة. ملحقات سجل الحركات وسير القضية والضوابط والمحركات تُضاف إلى ملف PDF وExcel.')}`);
}
async function lgIssue(fmt) {
  const m = lgModel(), c = m.c, s = m.s;
  const rep = { code: 'LEGAL_' + c.ref, title: `التقرير القانوني النهائي — ${c.ref}${m.final ? '' : ' (مسودة)'}`, audience: (c.client || 'الموكل') + ' — المحامي المسؤول', ref: c.ref, sections: lgReportSections(m) };
  toast(fmt === 'pdf' ? 'جارٍ إعداد ملف PDF…' : 'جارٍ إعداد ملف Excel…');
  try {
    const blob = fmt === 'pdf' ? await buildPdf(rep) : buildXlsx(rep);
    c.ver = (c.ver || 0) + 1;
    c.tx.push({ d: lgToday(), k: 'مستند', st: m.final ? 10 : 8, x: `إصدار التقرير ${m.final ? 'النهائي' : 'المسودة'} v${c.ver} (${fmt === 'pdf' ? 'PDF' : 'Excel'})`, by: (typeof expUser === 'function' ? expUser() : '') || 'د. عدنان', amt: 0, void: false });
    save(); render();
    await (typeof rdSaveAs === 'function' ? rdSaveAs : saveFile)(`NAIOSH_${c.ref}_report_v${c.ver}.${fmt}`, blob, fmt);
  } catch (e) { console.error(e); toast('تعذّر إنشاء الملف'); }
}

/* ---------- gov tab: engines, layers, quality ---------- */
function lgEnginesCard() {
  const m = lgModel(), on = new Set(m.engines.map(e => e[0]));
  return egCard('المحركات القانونية والتحليلية الخمسة عشر', 'LEGAL-ENG', `<span class="faint" style="font-size:12px">المضاءة مستخدمة في القضية المختارة (${esc(m.c.ref)} · ${esc(m.c.type)})</span>${egGrid(210, LG_ENG.map(([n, t, en, d]) => `<div class="sub" style="gap:3px;${on.has(n) ? 'border-color:var(--greenline)' : 'opacity:.7'}"><span class="row nowrap" style="gap:7px"><span class="mono" style="color:${on.has(n) ? 'var(--greenfg)' : 'var(--yellow)'};font-size:11px">${n}</span><b style="font-size:12.5px">${t}</b></span><span class="mono faint" style="font-size:9.5px">${en}</span><span class="faint" style="font-size:11px">${d}</span></div>`).join(''))}
    <span class="lbl" style="margin-top:6px">طبقات التعامل مع قوانين الدول</span>${egGrid(210, LG_LAYERS.map(([n, t, d]) => `<div class="sub" style="gap:3px"><b style="font-size:12.5px"><span class="mono" style="color:var(--yellow)">${n}</span> · ${t}</b><span class="faint" style="font-size:11px">${d}</span></div>`).join(''))}
    ${egNote('لا توضع قوانين كل الدول في قاعدة واحدة: نواة عالمية مشتركة، وطبقة مستقلة لكل دولة، وطبقات بحسب المحكمة والقطاع ونوع القضية. ولا يُخلط بين قانون نافذ ومشروع قانون وحكم ابتدائي ونهائي ومبدأ ملزم ورأي فقهي.')}`);
}
function lgQualityHtml(m) {
  const all = m.s.cases, srcs = all.flatMap(c => c.srcs), ev = all.flatMap(c => c.evid), pct = (a, b) => b ? fmtN(a / b * 100, 0) + '%' : '—';
  const verified = srcs.filter(x => x.st === 'in' && x.link === 'yes').length, stale = srcs.filter(x => x.st === 'repealed' || x.st === 'amend' || x.st === 'unk').length;
  const reviewed = all.filter(c => c.review && c.review.ok === 'yes' && String(c.review.by || '').trim()).length, evFull = ev.filter(e => e.hash === 'yes' && e.chain === 'yes').length;
  return `<div class="stack" style="gap:6px"><span class="lbl">مؤشرات الجودة الفعلية — لا عدد التقارير</span>${anKpis([['استشهادات متحقق منها', pct(verified, srcs.length), verified === srcs.length ? 'good' : 'bad'], ['نصوص ملغاة/قديمة اكتُشفت', stale, stale ? 'bad' : 'good'], ['تحليلات اجتازت مراجعة المحامي', pct(reviewed, all.length)], ['أدلة بسجل حيازة مكتمل', pct(evFull, ev.length), evFull === ev.length ? 'good' : 'bad'], ['حركات موثقة', all.reduce((a, c) => a + (c.tx || []).filter(t => !t.void).length, 0)]])}</div>`;
}

/* ---------- events ---------- */
const _lgH = engine4Handle;
engine4Handle = function (act, k, el) {
  if (act === 'lg-add' && k === 'tx') S.lgTxOpen = true;
  if (act === 'lg-final') { lgIssue(k === 'xlsx' ? 'xlsx' : 'pdf'); return true; }
  return _lgH(act, k, el);
};
document.addEventListener('toggle', (e) => { if (e.target && e.target.dataset && e.target.dataset.lgTx) S.lgTxOpen = e.target.open; }, true);
document.addEventListener('change', (e) => {
  const el = e.target; if (!el.dataset || el.dataset.eg !== 'legal') return;
  if (/\.tx\.\d+\.st$/.test(el.dataset.p)) { egSet(egS('legal'), el.dataset.p, +el.value); save(); render(); }
  else if (/\.tx\.\d+\.k$/.test(el.dataset.p) || /\.(intl)$/.test(el.dataset.p)) render();
});
</script>
