<script data-app="">
/* ================= حالة النظام (admin) =================
   Storage (is the data on a persistent volume?), automatic backups + download, verification/payment modes,
   and the AI switch: key present, mode, monthly spend against the cap, pause/resume, connection test. */
(function () { const g = NAV.find(x => x.items.some(([id]) => id === 'feed')) || NAV[NAV.length - 1]; if (!g.items.some(([id]) => id === 'system')) g.items.splice(1, 0, ['system', 'حالة النظام', 'SYS']); })();
TITLES.system = ['للإدارة فقط · التخزين والنسخ والذكاء الاصطناعي', 'حالة النظام'];
Object.assign(P, { system: P.system || 'M4 5h16v10H4z M8 19h8 M12 15v4 M7 9l2 2 3-3 2 2 3-3' });
let SYS = null, SYS_BUSY = '';
const sysSize = (b) => b == null ? '—' : b > 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const sysDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('ar', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
async function sysLoad() { try { SYS = await api('GET', '/api/admin/system'); } catch (e) { SYS = { error: e.message }; } if (S.route === 'system') render(); }
const AI_REASON = { no_key: 'لم يُضف مفتاح ANTHROPIC_API_KEY في متغيرات Railway.', off: 'المفتاح موجود لكن AI_MODE=off — غيّره إلى ask لتشغيل المرحلة الأولى.', paused: 'موقوف مؤقتًا من هذه الصفحة.', cap: 'وصل إنفاق هذا الشهر إلى السقف AI_MONTHLY_USD — يعود مع بداية الشهر أو برفع السقف.' };
function sysCard(title, tag, body) { return `<section class="card" style="gap:12px"><div class="row between nowrap" style="gap:10px"><h2 class="h-sec">${title}</h2><span class="tag t-i">${tag}</span></div>${body}</section>`; }
VIEWS.system = () => {
  const head = `<section class="stack" style="gap:6px"><h2 class="pg-title">حالة النظام</h2><p class="lead" style="margin:0">هل البيانات محفوظة بأمان؟ متى آخر نسخة احتياطية؟ هل الذكاء الاصطناعي يعمل وكم أنفق هذا الشهر؟ للإدارة فقط.</p></section>`;
  if (!rdServer()) return head + `<section class="card" style="gap:10px"><div class="banner y" style="font-size:13px">${ic('info', 16)}<span>هذه نسخة العرض التجريبي: لا يوجد خادم ولا قاعدة بيانات ولا ذكاء اصطناعي هنا. على الموقع الحقيقي تعرض هذه الصفحة حالة التخزين والنسخ الاحتياطية واستهلاك الذكاء الاصطناعي، مع أزرار «نسخة احتياطية الآن» و«اختبار الاتصال» و«إيقاف مؤقت».</span></div></section>`;
  if (typeof svCan === 'function' && !svCan('config.edit')) return head + `<section class="card"><p class="muted">هذه الصفحة لمدير النظام فقط.</p></section>`;
  if (!SYS) { sysLoad(); return head + `<section class="card"><p class="muted">جارٍ التحميل…</p></section>`; }
  if (SYS.error) return head + `<section class="card"><div class="banner y">${esc(SYS.error)}</div><button type="button" class="btn" data-act="sys-reload">إعادة المحاولة</button></section>`;
  const st = SYS.storage, a = SYS.ai, last = SYS.backups[0];
  const persist = st.persistent === true ? `<div class="banner g" style="font-size:13px">${ic('check', 16)}<span><b>البيانات على تخزين دائم${st.volume ? ' (Volume: ' + esc(st.volume) + ')' : ''}.</b> قاعدة البيانات والملفات تبقى بعد كل نشر جديد.</span></div>`
    : st.persistent === false ? `<div class="banner" style="font-size:13px;background:rgba(255,46,77,.08);border:1px solid rgba(255,46,77,.35);align-items:flex-start">${ic('warn', 16, 'style="color:var(--redsoft);margin-top:2px"')}<span><b>خطر: لا يوجد تخزين دائم.</b> عند أي نشر جديد على Railway تُحذف قاعدة البيانات وكل الملفات المرفوعة. الحل: في Railway أنشئ Volume واربطه بالخدمة على المسار <code>/data</code>، وأضف المتغير <code>RAILWAY_RUN_UID=0</code>، ثم أعد النشر.</span></div>`
    : `<div class="banner y" style="font-size:13px">${ic('info', 16)}<span>لا يمكن التأكد من أن المجلد دائم (خادم خاص). إذا كان على قرص دائم أضف المتغير <code>DATA_PERSISTENT=1</code>.</span></div>`;
  const aiState = a.available ? `<div class="banner g" style="font-size:13px">${ic('check', 16)}<span><b>الذكاء الاصطناعي يعمل</b> — «اسأل نايوش» يجيب عن الأسئلة الجديدة من الإجابات المدرّبة فقط، وكل إجابة تصل إليك هنا للمراجعة.</span></div>`
    : `<div class="banner y" style="font-size:13px">${ic('info', 16)}<span><b>الذكاء الاصطناعي غير مفعّل:</b> ${esc(AI_REASON[a.reason] || a.reason || '')}</span></div>`;
  const pct = a.capUsd > 0 ? Math.min(100, a.monthUsd / a.capUsd * 100) : 100;
  return head
  + sysCard('التخزين وقاعدة البيانات', 'STORAGE', `${persist}${anKpis([['قاعدة البيانات', sysSize(st.dbBytes)], ['الملفات المرفوعة', sysSize(st.uploads.bytes) + ' · ' + st.uploads.files + ' ملف'], ['المساحة المتاحة', sysSize(st.freeBytes)], ['مدة التشغيل', Math.floor(SYS.uptimeSec / 3600) + ' ساعة']])}<span class="faint mono" style="font-size:11px;direction:ltr;text-align:left">${esc(st.dataDir)} · Node ${esc(SYS.node)}</span>`)
  + sysCard('النسخ الاحتياطية', 'BACKUP', `${anKpis([['آخر نسخة', last ? sysDate(last.at) : 'لا يوجد بعد', last && Date.now() - Date.parse(last.at) < 26 * 3600e3 ? 'good' : 'bad'], ['عدد النسخ المحفوظة', SYS.backups.length + ' من ' + SYS.backupKeep], ['الجدولة', SYS.backupEveryHours > 0 ? 'كل ' + SYS.backupEveryHours + ' ساعة' : 'متوقفة']])}
      <div class="row" style="gap:8px"><button type="button" class="btn primary" data-act="sys-backup" ${SYS_BUSY === 'backup' ? 'aria-disabled="true"' : ''}>${ic('reports', 16)}${SYS_BUSY === 'backup' ? 'جارٍ النسخ…' : 'نسخة احتياطية الآن'}</button></div>
      ${SYS.backups.length ? `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الحجم</th><th></th></tr></thead><tbody>${SYS.backups.map(b => `<tr><td>${sysDate(b.at)}</td><td class="mono" dir="ltr" style="text-align:right">${sysSize(b.size)}</td><td><a class="btn sm" href="/api/admin/backup/${encodeURIComponent(b.name)}" download="${esc(b.name)}">${ic('down', 14)}تنزيل</a></td></tr>`).join('')}</tbody></table></div>` : ''}
      ${egNote('النسخة هنا لقاعدة البيانات (المستخدمون، الطلبات، التقارير المختومة، النقاط، الأسئلة المدرّبة) وتُحفظ داخل نفس التخزين. للحماية من فقدان التخزين نفسه: فعّل «Backups» على الـVolume في Railway (يومي وأسبوعي)، ونزّل نسخة أسبوعيًا واحفظها خارج Railway.')}`)
  + sysCard('الذكاء الاصطناعي (Claude)', 'AI', `${aiState}${anKpis([['المفتاح', a.keySet ? 'مضاف' : 'غير مضاف', a.keySet ? 'good' : 'bad'], ['الوضع AI_MODE', a.mode], ['إنفاق هذا الشهر (دولار)', a.monthUsd.toFixed(2) + ' / ' + a.capUsd, pct >= 90 ? 'bad' : 'good'], ['عدد الاستدعاءات', a.monthCalls], ['حد العميل اليومي', a.userDaily + ' سؤال'], ['النموذج', a.models.fast]])}
      <div class="stack" style="gap:4px"><div class="row between" style="font-size:12px"><span class="faint">الإنفاق من السقف الشهري</span><b class="mono">${pct.toFixed(0)}%</b></div><div style="height:8px;border-radius:99px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:${Math.max(1, pct)}%;background:${pct >= 90 ? 'var(--redsoft)' : pct >= 70 ? 'var(--yellow)' : 'var(--greenfg)'}"></div></div></div>
      <div class="row" style="gap:8px"><button type="button" class="btn" data-act="sys-ai-test" ${a.keySet ? '' : 'aria-disabled="true"'}>${ic('play', 16)}${SYS_BUSY === 'test' ? 'جارٍ الاختبار…' : 'اختبار الاتصال'}</button>${a.keySet ? `<button type="button" class="btn ${a.paused ? 'primary' : ''}" data-act="sys-ai-pause" data-k="${a.paused ? '0' : '1'}">${a.paused ? 'استئناف الذكاء الاصطناعي' : 'إيقاف مؤقت فوري'}</button>` : ''}</div>
      ${SYS.aiTest ? `<div class="banner ${SYS.aiTest.ok ? 'g' : 'y'}" style="font-size:12.5px">${SYS.aiTest.ok ? `الاتصال يعمل — ردّ النموذج «${esc(SYS.aiTest.reply)}» بتكلفة $${(SYS.aiTest.usd || 0).toFixed(5)}` : esc(SYS.aiTest.message || 'تعذّر الاتصال')}</div>` : ''}
      ${a.recent.length ? anTbl({ h: 'آخر الاستدعاءات', cols: ['الوقت', 'الاستخدام', 'النموذج', 'رموز الدخل', 'رموز الخرج', 'التكلفة', 'الحالة'], rows: a.recent.map(x => [sysDate(x.at), x.feature === 'ask' ? 'اسأل نايوش' : x.feature === 'test' ? 'اختبار' : x.feature, x.model, String(x.in_tokens), String(x.out_tokens), '$' + Number(x.cost_usd).toFixed(5), x.ok ? 'نجح' : 'فشل: ' + (x.error || '')]) }) : ''}
      ${egNote('المفتاح يبقى على الخادم ولا يصل للمتصفح. «اسأل نايوش» يجيب فقط من الإجابات المدرّبة، وإذا لم يجد الجواب يقول ذلك ولا يخترع. السقف الشهري والحد اليومي يُضبطان من متغيرات Railway: AI_MONTHLY_USD و AI_USER_DAILY.')}`)
  + sysCard('الخدمات المرتبطة', 'SERVICES', anTbl({ h: 'الوضع الحالي', cols: ['الخدمة', 'الوضع', 'للتشغيل الحقيقي'], rows: [['رموز التحقق (بريد وجوال)', SYS.verifyMode === 'live' ? 'حقيقي' : 'عرض — الرمز يظهر على الشاشة', 'RESEND_API_KEY و MAIL_FROM و TWILIO_SID و TWILIO_TOKEN و TWILIO_FROM ثم VERIFY_MODE=live'], ['الدفع وشحن النقاط', SYS.paymentMode === 'live' ? 'حقيقي' : 'عرض — بدون دفع فعلي', 'يحتاج اختيار بوابة الدفع وربطها'], ['عنوان الموقع APP_ORIGIN', SYS.appOrigin || 'غير مضبوط', 'https://النطاق-الخاص-بكم']] }));
};
const _sysH = analyticsHandle;
analyticsHandle = function (act, k, el) {
  if (act === 'sys-reload') { SYS = null; render(); return true; }
  if (act === 'sys-backup') { if (SYS_BUSY) return true; SYS_BUSY = 'backup'; render(); api('POST', '/api/admin/backup').then(r => { toast('تمت النسخة الاحتياطية · ' + sysSize(r.backup.size)); }).catch(e => toast(e.message)).finally(() => { SYS_BUSY = ''; sysLoad(); }); return true; }
  if (act === 'sys-ai-test') { if (SYS_BUSY || !SYS.ai.keySet) return true; SYS_BUSY = 'test'; render(); api('POST', '/api/admin/ai/test').then(r => { SYS.aiTest = r; }).catch(e => { SYS.aiTest = { ok: false, message: e.message }; }).finally(() => { SYS_BUSY = ''; const keep = SYS.aiTest; sysLoad().then(() => { if (SYS) SYS.aiTest = keep; render(); }); }); return true; }
  if (act === 'sys-ai-pause') { api('PATCH', '/api/admin/ai', { paused: k === '1' }).then(r => { SYS.ai = r.ai; toast(k === '1' ? 'أُوقف الذكاء الاصطناعي' : 'عاد الذكاء الاصطناعي للعمل'); render(); }).catch(e => toast(e.message)); return true; }
  return _sysH(act, k, el);
};
</script>
