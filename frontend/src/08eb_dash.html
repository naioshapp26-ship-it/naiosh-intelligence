const DZ_GENERIC = { id: '', name: 'بياناتك', icon: 'data', acc: '#FF2E4D', q: 'لوحة تحليل عامة', kpi: [] };
const dashTopic = (id) => DASH_TOPICS.find(t => t.id === id) || DZ_GENERIC;
const dashTopicsOfSystems = (sys) => (sys || []).map(s => DASH_TOPICS.find(t => t.sys === s)).filter(Boolean).map(t => t.id);
function dashPickFromReq(o) {
  const ids = dashTopicsOfSystems(o.systems), main = ids.find(i => i !== 'ext') || ids[0] || null;
  S.anPick = { topic: main, sys: ids, types: [...(o.types || [])], ref: o.ref || '', title: o.title || '' };
}
const dzType = (id) => (typeof RQ_TYPES !== 'undefined' ? RQ_TYPES.find(t => t.id === id) : null) || { id, label: (AN_TYPES.find(t => t[0] === id) || [, id])[1], icon: 'chart', q: '' };

/* ---------- indicators of the topic, matched to the file's columns ---------- */
function dashKpiCols(T, tp) {
  const nums = T.cols.filter(c => c.type === 'num'), used = new Set(), out = [];
  tp.kpi.forEach(([re, label, dir]) => { const c = nums.find(x => !used.has(x.name) && re.test(x.name)); if (c) { used.add(c.name); out.push({ col: c.name, label, dir, matched: true }); } });
  const missing = tp.kpi.filter(([re]) => !nums.some(x => re.test(x.name))).map(k => k[1]);
  nums.filter(c => !used.has(c.name)).forEach(c => out.push({ col: c.name, label: '', dir: DZ_LOWER.test(c.name) ? -1 : 1, matched: false }));
  return { list: out, matched: out.filter(k => k.matched).length, missing };
}
function dashApplyTopic() {
  if (!S.res || !AN || !AN.T) return;
  const k = dashKpiCols(AN.T, dashTopic(S.res.topic));
  const tg = k.list.find(x => x.matched && x.dir > 0);
  if (tg) S.res.cfg.target = tg.col;
  anCompute();
}
const _dzLoad = anLoad;

  if (!(o.types && o.types.length) && P.types && P.types.length) o.types = P.types;
  const T = _dzLoad(rows, name, kind, o);

/* ---------- small visual pieces ---------- */

  const pts = v.map((x, i) => X(i).toFixed(1) + ',' + Y(x).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="30" preserveAspectRatio="none" dir="ltr" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" style="fill:${color};opacity:.12"/><polyline points="${pts}" style="fill:none;stroke:${color};stroke-width:1.8;stroke-linejoin:round;vector-effect:non-scaling-stroke"/></svg>`;

// compact trend + 6-period forecast, drawn for a narrow panel
function dzTrend(c, acc) {

      <h2 class="dz-title" title="${esc(r.title || tp.q)}">${esc(r.title || tp.q)}</h2>
      <span class="dz-meta" title="${esc(r.src.name)}">${esc(r.src.name)} · ${fmtN(r.src.n, 0)} سجل · ${c.n} فترة${r.src.ref ? ' · ' + esc(r.src.ref) : ''}</span></div></div>
    <div class="dz-tabs" role="tablist" aria-label="نوع التحليل">${cfg.types.map(id => { const t = dzType(id); return `<button type="button" class="dz-tab" role="tab" data-act="an-dz-tab" data-k="${id}" aria-pressed="${id === r.tab}">${ic(t.icon, 15)}${esc(t.label)}</button>`; }).join('')}<button type="button" class="dz-tab add" data-act="an-dz-open">+ نوع أو موضوع</button></div>
    <div class="dz-tools">
      <span class="row nowrap" style="gap:6px" title="${esc(c.gate[1])}">${dzRing(c.conf, gateCol, 44)}<span class="faint" style="font-size:11px;line-height:1.3">الثقة</span></span>
      ${groups.length ? `<select data-an-cfg="focus" aria-label="نطاق التحليل"><option value="all">${esc('كل ' + (cfg.group || 'الوحدات'))}</option>${groups.map(g => `<option value="${esc(g)}" ${focus === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
      <label class="btn sm" style="cursor:pointer;position:relative">${ic('clip', 14)}ملف آخر<input type="file" data-an-upload="1" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer"></label>
      <button type="button" class="btn sm" data-act="an-pdf">${ic('reports', 14)}PDF</button><button type="button" class="btn sm" data-act="an-xlsx">${ic('chart', 14)}Excel</button>
    </div>
  </section>`;
  // 2. one row of indicators
  const tiles = K.list.slice(0, 6).map(k => {
    const s = anSeries(T, cfg, k.col, focus).y.filter(v => v !== null && isFinite(v)), w = c.w;
    const ch = pctCh(st.mean(s.slice(-2 * w, -w)), st.mean(s.slice(-w))), last = s[s.length - 1], on = k.col === cfg.target;
    const good = k.dir === 0 || !isFinite(ch) ? null : ch * k.dir > 0;
    return `<button type="button" class="dz-kpi ${on ? 'on' : ''}" style="--acc:${tp.acc}" data-act="an-dz-target" data-k="${esc(k.col)}" title="العمود: ${esc(k.col)} — اضغط لجعله محور التحليل">
      <span class="row between nowrap" style="gap:6px"><span class="lbl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.label || k.col)}</span>${on ? `<span class="tag t-i" style="font-size:10px">المحور</span>` : ''}</span>
      <span class="row between nowrap" style="gap:6px;align-items:baseline"><span class="v">${fmtN(last)}</span>${dzPill(ch, k.dir)}</span>
      ${dzSpark(s, good === false ? 'var(--red)' : good ? 'var(--green)' : tp.acc)}</button>`;
  }).join('');
  const kpiNote = tp.kpi.length && K.matched < 2 ? `<div class="banner y" style="font-size:12.5px">${ic('warn', 15)}<span>الملف لا يحتوي معظم مؤشرات «${esc(tp.name)}» المعتادة${K.missing.length ? ' (مثل: ' + esc(K.missing.slice(0, 4).join('، ')) + ')' : ''}، فعُرضت أعمدته الرقمية كما هي.</span></div>` : '';
  // 3. panels
  const P = dashParts(r.tab) || { head: 'لا توجد نتيجة لهذا النوع من البيانات الحالية.', rest: '', tone: 'var(--fg)', big: [], v1: null, v2: null };
  const tdir = DZ_LOWER.test(c.tgt) ? -1 : 1;
  const trend = dzTrend(c, tp.acc);
  const drv = !P.usesDrivers ? dzDrivers(c) : null;
  const verdict = dzPanel('s4 hl', tl.label + (tl.q ? ' — ' + tl.q : ''), `<button type="button" class="btn link sm" data-act="an-dz-jump" data-k="${r.tab}" style="min-height:0;padding:0">التفاصيل</button>`,
    `<div class="dz-verdict" style="color:${P.tone}">${anRich(P.head)}</div>${P.rest ? `<p style="font-size:12.5px;line-height:1.8;color:var(--fg2)">${anRich(P.rest)}</p>` : ''}
     ${P.big.length ? `<div class="dz-big">${P.big.map(([l, v, tn]) => `<div><span class="lbl" style="font-size:11px">${esc(l)}</span><b dir="auto" style="color:${anTone(tn)}">${esc(v)}</b></div>`).join('')}</div>` : ''}
     ${r.tab === 'feas' ? `<button type="button" class="btn sm" style="align-self:flex-start;margin-top:auto" data-act="an-dz-jump" data-k="feas">${ic('settings', 14)}عدّل الافتراضات</button>` : ''}`, `style="--acc:${tp.acc}"`);
  const rowA = [verdict];
  const main = P.v1 || drv;
  if (main) rowA.push(dzPanel('s5', main.t, main.n, main.h));
  const third = P.usesTrend ? (drv && main !== drv ? drv : null) : { t: 'اتجاه «' + c.tgt + '»', n: 'مع توقع 6 فترات', h: trend };
  if (third) rowA.push(dzPanel(main ? 's3' : 's8', third.t, third.n, third.h));
  const rowB = [];
  if (P.v2) rowB.push(P.v2);
  else if (drv && main !== drv && third !== drv) rowB.push(drv);
  const gs = [...c.groupStats].sort((a, b) => (b.mean - a.mean) * tdir);
  if (gs.length > 1 && focus === 'all') {
    const worst = [...c.groupStats].filter(s => isFinite(s.ch)).sort((a, b) => (a.ch - b.ch) * tdir)[0];
    rowB.push({ t: 'ترتيب ' + cfg.group, n: tdir < 0 ? 'الأقل أفضل' : 'متوسط «' + c.tgt + '»', h: anChart({ bars: gs.map(s => [s.g, s.mean]) }) + (worst && worst.ch * tdir < -3 ? `<button type="button" class="btn sm" style="align-self:flex-start" data-act="an-focus" data-k="${esc(worst.g)}">${ic('warn', 14, 'style="color:var(--orange)"')}حلّل «${esc(worst.g)}» (${fmtP(worst.ch)})</button>` : '') });
  } else if (focus !== 'all') rowB.push({ t: 'النطاق', n: '', h: `<span style="font-size:13px">تعرض اللوحة «${esc(focus)}» فقط.</span><button type="button" class="btn sm" style="align-self:flex-start" data-act="an-focus" data-k="all">عرض كل ${esc(cfg.group || 'الوحدات')}</button>` });
  rowB.push({ t: 'جودة البيانات والتقرير', n: '', h: `<div class="row nowrap" style="gap:10px;align-items:center">${dzRing(c.conf, gateCol, 54)}<span class="stack" style="gap:2px"><b style="font-size:12.5px">${c.gate[0] === 'good' ? 'البيانات كافية' : c.gate[0] === 'warn' ? 'كافية بحذر' : 'بيانات غير كافية'}</b><span class="faint" style="font-size:11.5px;line-height:1.5">${esc(c.gate[1])}</span></span></div>
      <span class="faint" style="font-size:11.5px">المحور: «${esc(c.tgt)}» · ${c.n} فترة · ${esc(c.focusName)}</span>
      <div class="row" style="gap:6px;margin-top:auto"><button type="button" class="btn sm primary" data-act="an-dz-full">${ic('reports', 14)}${S.dzFull ? 'إخفاء التقرير الكامل' : 'التقرير الكامل'}</button><button type="button" class="btn sm" data-act="an-dz-setup">${ic('settings', 14)}إعداد التحليل</button></div>` });
  const span = rowB.length === 1 ? 's12' : rowB.length === 2 ? 's6' : 's4';
  const grid = `<div class="dz-grid">${rowA.join('')}${rowB.map(x => dzPanel(span, x.t, x.n, x.h)).join('')}</div>`;
  const full = S.dzFull ? `<div class="row between" style="gap:10px;margin-top:8px"><h2 class="h-sec" style="font-size:17px">التقرير الكامل</h2><button type="button" class="btn link sm" data-act="an-dz-full">إخفاء ▴</button></div>
    <details class="dz-more card" id="dz-setup" style="gap:0" ${S.dzSetup ? 'open' : ''}><summary class="row between" style="gap:10px"><b style="font-size:14px">${ic('settings', 15)} مصدر البيانات وإعداد التحليل</b><span class="faint" style="font-size:12px">المؤشر المستهدف، الأعمدة، الأنواع ▾</span></summary><div class="stack" style="gap:12px;margin-top:12px">${p.src}${p.conf}</div></details>${p.secs}` : '';
  return `<div class="dz-wrap">${bar}${kpiNote}<div class="dz-kpis">${tiles}</div>${grid}${full}</div>`;
}
VIEWS.results = dashView;

/* ---------- events ---------- */
function dashHandle(act, k) {
  switch (act) {
    case 'an-dz-topic': { const P = S.anPick || (S.anPick = { topic: null, sys: [], types: [] }); P.topic = P.topic === k ? null : k; render(); return true; }
    case 'an-dz-type': { const P = S.anPick || (S.anPick = { topic: null, sys: [], types: [] }); const i = P.types.indexOf(k); if (i >= 0) P.types.splice(i, 1); else P.types.push(k); render(); return true; }
    case 'an-dz-open': { const r = S.res; S.anPick = { ...(S.anPick || {}), topic: r ? r.topic : null, sys: r ? r.sys || [] : [], types: r ? [...r.cfg.types] : [] }; S.anPickOpen = true; render(); window.scrollTo(0, 0); return true; }
    case 'an-dz-close': S.anPickOpen = false; render(); return true;
    case 'an-dz-apply': {
      const r = S.res, P = S.anPick || {}; if (!r) return true;
      const valid = AN_TYPES.map(t => t[0]), ty = (P.types || []).filter(t => valid.includes(t));
      r.topic = P.topic || null; r.cfg.types = ty.length ? ty : valid; r.tab = r.cfg.types[0]; S.anPickOpen = false;
      dashApplyTopic(); log('د. عدنان', `عرض لوحة «${dashTopic(r.topic).name}» — ${r.cfg.types.map(t => dzType(t).label).join('، ')}`); render(); window.scrollTo(0, 0); return true;
    }
    case 'an-dz-tab': if (S.res) { S.res.tab = k; render(); } return true;
    case 'an-dz-target': if (S.res && k) { S.res.cfg.target = k; anCompute(); render(); toast('محور التحليل: «' + k + '»'); } return true;
    case 'an-dz-jump': { S.dzFull = true; render(); const el = document.getElementById('an-sec-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
    case 'an-dz-full': { S.dzFull = !S.dzFull; S.dzSetup = false; render(); if (S.dzFull) { const el = document.querySelector('.dz-grid'); if (el) el.nextElementSibling && el.nextElementSibling.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return true; }
    case 'an-dz-setup': { S.dzFull = true; S.dzSetup = true; render(); const el = document.getElementById('dz-setup'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
  }
  return false;
}
const _dzHandle = analyticsHandle;
analyticsHandle = function (act, k, el) { if (act && act.startsWith('an-dz-')) return dashHandle(act, k, el); return _dzHandle(act, k, el); };
</script>
