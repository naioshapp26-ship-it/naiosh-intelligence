<style>
/* ---- command-center launcher: every section of the side menu as boxes, laid out horizontally ---- */
.ln-wrap{display:flex;flex-wrap:wrap;gap:18px 16px;align-items:flex-start}
.ln-group{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%;flex:var(--n) 1 calc(var(--n) * 168px + (var(--n) - 1) * 9px)}
.ln-gh{display:flex;align-items:center;gap:10px}
.ln-gh b{font-size:14px}
.ln-gh .ln-line{flex:1;height:1px;background:var(--line)}
.ln-gh .ln-n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.ln-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:9px}
.ln-box{position:relative;display:flex;flex-direction:column;gap:8px;padding:13px 13px 12px;min-height:112px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  text-align:right;color:var(--fg);min-width:0;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.ln-box:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));transform:translateY(-2px);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,var(--surface)),var(--surface) 80%)}
.ln-box[aria-current="page"]{border-color:var(--acc)}
.ln-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.ln-box b{font-size:13.5px;line-height:1.45}
.ln-box .ln-sub{font-size:11px;color:var(--faint);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ln-tagrow{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:5px;align-items:center}
.ln-code{font-family:var(--f-mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;direction:ltr}
.ln-cnt{font-family:var(--f-mono);font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.ln-box.soon{opacity:.6}
@media (max-width:760px){.ln-group{flex-basis:100%}.ln-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ln-box{min-height:104px;padding:11px}.ln-box .ln-sub{display:none}}
</style>
<script data-app="">
/* Every item of the side menu (NAV) shown on مركز القيادة as boxes, grouped like the menu. Same filters as the menu:
   modules switched off in settings are hidden, settings stays in the header. */
const LN_ACC = ['#FF2E4D', '#4DA3FF', '#FFCD11', '#2FD27A', '#C79BFF', '#FF8A1F', '#7ABBFF', '#F472B6', '#2DD4BF', '#A6A6B0'];
function homeLauncher() {
  if (S.lnHide) return `<section class="card row between" style="gap:10px;padding:12px 16px"><span class="row nowrap" style="gap:8px">${ic('architecture', 16, 'style="color:var(--yellow)"')}<b style="font-size:13.5px">أقسام المنظومة</b><span class="faint" style="font-size:12px">مخفية</span></span><button type="button" class="btn sm" data-act="ln-toggle">عرض كل الأقسام</button></section>`;
  const c = typeof counts === 'function' ? counts() : {};
  const groups = NAV.map((g, gi) => {
    const items = g.items.filter(([id]) => id !== 'home' && id !== 'settings' && (typeof modOn !== 'function' || modOn(id)));
    if (!items.length) return '';
    const acc = LN_ACC[gi % LN_ACC.length];
    return `<div class="ln-group" style="--acc:${acc};--n:${items.length}">
      <div class="ln-gh"><span style="width:8px;height:8px;border-radius:4px;background:${acc}"></span><b>${esc(g.t || '')}</b><span class="ln-n">${items.length}</span><span class="ln-line"></span></div>
      <div class="ln-grid">${items.map(([id, label, code, flag]) => {
        const sub = (TITLES[id] && TITLES[id][1] && TITLES[id][1] !== label ? TITLES[id][1] : (TITLES[id] ? TITLES[id][0] : '')) || '';
        return `<button type="button" class="ln-box ${flag === 'soon' ? 'soon' : ''}" data-go="${id}" title="${esc(label)}">
          <span class="ln-tagrow">${c[id] ? `<span class="ln-cnt">${c[id]}</span>` : ''}${flag === 'soon' ? '<span class="soon-tag">قريبًا</span>' : code ? `<span class="ln-code">${esc(code)}</span>` : ''}</span>
          <span class="ln-ico">${ic(id, 20)}</span>
          <b>${esc(label)}</b>
          ${sub ? `<span class="ln-sub">${esc(sub)}</span>` : ''}
        </button>`;
      }).join('')}</div></div>`;
  }).join('');
  const total = NAV.reduce((n, g) => n + g.items.filter(([id]) => id !== 'home' && id !== 'settings' && (typeof modOn !== 'function' || modOn(id))).length, 0);
  return `<section class="card" style="gap:16px">
    <div class="row between" style="gap:10px"><div class="stack" style="gap:2px"><h2 class="h-sec" style="font-size:17px">أقسام المنظومة</h2><span class="faint" style="font-size:12px">${total} قسمًا — اختر القسم الذي تريد العمل عليه</span></div>
      <button type="button" class="btn link sm" data-act="ln-toggle">إخفاء</button></div>
    <div class="ln-wrap">${groups}</div></section>`;
}
const _lnHome = VIEWS.home;
VIEWS.home = () => {
  const h = _lnHome(), cut = h.indexOf('</section>');
  return cut < 0 ? homeLauncher() + h : h.slice(0, cut + 10) + homeLauncher() + h.slice(cut + 10);
};
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-act="ln-toggle"]'); if (!b) return;
  S.lnHide = !S.lnHide; if (typeof save === 'function') save(); render();
});
</script>
