<script data-app="">

EG_INIT.val = () => ({
  tab: 'company',
  co: { name: 'شركة الأفق للتجارة والخدمات', sector: 'retail', stage: 'mature', own: 'private', purpose: 'sale', country: 'الأردن', cur: 'JOD', stake: 100, date: '2026-10' },
  fin: { rev: [4200000, 4650000, 5100000], ebitda: [610000, 700000, 790000], da: [120000, 130000, 140000], ni: [330000, 390000, 450000], capex: [150000, 170000, 180000], nwc: [600000, 650000, 700000] },
  bs: { cash: 350000, debt: 1200000, equity: 2100000, nonop: 0, minority: 0, assetAdj: 250000, liabAdj: 0 },
  dcf: { g: 8, margin: 15.5, tax: 20, capexPct: 3.5, nwcPct: 13.7, daPct: 2.7, rf: 5.5, erp: 6, beta: 1.1, size: 3, specific: 2, kd: 8, wd: 30, tg: 2.5 },
  peers: [{ n: 'شركة مقارنة أ', evE: 7.4, pe: 13.5, evR: 0.7 }, { n: 'شركة مقارنة ب', evE: 6.6, pe: 11.8, evR: 0.55 }, { n: 'شركة مقارنة ج', evE: 8.1, pe: 14.2, evR: 0.8 }, { n: 'صفقة استحواذ مماثلة', evE: 7.0, pe: 12.5, evR: 0.62 }],
  w: { dcf: 50, mult: 35, nav: 15 },
  adj: { dlom: 20, control: 0, key: 5 },
  qual: { audited: true, years3: true, normalized: false, ownerpay: false, peers: true, forecast: false, assets: false, contingent: true },
  risks: [{ n: 'اعتماد كبير على عميل أو مورد واحد', imp: 3, note: '' }, { n: 'اعتماد الإدارة على المالك (رجل المفتاح)', imp: 4, note: '' }]

const valMed = (a) => { const x = a.filter(v => isFinite(v) && v > 0).sort((p, q) => p - q); if (!x.length) return 0; const m = x.length >> 1; return x.length % 2 ? x[m] : (x[m - 1] + x[m]) / 2; };

  const ke = egN(d.rf) + egN(d.beta) * egN(d.erp) + egN(d.size) + egN(d.specific), wd = Math.min(90, Math.max(0, egN(d.wd))) / 100;

  const Y = VAL_YEARS.map((y, i) => ({ y, rev: egN(F.rev[i]), ebitda: egN(F.ebitda[i]), da: egN(F.da[i]), ni: egN(F.ni[i]), capex: egN(F.capex[i]), nwc: egN(F.nwc[i]) }));

  const q1 = { evE: valQ(P.map(p => egN(p.evE)), .25), pe: valQ(P.map(p => egN(p.pe)), .25), evR: valQ(P.map(p => egN(p.evR)), .25) }, q3 = { evE: valQ(P.map(p => egN(p.evE)), .75), pe: valQ(P.map(p => egN(p.pe)), .75), evR: valQ(P.map(p => egN(p.evR)), .75) };

  const wsum = meth.reduce((a, [k, , v]) => a + (v > 0 ? egN(s.w[k]) : 0), 0) || 1;

  const ctrl = pre * egN(s.adj.control) / 100, dlom = priv ? (pre + ctrl) * egN(s.adj.dlom) / 100 : 0, key = (pre + ctrl - dlom) * egN(s.adj.key) / 100;

    { n: 'DCF — سيناريوهات', lo: Math.max(0, valDcf(s, { g: egN(s.dcf.g) - 3, margin: egN(s.dcf.margin) - 2 }).eq), hi: valDcf(s, { g: egN(s.dcf.g) + 3, margin: egN(s.dcf.margin) + 2 }).eq, mid: D.eq },

  const scen = [['متشائم', -3, -2], ['أساسي', 0, 0], ['متفائل', 3, 2]].map(([n, dg, dm]) => { const r = valDcf(s, { g: egN(s.dcf.g) + dg, margin: egN(s.dcf.margin) + dm }); return { n, g: egN(s.dcf.g) + dg, m: egN(s.dcf.margin) + dm, eq: r.eq * adjF, ev: r.ev }; });

  const conf = qpct >= 75 && spread < 35 ? ['مرتفعة', 't-s'] : qpct >= 50 && spread < 60 ? ['متوسطة', 't-m'] : ['منخفضة', 't-c'];

  if (D.tvShare > 75) flags.push(`القيمة النهائية تمثل ${fmtN(D.tvShare, 0)}% من قيمة المنشأة في DCF — النتيجة حساسة جدًا لافتراضات المدى البعيد.`);

const valF = (v) => fmtN(v, 0);
function valFF(m) {

    { h: 'السيناريوهات', cols: ['السيناريو', 'النمو', 'الهامش', 'حقوق الملكية'], rows: m.scen.map(x => [x.n, fmtN(x.g, 1) + '%', fmtN(x.m, 1) + '%', valF(x.eq)]) },
    { h: 'الحساسية (WACC × النمو الدائم)', cols: ['WACC \\ g', ...m.sg.map(g => fmtN(g, 1) + '%')], rows: m.sens.map((row, i) => [fmtN(m.sw[i], 1) + '%', ...row.map(v => v === null ? '—' : valF(v))]) },
    { h: 'التنبيهات', bullets: m.flags.length ? m.flags : ['لا تنبيهات.'] },
    { h: 'التوصيات', bullets: m.rec.length ? m.rec : ['—'] },
    { h: 'حدود التقرير', bullets: ['تقدير تحليلي مبني على البيانات المدخلة ولا يغني عن تقييم معتمد من مقيّم مرخّص.', 'المضاعفات القطاعية الاسترشادية تقريبية — استبدلها بشركات وصفقات مقارنة فعلية.', 'جودة البيانات ' + fmtN(m.qpct, 0) + '% — ' + VAL_QUAL.filter(([k]) => !s.qual[k]).map(([, n]) => n).join('؛ ')] }] };
};
