            <span class="mono faint" style="font-size:11px">${v.s}${v.d ? ' · ' + v.d : ''}</span></div>`).join('')}</div>` : ''}
        </div>
        ${rqField('cls', 'تصنيف سرية البيانات', `<div class="row" style="gap:8px">${RQ_CLASS.map(([v, l], i) => { const on = r.cls === v; return `<label class="chip" style="min-height:40px;padding:0 14px;cursor:pointer;${on ? 'background:var(--redbg);border-color:var(--red);color:#fff' : ''}"><input type="radio" name="rq-cls" id="rq-cls-${i}" data-req="cls" data-req-live="1" value="${v}" ${on ? 'checked' : ''} style="accent-color:var(--action)">${l}</label>`; }).join('')}</div>`, false, 'البيانات المصنفة «سري» أو «مقيّد» تمر بموافقة إضافية ولا تُرسل كاملة إلى الذكاء الاصطناعي.')}`)}
      ${rqSection(6, 'الأولوية والتسليم', 'يحدد مستوى القرار متطلبات الأدلة والمراجعة والموافقة.', `<div class="grid g3">
        ${rqField('priority', 'الأولوية', rqSelect('priority', RQ_PRIORITY), false)}

      </div>
      <div class="stack" style="gap:8px"><span style="font-size:13px;font-weight:600">شكل المخرج المطلوب</span>${rqChecks('outputs', RQ_OUTPUTS)}</div>

        <input type="checkbox" id="rq-consent" data-req="consent" data-req-live="1" ${r.consent ? 'checked' : ''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--action)" ${RQ_ERR.consent ? 'aria-invalid="true"' : ''}>

function rqRecent() {
  const list = S.requests || [];
  return `<section class="card"><div class="row between"><h2 class="h-sec">طلباتي الأخيرة</h2><span class="lbl">${list.length} طلب</span></div>
    ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>المرجع</th><th>العنوان</th><th>نوع التحليل</th><th>الكفاية</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${list.map(q => `<tr><td class="mono" style="color:var(--yellow);font-size:12px">${q.ref}</td><td><b>${esc(q.title)}</b></td><td class="soft">${esc(q.typesLabel)}</td><td class="mono" style="color:${confColor(q.suff)}">${q.suff}%</td><td><span class="chip">${q.status}</span></td><td class="faint" style="font-size:12px">${q.date}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted" style="font-size:13px">لا توجد طلبات بعد. الطلبات التي ترسلها تظهر هنا وفي مركز الاستشارات.</p>'}
  </section>`;
}
function rqRefreshPanel() { const p = document.getElementById('rq-panel'); if (p) p.innerHTML = brandify(rqPanel()); save(); }
function rqRerender(focusId) { render(); if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); } }
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.req || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  if (!S.req) S.req = freshReq();
  S.req[el.dataset.req] = el.value;
  if (RQ_ERR[el.dataset.req]) { delete RQ_ERR[el.dataset.req]; }
  rqRefreshPanel();
});
document.addEventListener('change', (e) => {
  const el = e.target; if (!el.dataset) return;
  if (!S.req) S.req = freshReq();
  if (el.dataset.reqMulti) {
    const k = el.dataset.reqMulti, arr = S.req[k];
    if (el.checked) { if (!arr.includes(el.value)) arr.push(el.value); } else S.req[k] = arr.filter(x => x !== el.value);
    if (k === 'types') { delete RQ_ERR.types; const need = new Set(rqContract().need); S.req.have = S.req.have.filter(h => need.has(h)); }
    rqRerender(el.id); return;
  }
  if (el.dataset.req && el.dataset.reqLive) { S.req[el.dataset.req] = el.type === 'checkbox' ? el.checked : el.value; delete RQ_ERR[el.dataset.req]; rqRerender(el.id); return; }
  if (el.id === 'rq-videos' && el.files) {
    const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
    delete RQ_ERR.videos;
    const big = [];
    Array.from(el.files).forEach(f => {
      if (!/^video\//.test(f.type) && !/\.(mp4|mov|webm|m4v|avi|mkv)$/i.test(f.name)) { big.push(f.name + ' (ليس فيديو)'); return; }
      if (f.size > 500 * 1048576) { big.push(f.name + ' (أكبر من 500 MB)'); return; }
      const key = 'v' + Date.now() + Math.random().toString(36).slice(2, 6);
      const item = { key, n: f.name, s: fmt(f.size), d: '' };
      RQ_FILE_OBJ[key] = f;
      try { RQ_VIDEO_URLS[key] = URL.createObjectURL(f); } catch (e2) {}
      S.req.videos.push(item);
      if (RQ_VIDEO_URLS[key]) {
        const probe = document.createElement('video'); probe.preload = 'metadata';
        probe.onloadedmetadata = () => { const t = Math.round(probe.duration || 0); if (t) { item.d = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); if (S.route === 'request') rqRerender(); } };
        probe.src = RQ_VIDEO_URLS[key];
      }
    });
    if (big.length) RQ_ERR.videos = 'لم يُرفق: ' + big.join('، ');
    rqRerender('rq-videos'); return;
  }
  if (el.id === 'rq-files' && el.files) {
    const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
    Array.from(el.files).forEach(f => { const key = 'f' + Date.now() + Math.random().toString(36).slice(2, 6); RQ_FILE_OBJ[key] = f; S.req.files.push({ key, n: f.name, s: fmt(f.size) }); });
    el.value = '';
    rqRerender('rq-files');
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'rq-form') return;
  e.preventDefault();
  const r = S.req; RQ_ERR = {};
  if (!r.name.trim()) RQ_ERR.name = 'أدخل الاسم الكامل.';
  if (!r.phone.trim() && !r.email.trim()) RQ_ERR.email = 'أدخل رقم الجوال أو البريد الإلكتروني للتواصل.';
  else if (r.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email.trim())) RQ_ERR.email = 'البريد الإلكتروني غير صحيح — مثال: name@company.com';
  if (!r.domain) RQ_ERR.domain = 'اختر المجال الرئيسي للطلب.';
  if (!r.types.length) RQ_ERR.types = 'اختر نوع تحليل واحدًا على الأقل.';
  if (!r.title.trim()) RQ_ERR.title = 'أضف عنوانًا قصيرًا للطلب.';
  if (!r.question.trim()) RQ_ERR.question = 'اكتب السؤال الذي تريد إجابته.';
  if (!r.consent) RQ_ERR.consent = 'الموافقة على استخدام البيانات مطلوبة لبدء التحليل.';
  const order = ['name','email','domain','types','title','question','consent'];
  const first = order.find(k => RQ_ERR[k]);
  if (first) { render(); const el = document.getElementById(first === 'types' ? 'rq-types-0' : 'rq-' + first); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center' }); } return; }
  const c = rqContract(), dom = RQ_DOMAINS.find(d => d[0] === r.domain);
  if (window.NAIOSH_SERVER && typeof serverSubmitRequest === 'function') { serverSubmitRequest(r, c, dom); return; }
  S.requests = S.requests || [];
  const ref = 'DAR-2026-' + String(101 + S.requests.length).padStart(3, '0');
  const d = new Date();
  S.requests.unshift({ ref, title: r.title.trim(), typesLabel: c.sel.map(t => t.label).join(' + '), domain: r.domain, domainLabel: dom ? dom[0] + ' ' + dom[1] : '', suff: c.suff, priority: r.priority, missing: c.missing.slice(0, 3).join('، ') || '—', output: (r.outputs[0] || 'تقرير تحليلي'), files: r.files.length, videos: (r.videos || []).length, status: c.suff >= 80 ? 'جاهز للتحليل' : 'جمع البيانات', owner: r.name.trim(), date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') });
  log(r.name.trim(), `أرسل طلب تحليل بيانات ${ref}: ${r.title.trim()}`);
  log('المنسّق', `أنشأ عقد بيانات لـ ${ref} — الكفاية ${c.suff}%`, 'sys');
  S.reqDone = ref; S.req = freshReq(); Object.keys(RQ_VIDEO_URLS).forEach(k2 => delete RQ_VIDEO_URLS[k2]);
  toast('أُرسل الطلب ' + ref);
  render(); window.scrollTo(0, 0);
});
function requestHandle(act, k) {
  if (act === 'rq-new') { S.reqDone = null; S.req = freshReq(); RQ_ERR = {}; render(); window.scrollTo(0, 0); return true; }
  if (act === 'rq-clear') { Object.keys(RQ_VIDEO_URLS).forEach(k2 => { try { URL.revokeObjectURL(RQ_VIDEO_URLS[k2]); } catch (e) {} delete RQ_VIDEO_URLS[k2]; }); S.req = freshReq(); RQ_ERR = {}; render(); toast('مُسح النموذج'); return true; }
  if (act === 'rq-rmfile') { S.req.files.splice(+k, 1); render(); return true; }
  if (act === 'rq-rmvideo') { const v = S.req.videos.splice(+k, 1)[0]; if (v && RQ_VIDEO_URLS[v.key]) { try { URL.revokeObjectURL(RQ_VIDEO_URLS[v.key]); } catch (e) {} delete RQ_VIDEO_URLS[v.key]; } render(); return true; }
  return false;
}
