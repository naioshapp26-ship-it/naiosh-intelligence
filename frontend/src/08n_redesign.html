  const staff = rdServer() && typeof svCan === 'function' && svCan('requests.viewAll');
  const tab = staff ? (S.ctTab || 'form') : 'form';
  const K = [['complaint', 'شكوى', 'risks'], ['suggestion', 'مقترح', 'bulb'], ['inquiry', 'استفسار', 'info']];
  const er = (k) => RD_CERR[k] ? `<span class="err" role="alert">${esc(RD_CERR[k])}</span>` : '';
  const mine = rdServer() ? (S.guest ? rdMsgs() : (SV.msgs || []).filter(m => m.mine)) : rdMsgs();
  const list = (arr, admin) => arr.length ? arr.map(m => `<div class="rd-msg"><div class="row between" style="gap:8px"><span class="row nowrap" style="gap:8px"><span class="tag ${m.kind === 'complaint' ? 't-c' : m.kind === 'suggestion' ? 't-m' : 't-i'}">${esc(m.kindLabel || (K.find(x => x[0] === m.kind) || [, ''])[1])}</span><code style="font:600 12px var(--f-mono);color:var(--faint);direction:ltr">${esc(m.ref)}</code></span><span class="tag ${m.status === 'closed' ? 't-s' : m.status === 'open' ? 't-m' : 't-i'}">${esc(m.statusLabel || 'جديدة')}</span></div>
      ${m.subject ? `<b style="font-size:14px">${esc(m.subject)}</b>` : ''}<p style="margin:0;font-size:13px;line-height:1.7;color:var(--fg2);white-space:pre-wrap">${esc(m.body)}</p>
      <span class="faint" style="font-size:11.5px">${esc(m.name || '')}${m.email ? ' · ' + esc(m.email) : ''}${m.phone ? ' · ' + esc(m.phone) : ''} · ${esc(String(m.createdAt || m.at || '').slice(0, 16).replace('T', ' '))}</span>
      ${m.note && !admin ? `<div class="banner g" style="font-size:12.5px">${ic('check', 16, 'style="color:var(--green)"')}<span>رد الفريق: ${esc(m.note)}</span></div>` : ''}
      ${admin ? `<div class="row" style="gap:8px"><select data-msg-st="${m.id}" aria-label="حالة الرسالة" style="min-height:38px">${Object.entries(SV.msgStatuses || { new: 'جديدة', open: 'قيد المعالجة', closed: 'مغلقة' }).map(([k, l]) => `<option value="${k}" ${m.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select><input type="text" data-msg-note="${m.id}" value="${esc(m.note || '')}" placeholder="رد أو ملاحظة للمرسل" style="flex:1;min-width:160px;min-height:38px"><button type="button" class="btn sm" data-act="rd-msg-save" data-k="${m.id}">حفظ</button></div>` : ''}</div>`).join('') : '<p class="faint" style="font-size:13px">لا رسائل بعد.</p>';
  const form = `<section class="card" style="gap:14px"><h2 class="h-sec">أرسل رسالتك</h2>
    <div class="rd-seg" role="group" aria-label="نوع الرسالة">${K.map(([k, l, i]) => `<button type="button" data-act="rd-ckind" data-k="${k}" aria-pressed="${f.kind === k}">${ic(i, 16)}${l}</button>`).join('')}</div>${er('kind')}
    <form class="rd-form" id="rd-contact-form" novalidate>
      <label><span class="lbl">الاسم *</span><input type="text" data-cf="name" value="${esc(f.name)}" autocomplete="name" required>${er('name')}</label>
      <label><span class="lbl">البريد الإلكتروني</span><input data-cf="email" type="email" dir="ltr" value="${esc(f.email)}" autocomplete="email">${er('email')}</label>
      <label><span class="lbl">رقم الجوال</span><input data-cf="phone" type="tel" dir="ltr" value="${esc(f.phone)}" autocomplete="tel"></label>
      <label><span class="lbl">الموضوع</span><input type="text" data-cf="subject" value="${esc(f.subject)}"></label>
      <label class="full"><span class="lbl">التفاصيل *</span><textarea data-cf="body" rows="5" required>${esc(f.body)}</textarea>${er('body')}</label>
      <label class="rd-hp" aria-hidden="true">اترك هذا الحقل فارغًا<input data-cf="website" tabindex="-1" autocomplete="off"></label>
      <div class="full row between" style="gap:10px"><span class="faint" style="font-size:12px">نرد خلال يومي عمل. تحصل على رقم مرجعي للمتابعة.</span><button type="submit" class="btn primary" ${SV_BUSY_MSG ? 'aria-disabled="true"' : ''}>${ic('check', 16)}إرسال</button></div>
    </form></section>`;
  const side = `<section class="card" style="gap:10px"><h2 class="h-sec">${rdGuest() ? 'رسائلك من هذا الجهاز' : 'رسائلي'}</h2>${list(mine, false)}</section>`;
  const head = `<section class="stack" style="gap:6px"><h2 class="pg-title">اتصل بنا</h2><p class="lead" style="margin:0">شكوى، مقترح أو استفسار — رسالتك تصل لفريق نايوش مباشرة.</p></section>`;
  if (staff) {
    const all = SV.msgs || [];
    const tabs = `<div class="rd-tabs" role="tablist"><button type="button" role="tab" data-act="rd-cttab" data-k="form" aria-selected="${tab === 'form'}">${ic('contact', 16)}رسالة جديدة</button><button type="button" role="tab" data-act="rd-cttab" data-k="inbox" aria-selected="${tab === 'inbox'}">${ic('inbox', 16)}صندوق الرسائل <span class="tag t-c">${all.filter(m => m.status === 'new').length}</span></button></div>`;
    return head + tabs + (tab === 'inbox' ? `<section class="card" style="gap:10px"><h2 class="h-sec">كل الرسائل (${all.length})</h2>${list(all, true)}</section>` : `<div class="split wide">${form}${side}</div>`);
  }
  return head + `<div class="split wide">${form}${side}</div>`;
};
let SV_BUSY_MSG = false;
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.cf; if (!k) return; (S.cform || (S.cform = {}))[k] = e.target.value; if (RD_CERR[k]) { delete RD_CERR[k]; } });
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'rd-contact-form') return;
  e.preventDefault();
  if (SV_BUSY_MSG) return;
  const f = S.cform || {}, errs = {};
  if (!f.kind) errs.kind = 'اختر نوع الرسالة';
  if (String(f.name || '').trim().length < 2) errs.name = 'اكتب الاسم';
  if (!String(f.email || '').trim() && !String(f.phone || '').trim()) errs.email = 'اكتب البريد الإلكتروني أو رقم الجوال للتواصل';
  else if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(f.email).trim())) errs.email = 'البريد الإلكتروني غير صحيح';
  if (String(f.body || '').trim().length < 10) errs.body = 'اكتب تفاصيل الرسالة (10 أحرف على الأقل)';
  RD_CERR = errs;
  if (Object.keys(errs).length) { render(); const el = document.querySelector('#rd-contact-form .err'); if (el) el.scrollIntoView({ block: 'center' }); return; }
  const body = { kind: f.kind, name: f.name.trim(), email: (f.email || '').trim(), phone: (f.phone || '').trim(), subject: (f.subject || '').trim(), body: f.body.trim(), website: f.website || '' };
  const K = { complaint: 'شكوى', suggestion: 'مقترح', inquiry: 'استفسار' };
  if (rdServer()) {
    SV_BUSY_MSG = true;
    try {
      const d = await api('POST', '/api/public/messages', body);
      if (!S.guest) await rdLoadMsgs(); else rdMsgs().unshift({ ...body, ref: d.ref, kindLabel: K[body.kind], status: 'new', statusLabel: 'جديدة', at: new Date().toISOString() });
      S.cform = { kind: f.kind, name: f.name, email: f.email, phone: f.phone, subject: '', body: '' };
      toast('وصلت رسالتك — الرقم المرجعي ' + d.ref);
    } catch (err) { if (err.errors) RD_CERR = { ...err.errors }; toast(err.message || 'تعذّر الإرسال'); }
    finally { SV_BUSY_MSG = false; render(); }
    return;
  }
  const ref = 'MSG-' + new Date().getFullYear() + '-' + String(rdMsgs().length + 1).padStart(3, '0');
  rdMsgs().unshift({ ...body, ref, kindLabel: K[body.kind], status: 'new', statusLabel: 'جديدة', at: new Date().toISOString().slice(0, 16) });
  S.cform = { kind: f.kind, name: f.name, email: f.email, phone: f.phone, subject: '', body: '' };
  if (typeof log === 'function') log(f.name, `أرسل ${K[body.kind]} ${ref}`);
  toast('وصلت رسالتك — الرقم المرجعي ' + ref); render();
});
async function rdLoadMsgs() {
  if (!rdServer() || S.guest) return;
  try { const d = await api('GET', '/api/messages'); SV.msgs = d.messages; SV.msgStatuses = d.statuses; } catch (e) {}
}

/* ---------- modals (demo sign-in, top-up, app) ---------- */
function rdModal(kind, o = {}) {
  let m = document.getElementById('rd-modal');
  if (!m) { m = document.createElement('div'); m.id = 'rd-modal'; m.setAttribute('dir', 'rtl'); document.body.appendChild(m); }
  if (!kind) { m.innerHTML = ''; return; }
  RD_MOD = { kind, ...o };
  m.innerHTML = `<div class="rd-ov" data-act="rd-close-bg"><div class="rd-dlg" role="dialog" aria-modal="true" aria-labelledby="rd-mt">${rdModalBody()}</div></div>`;
  const f = m.querySelector('input,button.btn.primary'); if (f) f.focus();
}
let RD_MOD = null;
function rdModalBody() {
  const M = RD_MOD, x = `<button type="button" class="icon-btn" data-act="rd-close" aria-label="إغلاق">${ic('x', 18)}</button>`;
  if (M.kind === 'login') return `<div class="row between"><h2 id="rd-mt" class="h-sec" style="font-size:19px">تسجيل الدخول</h2>${x}</div>
    <p class="muted" style="font-size:13px;margin:0;line-height:1.7">${M.next ? 'سجّل الدخول لفتح «' + esc((TITLES[M.next] || [, ''])[1]) + '». ' : ''}هذه نسخة العرض: الدخول يفتح الحساب التجريبي لـ د. عدنان. في النسخة المنشورة على الخادم يُطلب البريد وكلمة المرور الحقيقية.</p>
    <label class="stack" style="gap:6px"><span class="lbl">البريد الإلكتروني</span><input type="email" dir="ltr" value="demo@naiosh.app" readonly></label>
    <label class="stack" style="gap:6px"><span class="lbl">كلمة المرور</span><input type="password" dir="ltr" value="demo-account" readonly></label>
    <button type="button" class="btn primary block" data-act="rd-demo-in" style="min-height:48px">دخول تجريبي</button>`;
  if (M.kind === 'app') return `<div class="row between"><h2 id="rd-mt" class="h-sec" style="font-size:19px">تطبيق نايوش</h2>${x}</div>
    <p class="muted" style="font-size:13.5px;margin:0;line-height:1.8">تطبيقات المتاجر قيد الإعداد. حتى إطلاقها يمكنك تثبيت نايوش على جوالك كتطبيق من المتصفح:</p>
    <ol style="margin:0;padding-inline-start:20px;font-size:13.5px;line-height:2;color:var(--fg2)"><li><b>آيفون (Safari):</b> زر المشاركة ← «إضافة إلى الشاشة الرئيسية».</li><li><b>أندرويد (Chrome):</b> القائمة ⋮ ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li></ol>
    <div class="row" style="gap:8px"><span class="tag t-i">App Store — قريبًا</span><span class="tag t-i">Google Play — قريبًا</span></div>
    <button type="button" class="btn" data-act="rd-close">تم</button>`;
  // top-up
  const pk = rdPacks().find(p => p.id === M.pack) || rdPacks()[0] || { id: '', pts: 0, price: 0, name: '' }, off = rdOffers().find(o => o.code === String(M.code || '').trim().toUpperCase());
  const okCode = off && (!off.pack || off.pack === pk.id), price = okCode ? Math.round(pk.price * (100 - off.pct)) / 100 : pk.price;
  const pays = [['mada', 'مدى'], ['apple', 'Apple Pay'], ['card', 'بطاقة ائتمانية'], ['stc', 'STC Pay']];
  return `<div class="row between"><h2 id="rd-mt" class="h-sec" style="font-size:19px">شحن الرصيد</h2>${x}</div>
    <div class="rd-pay" role="group" aria-label="الباقة">${rdPacks().map(p => `<button type="button" data-act="rd-pk" data-k="${p.id}" aria-pressed="${p.id === pk.id}">${rdNum(p.pts)} نقطة · ${rdNum(p.price)} ${rdCur()}</button>`).join('')}</div>
    <label class="stack" style="gap:6px"><span class="lbl">كود الخصم</span><span class="row nowrap" style="gap:8px"><input type="text" id="rd-code" dir="ltr" value="${esc(M.code || '')}" placeholder="NAIOSH10" style="flex:1"><button type="button" class="btn sm" data-act="rd-code">تطبيق</button></span>
      ${M.code ? (okCode ? `<span style="color:var(--green);font-size:12.5px">خصم ${off.pct}% مطبّق</span>` : `<span style="color:#FF6B81;font-size:12.5px">${off ? 'الكود لا ينطبق على هذه الباقة' : 'الكود غير صحيح'}</span>`) : ''}</label>
    <span class="lbl">طريقة الدفع</span><div class="rd-pay" role="group" aria-label="طريقة الدفع">${pays.map(([k, l]) => `<button type="button" data-act="rd-paym" data-k="${k}" aria-pressed="${(M.pay || 'mada') === k}">${l}</button>`).join('')}</div>
    <div class="row between" style="padding:12px 14px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)"><span class="soft">الإجمالي</span><b style="font:800 22px var(--f-mono)">${okCode ? `<s class="faint" style="font-size:14px">${rdNum(pk.price)}</s> ` : ''}${price.toLocaleString('en-US')} ${rdCur()}</b></div>
    <div class="banner y" style="font-size:12.5px">${ic('info', 16, 'style="color:var(--yellow)"')}<span>وضع تجريبي: لا تُطلب بيانات بطاقة ولا يُخصم أي مبلغ. تُضاف النقاط لتجربة المحفظة فقط.</span></div>
    <button type="button" class="btn primary block" data-act="rd-pay" style="min-height:48px">تأكيد الشحن (تجريبي) — ${rdNum(pk.pts)} نقطة</button>`;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && RD_MOD) { RD_MOD = null; rdModal(null); } });

/* ---------- actions ---------- */
function rdHandle(act, k, el) {
  switch (act) {
    case 'rd-tick-x': S.tkHide = true; render(); return true;
    case 'rd-promo': { const [r, t] = String(k).split('|'); if (r === 'hub') S.hubTab = t; if (r === 'contact') { (S.cform || (S.cform = { kind: 'inquiry' })).kind = t; } if (r === 'home' && t === 'start') { S.hmStep = 1; go('home'); setTimeout(() => { const c = document.getElementById('hm-3'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); return true; } go(r); return true; }
    case 'rd-login': rdLogin(); return true;
    case 'rd-logout': if (rdServer()) { if (typeof svLogout === 'function') svLogout(); return true; } S.guest = true; S.tour.on = false; RD_MOD = null; rdModal(null); go('home'); toast('خرجت من الحساب — تشاهد الآن الصفحة العامة'); return true;
    case 'rd-demo-in': { const nx = RD_MOD && RD_MOD.next; S.guest = false; RD_MOD = null; rdModal(null); toast('مرحبا د. عدنان'); go(nx || 'home'); return true; }
    case 'rd-close': RD_MOD = null; rdModal(null); return true;
    case 'rd-close-bg': if (el && el.classList.contains('rd-ov')) { RD_MOD = null; rdModal(null); } return true;
    case 'rd-bot': go('ask'); return true;
    case 'rd-app': rdModal('app'); return true;
    case 'rd-hub': S.hubTab = k || 'services'; if (S.route !== 'hub') go('hub'); else render(); return true;
    case 'rd-topup': { const [p, c] = String(k || '').split('|'); rdModal('topup', { pack: p || ((rdPacks().find(x => x.best) || rdPacks()[0] || {}).id), code: c || '', pay: 'mada' }); return true; }
    case 'rd-pk': RD_MOD.pack = k; rdModal('topup', RD_MOD); return true;
    case 'rd-paym': RD_MOD.pay = k; rdModal('topup', RD_MOD); return true;
    case 'rd-code': { const i = document.getElementById('rd-code'); RD_MOD.code = i ? i.value.trim().toUpperCase() : ''; rdModal('topup', RD_MOD); return true; }
    case 'rd-pay': {
      const pk = rdPacks().find(p => p.id === RD_MOD.pack) || rdPacks()[0], w = rdWal();
      if (!pk) return true;
      if (rdServer()) {
        api('POST', '/api/wallet/topup', { pack: pk.id }).then(d => { RD_MOD = null; rdModal(null); toast('أُضيفت ' + rdNum(pk.pts) + ' نقطة — الرصيد ' + rdNum(d.balance)); return rdLoadWallet(); }).then(render).catch(e => toast(e.message));
        return true;
      }
      w.bal += pk.pts; w.tx.unshift({ t: 'شحن ' + pk.name + ' (تجريبي)', pts: pk.pts, at: new Date().toISOString().slice(0, 10) });
      RD_MOD = null; rdModal(null); if (typeof log === 'function') log(rdName(), `شحن تجريبي ${pk.pts} نقطة`);
      toast('أُضيفت ' + rdNum(pk.pts) + ' نقطة — الرصيد ' + rdNum(w.bal)); render(); return true;
    }
    case 'rd-contact': (S.cform || (S.cform = { kind: 'inquiry', name: '', email: '', phone: '', subject: '', body: '' })).kind = k; S.ctTab = 'form'; RD_CERR = {}; go('contact'); return true;
    case 'rd-ckind': (S.cform || (S.cform = {})).kind = k; delete RD_CERR.kind; render(); return true;
    case 'rd-cttab': S.ctTab = k; if (k === 'inbox') rdLoadMsgs().then(render); render(); return true;
    case 'rd-msg-save': {
      const st = document.querySelector(`[data-msg-st="${k}"]`), nt = document.querySelector(`[data-msg-note="${k}"]`);
      api('PATCH', '/api/messages/' + k, { status: st ? st.value : undefined, note: nt ? nt.value : undefined }).then(() => rdLoadMsgs()).then(() => { toast('حُفظت حالة الرسالة'); render(); }).catch(e => toast(e.message));
      return true;
    }
    case 'rd-hit': rdOpenHit(RD_HITS[+k]); return true;
    case 'rd-ask-q': { const i = document.querySelector('.gs-input:focus') || document.querySelector('.gs-input'); if (i && i.value.trim()) S.q = i.value.trim(); go('ask'); return true; }
    case 'hm-topic': { const P2 = rdPick(); P2.topic = k; P2.sys = [k]; S.hmStep = 2; render(); return true; }
    case 'hm-step': { const n = +k; if (n > 1 && !rdPick().topic && n === 2) { toast('اختر الموضوع أولًا'); return true; } S.hmStep = n; render(); return true; }
    case 'hm-reset': S.anPick = { topic: null, sys: [], types: [] }; S.hmStep = 1; render(); return true;
    case 'hm-start': S.hmStep = 1; go('home'); setTimeout(() => { const c = document.getElementById('hm-3'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); return true;
    case 'hm-upload': S.anPickOpen = false; if (typeof AN !== 'undefined' && AN && AN.T && S.res) { S.anPickOpen = true; } go('results'); return true;
    case 'hm-sys': S.hmSys = k; render(); return true;
    case 'hm-risk': S.risk = k; render(); return true;
    case 'hm-risk-open': S.risk = k; go('risks'); return true;
    case 'hm-more': if (el && el.closest('details')) { setTimeout(() => { S.hmMore = el.closest('details').open; save(); const s = el.querySelector('.faint'); if (s) s.textContent = S.hmMore ? 'إخفاء ▴' : 'عرض ▾'; }, 0); } return true;
  }
  return false;
}
const _rdAnH = analyticsHandle;
analyticsHandle = function (act, k, el) { if (act && (act.startsWith('rd-') || act.startsWith('hm-'))) return rdHandle(act, k, el); return _rdAnH(act, k, el); };
</script>
