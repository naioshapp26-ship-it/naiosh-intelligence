    const s = egS('legal'); lgEnsure(s); const c = s.cases[s.sel], [key, j] = String(k).split('|');

    else c[key].splice(+j, 1);
    save(); render(); return true;
  }
  if (act === 'eb-clear') { const s = egS('ebiz'); s.ans = {}; s.ev = {}; s.fu = {}; save(); render(); toast('مُسحت الإجابات'); return true; }
  return false;
}
