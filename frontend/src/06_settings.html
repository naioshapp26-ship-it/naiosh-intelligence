function fieldHTML(path, f, val) {
  const id = 'cfg-' + path.replace(/\./g, '-');

  const box = (inner) => `<div class="stack" style="gap:5px;${f.wide ? 'grid-column:1/-1' : ''}">${inner}</div>`;
  const attrs = `id="${id}" data-cfg="${path}" data-t="${f.type}"`;
  if (f.type === 'bool') return box(`<label class="row nowrap" style="min-height:44px;gap:10px;cursor:pointer"><input type="checkbox" ${attrs} ${val ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--action)"><span style="font-size:13.5px">${f.label}</span></label>`);
  if (f.type === 'select') return box(lab + `<select ${attrs} style="min-height:42px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:0 10px">${f.opt.map(([v, l]) => `<option value="${esc(v)}" ${String(val ?? '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`);
  if (f.type === 'color') return box(lab + `<div class="row nowrap"><input type="color" ${attrs} value="${esc(val)}" style="width:52px;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);padding:2px"><span class="mono soft">${esc(val)}</span></div>`);
  if (f.type === 'textarea') return box(lab + `<textarea ${attrs} rows="3">${esc(val)}</textarea>`);
  if (f.type === 'lines') return box(lab + `<textarea ${attrs} rows="${Math.min(8, Math.max(3, (val || []).length + 1))}">${esc((Array.isArray(val) ? val : []).join('\n'))}</textarea>`);
  if (f.type === 'nums') return box(lab + `<input type="text" dir="ltr" ${attrs} value="${esc((Array.isArray(val) ? val : []).join(', '))}" style="text-align:left">`);
  if (f.type === 'number') return box(lab + `<input type="text" inputmode="decimal" dir="ltr" ${attrs} value="${esc(val)}" style="text-align:left">`);
  return box(lab + `<input type="text" ${attrs} value="${esc(val)}">`);
}
function parseField(el) {
  const t = el.dataset.t;
  if (t === 'bool') return el.checked;
  if (t === 'number') { const n = parseFloat(String(el.value).replace(',', '.')); return isNaN(n) ? 0 : n; }
  if (t === 'lines') return el.value.split('\n').map(x => x.trim()).filter(Boolean);
  if (t === 'nums') return el.value.split(/[,،\s]+/).map(Number).filter(n => !isNaN(n) && String(n) !== '');
  return el.value;
}

  <div class="grid" style="grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:16px" id="set-grid">

      ${SECTIONS.map(x => `<button type="button" class="list-btn" data-act="set-tab" data-k="${x.id}" ${x.id === sec.id ? 'aria-current="page"' : ''} style="align-items:center;border-color:transparent;background:${x.id === sec.id ? 'rgba(255,46,77,.12)' : 'transparent'};padding:9px 12px">${ic(x.icon, 17, `style="color:${x.id === sec.id ? 'var(--red)' : 'var(--faint)'}"`)}<span style="flex-grow:1;font-size:13.5px;font-weight:${x.id === sec.id ? 600 : 500}">${x.title}</span>${x.kind === 'list' ? `<span class="mono faint" style="font-size:11px">${(CFG[x.id] || []).length}</span>` : ''}</button>`).join('')}
    </nav>
    <section class="card" style="min-width:0">
      <div class="stack" style="gap:4px"><h2 class="title-l" style="font-size:18px">${sec.title}</h2><p class="muted" style="font-size:13px;line-height:1.7">${sec.desc}</p></div>
      ${body}
    </section>
  </div>`;
};
function markDirty() { CFG_DIRTY = true; saveDraft(); const t = document.querySelector('[data-act="cfg-publish"]'); if (t && !READONLY) t.setAttribute('aria-disabled', 'false'); }
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.cfg) return;
  if (el.dataset.t === 'bool' || el.dataset.t === 'select') return;
  setPath(CFG, el.dataset.cfg, parseField(el)); markDirty();
  if (el.dataset.t === 'color') { applyTheme(); const s = el.parentElement.querySelector('.mono'); if (s) s.textContent = el.value; }
});
document.addEventListener('change', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.cfg) return;
  if (el.dataset.t !== 'bool' && el.dataset.t !== 'select') return;
  setPath(CFG, el.dataset.cfg, parseField(el)); markDirty();
  const fid = el.id; render(); const back = fid && document.getElementById(fid); if (back) back.focus({ preventScroll: true });
});
document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.path) { if (d.open) OPEN.add(d.dataset.path); else OPEN.delete(d.dataset.path); } }, true);
function listOf(path) { const [sec] = path.split('.'); return CFG[sec]; }
function settingsHandle(act, k, el) {
  if (act === 'set-tab') { S.setTab = k; RESET_ARMED = false; go('settings'); return true; }
  if (act === 'cfg-add') { const sec = SECTIONS.find(x => x.id === k); CFG[k] = CFG[k] || []; CFG[k].push(clone(sec.tpl)); OPEN.add(k + '.' + (CFG[k].length - 1)); markDirty(); render(); const d = document.querySelector(`details[data-path="${k}.${CFG[k].length - 1}"]`); if (d) { d.scrollIntoView({ block: 'center' }); const f = d.querySelector('input,textarea,select'); if (f) f.focus({ preventScroll: true }); } return true; }
  if (act === 'cfg-del') { const arr = listOf(k), i = +k.split('.')[1]; arr.splice(i, 1); OPEN.clear(); markDirty(); render(); toast('تم الحذف — لن يُنشر حتى تضغطي «حفظ ونشر»'); return true; }
  if (act === 'cfg-dup') { const arr = listOf(k), i = +k.split('.')[1]; arr.splice(i + 1, 0, clone(arr[i])); OPEN.clear(); OPEN.add(k.split('.')[0] + '.' + (i + 1)); markDirty(); render(); return true; }
  if (act === 'cfg-move') { const arr = listOf(k), i = +k.split('.')[1], j = i + (+el.dataset.dir); if (j < 0 || j >= arr.length) return true; [arr[i], arr[j]] = [arr[j], arr[i]]; OPEN.clear(); OPEN.add(k.split('.')[0] + '.' + j); markDirty(); render(); return true; }
  if (act === 'cfg-discard') { CFG = mergeCfg(CFG_DEFAULT, readEmbedded()); CFG_DIRTY = false; clearDraft(); applyTheme(); render(); toast('عادت الإعدادات إلى آخر نسخة منشورة'); return true; }
  if (act === 'cfg-reset') { if (!RESET_ARMED) { RESET_ARMED = true; render(); return true; } RESET_ARMED = false; CFG = clone(CFG_DEFAULT); markDirty(); applyTheme(); render(); toast('استُعيدت الإعدادات الأصلية — اضغطي «حفظ ونشر» لاعتمادها'); return true; }
  if (act === 'cfg-copy') { const ta = document.getElementById('cfg-export'); const done = () => toast('نُسخ النص'); try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.focus(); ta.select(); toast('النص محدد — انسخيه يدويًا'); }); } catch (e2) { ta.focus(); ta.select(); toast('النص محدد — انسخيه يدويًا'); } return true; }
  if (act === 'cfg-import') { const raw = document.getElementById('cfg-import').value.trim(); try { const v = JSON.parse(raw); if (!v || typeof v !== 'object' || Array.isArray(v)) throw 0; CFG = mergeCfg(CFG_DEFAULT, v); markDirty(); applyTheme(); render(); toast('استُعيدت الإعدادات من النص'); } catch (e2) { toast('النص غير صالح — تأكدي أنك لصقت نسخة كاملة تبدأ بـ { وتنتهي بـ }'); } return true; }
  if (act === 'cfg-publish') { if (CFG_DIRTY && !PUBLISHING && !READONLY) publishCfg(); return true; }
  return false;
}

/* ---- saving: the page republishes itself with the new settings embedded ---- */
const HEAD_HTML = '<title>NAIOSH Intelligence</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">\n';
const SHELL_HTML = '<div class="app" id="app" dir="rtl" lang="ar">\n  <aside class="side" id="side" aria-label="القائمة الرئيسية"></aside>\n  <div class="main">\n    <header class="top" id="top"></header>\n    <main class="view" id="view" tabindex="-1"></main>\n  </div>\n</div>\n<div id="tour"></div>\n<div id="toast" aria-live="polite"></div>\n';
function buildDoc() {
  const ST = 'scr' + 'ipt';
  const resetCss = (document.head.querySelector('style') || {}).textContent || ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fafaf7}img{max-width:100%}[hidden]{display:none!important}';
  const css = document.getElementById('app-css').textContent;
  const json = JSON.stringify(CFG).replace(/</g, '\\u003c');
  const scripts = Array.from(document.querySelectorAll(ST + '[data-app]')).map(x => '<' + ST + ' data-app="">' + x.textContent + '</' + ST + '>').join('\n');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss + '</style></head><body>'
    + HEAD_HTML + '<style id="app-css">' + css + '</style>\n'
    + '<' + ST + ' type="application/json" id="naiosh-config">' + json + '</' + ST + '>\n'
    + SHELL_HTML + scripts + '\n</body></html>';
}
async function publishCfg() {
  const art = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null;
  if (!art) { toast('النشر متاح فقط من صفحة الرابط لمن يملك صلاحية التعديل. تغييراتك محفوظة في هذا المتصفح.'); return; }
  PUBLISHING = true; render();
  try { sessionStorage.setItem('naiosh-published', '1'); sessionStorage.setItem('naiosh-force-draft', '1'); } catch (e) {}
  try {
    await art.publish(buildDoc());
    try { sessionStorage.removeItem('naiosh-force-draft'); } catch (e) {}
    clearDraft();
  } catch (err) {
    PUBLISHING = false;
    try { sessionStorage.removeItem('naiosh-published'); } catch (e) {}
    const code = err && err.code;
    if (code === 'conflict') { toast('حُدّثت الصفحة من مكان آخر — ستُعاد تحميلها مع الاحتفاظ بتغييراتك'); return; }
    try { sessionStorage.removeItem('naiosh-force-draft'); } catch (e) {}
    if (code === 'not_writer' || code === 'not_granted') { READONLY = true; toast('لا تملكين صلاحية النشر في هذا العرض. التغييرات محفوظة في متصفحك.'); }
    else if (code === 'capability_disabled' || code === 'not_declared') toast('النشر غير متاح في هذا العرض.');
    else if (code === 'rate_limited') toast('نشرات كثيرة متتالية — انتظري دقيقة ثم أعيدي المحاولة.');
    else if (code === 'too_large') toast('المحتوى أكبر من المسموح — قلّلي النصوص الطويلة.');
    else toast('تعذّر النشر الآن' + (code ? ' (' + code + ')' : '') + '. تغييراتك محفوظة في متصفحك.');
    render();
  }
}
(function forceDraft() {
  try {
    if (sessionStorage.getItem('naiosh-force-draft') === '1') {
      sessionStorage.removeItem('naiosh-force-draft');
      const d = JSON.parse(localStorage.getItem('naiosh-cfg-draft') || 'null');
      if (d && d.cfg && sessionStorage.getItem('naiosh-published') !== '1') { CFG = mergeCfg(CFG_DEFAULT, d.cfg); CFG_DIRTY = true; }
    }
  } catch (e) {}
})();
async function detectEditor() {
  const has = () => window.claude && typeof window.claude.use === 'function';
  if (!has()) await new Promise(r => setTimeout(r, 1500));
  if (!has()) { CAN_EDIT = true; render(); return; }
  try { const u = await window.claude.use('user'); CAN_EDIT = u ? !!(await u.canEdit()) : false; } catch (e) { CAN_EDIT = false; }
  render();
}
</script>
