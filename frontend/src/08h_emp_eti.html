function empQuality(j) {

      ${err !== null ? `<div class="banner ${Math.abs(err) <= m.band ? 'g' : 'y'}">خطأ التنبؤ بعد ${m.H} يومًا: ${err >= 0 ? '+' : ''}${fmtN(err, 1)} نقطة — ${Math.abs(err) <= m.band ? 'ضمن نطاق عدم اليقين' : 'خارج النطاق؛ يُعاد معايرة النموذج وتُسجل الدروس'}.</div>` : ''}
      ${egNote('التوقع خطي مبني على معدل التقدم الحالي مع نطاق عدم يقين، ولا يُعرض السيناريو الأفضل كنتيجة مضمونة. لا يُستخدم التوقع وحده لحرمان متعلم من فرصة أو لاتخاذ قرار عالي الأثر بحقه.')}`);
  }
  return egCard('التقرير الاستشاري وخطة التطوير', 'ETI-11/13/19', `${anTbl({ h: 'الأسباب المحتملة مرتبة بقوة الأدلة', cols: ['السبب المحتمل', 'الدليل الحالي', 'قوة الدليل', 'بيانات للتحقق'], rows: m.causes })}
    ${anTbl({ h: 'الخيارات مرتبة حسب الأثر والتكلفة والسهولة والمخاطر', cols: ['الخيار', 'أثر متوقع (نقاط)', 'التكلفة', 'السهولة 1–5', 'المخاطر 1–5', 'يعالج إشارات مرصودة'], rows: m.opts.map(o => [o.nm, '+' + o.eff, fmtN(o.cost, 0), o.ease, o.risk, o.fit ? o.fit + ' إشارة' : '—']) })}
    <div class="sub" style="gap:6px"><b style="font-size:13.5px;color:var(--yellow)">التوصية: ${m.opts[0].nm}</b><span style="font-size:12.5px">ابدأ بتجربة محدودة على مجموعة واحدة لمدة 4 أسابيع، ثم قارن تغيرها بمجموعة لم تتلق التدخل قبل التعميم.</span><span class="faint" style="font-size:12px">خطة القياس: إعادة القياس يوم ${m.H} بالأداة نفسها أو أداة مكافئة معتمدة، ومقارنة النتيجة بالتوقع المسجل الآن (${fmtN(m.base, 1)}).</span></div>
    ${egNote('لا تُغلق خطة التحسين دون تحقق من تنفيذ الإجراءات وقياس النتائج. ضعف الأداء لا يعني دائمًا نقص التدريب؛ قد يكون السبب في التقييم أو المحتوى أو الظروف.')}`);
};
VIEWS.edu = () => {
  const s = egS('eti');
  let inputs = '';
  if (s.tab === 'ctx') inputs = egCard('ملف الجهة والبرنامج', 'ETI-02/05', egQ(1, 'نوع الجهة', egCh('eti', 'org', ETI_ORG)) + egGrid(170, egTxt('eti', 'program', 'البرنامج أو المقرر') + egNum('eti', 'learners', 'عدد المتعلمين') + egNum('eti', 'days', 'مدة دورة القياس (يوم)') + egNum('eti', 'target', 'الهدف (متوسط من 100)') + egNum('eti', 'mastery', 'حد الإتقان') + egNum('eti', 'cost', 'تكلفة البرنامج')) + egQ(2, 'هل توجد مجموعة مقارنة مناسبة؟', egCh('eti', 'comp', [['yes', 'نعم'], ['no', 'لا']])));
  if (s.tab === 'measure' || s.tab === 'fcst') inputs = egCard('بيانات القياس', 'خط الأساس ← المرحلي ← البعدي', egGrid(150, egNum('eti', 'pre', 'متوسط القياس القبلي (اليوم 0)') + egNum('eti', 'dayD', 'يوم القياس المرحلي') + egNum('eti', 'mid', 'المتوسط المرحلي') + egNum('eti', 'sd', 'الانحراف المعياري للدرجات') + egNum('eti', 'mPre', 'نسبة الإتقان القبلية %') + egNum('eti', 'mMid', 'نسبة الإتقان المرحلية %') + egNum('eti', 'drop', 'الانسحاب حتى الآن %') + egNum('eti', 'att', 'الحضور %') + egNum('eti', 'eng', 'المشاركة %') + egNum('eti', 'appl', 'إظهار المهارة عمليًا %') + (s.comp === 'yes' ? egNum('eti', 'cPre', 'مجموعة المقارنة — قبلي') + egNum('eti', 'cMid', 'مجموعة المقارنة — مرحلي') : '') + egNum('eti', 'post', 'القياس البعدي الفعلي (بعد انتهاء الدورة)')));
  if (s.tab === 'consult') inputs = egCard('الإشارات المرصودة', 'ETI-04/11', egCh('eti', 'sig', ETI_SIG, true) + egNote('بعض الإشارات تُضاف تلقائيًا من البيانات (الحضور أقل من 85%، المشاركة أقل من 70%، القياس القبلي أقل من 55).'));
  return `${engHead('NAIOSH EDUCATION & TRAINING INTELLIGENCE 360 · DIA-ETI', 'تحليل بيانات التعليم والتدريب والتحليل التنبؤي', 'تحويل البيانات التعليمية والتدريبية إلى قرارات قابلة للتنفيذ والقياس: خط أساس، مقارنة محكومة، تشخيص، استشارة، ثم قياس بعدي وتنبؤ يُتحقق منه بعد ثلاثة أشهر.', engExport('ETI'))}
  ${egTabs('eti', [['ctx', 'السياق والمقارنات'], ['measure', 'القياس والمؤشرات'], ['fcst', 'التنبؤ 90 يومًا'], ['consult', 'الاستشارة والخطة']])}
  ${inputs}${egOut('eti')}`;
};
