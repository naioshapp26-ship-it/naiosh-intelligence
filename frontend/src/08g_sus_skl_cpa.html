function susQs() { const s = egS('sus'), ext = (SUS_SECT[s.sector] || [, []])[1]; return SUS_AX.map(([c, n, d, who, qs]) => ({ c, n, d, who, qs: qs.map(([id, t, crit, inv]) => ({ id, t, crit: !!crit, inv: !!inv })).concat(ext.filter(x => x[2] === c).map(([id, t]) => ({ id, t, crit: false, inv: false, sect: true }))) })); }
function susModel() {
  const s = egS('sus'), a = s.ans || {}, ev = s.ev || {}, axes = susQs();

    const vals = [];

      total++; const v = a[q.id];

}
