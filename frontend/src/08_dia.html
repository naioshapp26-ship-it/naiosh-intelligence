
<script data-app="">
/* ================= DIA additions: command center intel, quality, context, analysis, root cause, what-if, memory, ledger ================= */
function healthNow() {
  const dims = (CFG.health || []).map(d => {
    let v = +d.score || 0;
    if (S.measured && d.boost) v = Math.min(100, v + (+d.boost || 0));
    return { ...d, v };
  });
  const avg = dims.length ? Math.round(dims.reduce((a, b) => a + b.v, 0) / dims.length) : 0;
  const st = avg >= 80 ? ['مستقرة', 'var(--green)', 't-s'] : avg >= 65 ? ['تحتاج انتباه', 'var(--yellow)', 't-m'] : ['حرجة', 'var(--red)', 't-c'];
  return { dims, avg, st };
}

    { k: 'خطر محتمل', t: 't-h', title: 'تسرّب الكفاءات من الفرع (R-01) — السرعة: سريعة', ev: 'السبب: ضغط العمل بعد موجة مغادرة', r: 'risks' },
    { k: 'فرصة محتملة', t: 't-s', title: 'نقل ممارسات الفرع الجنوبي الأعلى أداءً', ev: 'البيانات: حالة مطابقة CNS-2025-114 · تعافٍ خلال 6 أسابيع', r: 'risks' },
    { k: 'سؤال يحتاج إجابة', t: 't-m', title: S.qDone ? 'لا توجد بيانات كافية عن الغياب لتثبيت استنتاج الإنتاجية' : 'ثلاث فجوات بيانات تمنع تشخيصًا موثوقًا', ev: S.qDone ? 'البيانات الناقصة: سجل الغياب الشهري' : 'البيانات الناقصة: الدوران، التدريب، الشكاوى', r: S.qDone ? 'rootcause' : 'questionnaire' },
    { k: 'توصية', t: 't-i', title: 'REC-2026-118: ' + (SOLS_FN().find(s => s.rec) || SOLS_FN()[0] || { name: '—' }).name, ev: 'الحل المقترح · Score ' + ((SOLS_FN().find(s => s.rec) || {}).score || '—'), r: 'solutions' }

  return items;
}

  const overall = src.length ? Math.round(src.reduce((a, s) => a + s.d.reduce((x, y) => x + y, 0) / 7, 0) / src.length) : 0;
  const recs = (s) => parseInt(String(s.rec).replace(/[^\d]/g, ''), 10) || 0;
  const checks = ['بيانات مفقودة', 'مكررة', 'قيم شاذة', 'تعارضات', 'قديمة', 'موثوقية المصدر'];

    ['Q-01', 'ساعات التدريب غير مسجلة لـ 42% من موظفي الفرع', 'التدريب LMS', 'منخفض', 't-h'],
    ['Q-02', 'آخر مزامنة للموارد البشرية قبل 9 أيام', 'الموارد البشرية', 'تنبيه', 't-m'],
    ['Q-03', '1,240 سجل عميل مكرر بين الفروع', 'إدارة العملاء CRM', 'تنبيه', 't-m'],
    ['Q-04', 'موصل خدمة العملاء غير متصل', 'خدمة العملاء', 'حرج', 't-c']
  ];
  S.qfix = S.qfix || {};
  return `
  <section class="grid g4">${[['جودة البيانات', overall], ['الاكتمال', avgDim(0)], ['الحداثة', avgDim(3)], ['الاتساق', avgDim(2)]].map(([l, v]) => `<div class="kpi"><span class="lbl" style="color:var(--muted)">${l}</span><span class="v" style="color:${v >= 90 ? 'var(--greenfg)' : v >= 80 ? 'var(--yellow)' : 'var(--orangefg)'}">${v}%</span><span class="bar" style="height:4px"><i style="width:${v}%;background:${v >= 90 ? 'var(--green)' : v >= 80 ? 'var(--yellow)' : 'var(--orange)'}"></i></span></div>`).join('')}</section>
  <section class="card"><div class="row between"><h2 class="h-sec">فحوصات الجودة لكل مصدر — قبل السماح بأي تحليل</h2><span class="lbl">Missing · Duplicate · Outliers · Conflicts · Stale · Reliability</span></div>

    </tbody></table></div></section>

    <div class="card"><h2 class="h-sec">مشكلات الجودة المفتوحة</h2>

      <div class="card tight"><b style="font-size:13.5px">سياق مرتبط</b>
        ${[['قرار سابق', 'DEC-2025-114 · تراجع الفرع الجنوبي', 'memory'], ['استشارة مشابهة', 'CNS-003 · دوران الموظفين الجدد', 'consult'], ['سياسة', 'POL-HR-07 · التدريب والتطوير', 'knowledge'], ['مؤشر', 'مؤشر أداء الفروع · أسبوعي', 'analysis']].map(([k, v, r]) => `<button type="button" class="list-btn" data-go="${r}" style="padding:8px 10px;align-items:center"><span class="tag t-n">${k}</span><span style="font-size:12.5px;flex-grow:1">${v}</span></button>`).join('')}</div>

};

/* ---------- DIA-07 analysis: patterns, comparisons, relationships ---------- */

/* ---------- DIA-11 what-if lab ---------- */
const WI_PRESETS = [
  ['cost', 'ماذا لو خفضنا التكلفة 10٪؟', { c: -10, d: 0, s: 0, t: 0, sup: false }],
  ['demand', 'ماذا لو زاد الطلب 30٪؟', { c: 0, d: 30, s: 0, t: 0, sup: false }],
  ['supplier', 'ماذا لو فقدنا المورد الرئيسي؟', { c: 0, d: 0, s: 0, t: 0, sup: true }],
  ['staff', 'ماذا لو أضفنا موظفين 15٪؟', { c: 0, d: 0, s: 15, t: 0, sup: false }],
  ['resources', 'ماذا لو زدنا الموارد 20٪؟', { c: 8, d: 0, s: 20, t: 0, sup: false }],
  ['solution', 'ماذا لو نفذنا الحل الموصى به؟', { c: 3, d: 0, s: 5, t: 3, sup: false }]
];
function wiState() { if (!S.wi) S.wi = { p: 'cost', ...WI_PRESETS[0][2] }; return S.wi; }
function wiCalc(w, k) {
  const m = { cons: 0.6, base: 1, opt: 1.3, crisis: 0.8 }[k];
  let prod = (0.4 * w.s + 2.2 * w.t - (w.c < 0 ? 0.35 * Math.abs(w.c) : 0) - (w.sup ? 6 : 0) - Math.max(0, w.d - w.s) * 0.12) * m;
  let cost = (w.c + 0.6 * w.s + 0.8 * w.t + (w.sup ? 9 : 0)) * (k === 'crisis' ? 1.2 : 1);
  let risk = 55 + (w.c < 0 ? 0.6 * Math.abs(w.c) : 0) + 0.5 * Math.max(0, w.d - w.s) - 3 * w.t - 0.3 * w.s + (w.sup ? 18 : 0);
  if (k === 'opt') risk -= 5; if (k === 'cons') risk += 3; if (k === 'crisis') { prod -= 8; risk += 20; }
  const sat = 0.3 * prod - 0.25 * Math.max(0, w.d - w.s - prod);
  const perf = 64 + 0.6 * prod;
  return { prod: Math.round(prod * 10) / 10, cost: Math.round(cost * 10) / 10, risk: Math.max(0, Math.min(100, Math.round(risk))), sat: Math.round(sat * 10) / 10, perf: Math.round(perf) };
}
function wiOut() {
  const w = wiState(), sc = [['cons', 'متحفظ'], ['base', 'متوقع'], ['opt', 'متفائل'], ['crisis', 'أزمة']];
  const r = sc.map(([k, l]) => ({ k, l, ...wiCalc(w, k) })), b = r[1];
  const verdict = b.risk > 70 || b.perf < 60 ? ['غير موصى به', 't-c', 'var(--red)'] : b.perf >= 70 && b.risk <= 55 ? ['مناسب', 't-s', 'var(--green)'] : ['يحتاج تعديل', 't-m', 'var(--yellow)'];
  const why = [];
  if (b.prod < 0) why.push('الإنتاجية تنخفض ' + Math.abs(b.prod) + '%');
  if (b.prod > 0) why.push('الإنتاجية ترتفع ' + b.prod + '%');
  if (b.cost > 0) why.push('التكلفة ترتفع ' + b.cost + '%'); else if (b.cost < 0) why.push('التكلفة تنخفض ' + Math.abs(b.cost) + '%');
  why.push('درجة المخاطر ' + b.risk + (b.risk > 60 ? ' — فوق حد التقبّل' : ' — ضمن الحد'));
  if (r[3].perf < 55) why.push('في سيناريو الأزمة يهبط المؤشر إلى ' + r[3].perf);
  const fmt = (v, inv) => `<span class="mono" style="color:${(inv ? -v : v) > 0 ? 'var(--greenfg)' : (inv ? -v : v) < 0 ? '#FF6B81' : 'var(--soft)'}">${v > 0 ? '+' : ''}${v}%</span>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>السيناريو</th><th>الإنتاجية</th><th>التكلفة</th><th>رضا العملاء</th><th>المخاطر</th><th>مؤشر الأداء</th></tr></thead><tbody>
    ${r.map(x => `<tr style="${x.k === 'base' ? 'background:#16161B' : ''}"><td><b>${x.l}</b></td><td>${fmt(x.prod)}</td><td>${fmt(x.cost, true)}</td><td>${fmt(x.sat)}</td><td class="mono" style="color:${x.risk > 60 ? '#FF6B81' : x.risk > 45 ? 'var(--yellow)' : 'var(--greenfg)'}">${x.risk}</td><td class="big" style="font-size:15px;color:${x.perf >= 70 ? 'var(--greenfg)' : x.perf >= 60 ? 'var(--yellow)' : '#FF6B81'}">${x.perf}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="sub" style="border-color:${verdict[2]};gap:8px"><div class="row between"><b style="font-size:14px">محاكاة القرار — التوصية</b><span class="tag ${verdict[1]}" style="font-size:12.5px;padding:4px 12px">${verdict[0]}</span></div>
    <div class="stack" style="gap:4px">${why.map(x => `<span class="row nowrap" style="font-size:12.5px">${ic('dotc', 12, 'style="color:var(--yellow);stroke-width:4"')}${x}</span>`).join('')}</div>
    <span class="faint" style="font-size:11.5px">نموذج توضيحي مبني على علاقات الاستشارة CNS-001. القرار النهائي لصاحب الصلاحية.</span></div>`;
}

function askVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('الإملاء الصوتي غير مدعوم في هذا المتصفح — جرّب Chrome'); return; }
  if (S.listening) { try { window.__sr && window.__sr.stop(); } catch (e) {} return; }
  const r = new SR(); window.__sr = r; r.lang = 'ar-SA'; r.interimResults = false;
  r.onresult = (e) => { const t = Array.from(e.results).map(x => x[0].transcript).join(' '); S.q = t; render(); toast('تم إدخال السؤال بالصوت'); };
  r.onerror = (e) => { toast(e.error === 'not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون' : 'تعذّر التعرّف على الصوت'); };
  r.onend = () => { S.listening = false; render(); };
  try { r.start(); S.listening = true; render(); toast('تحدّث الآن…'); } catch (e) { toast('تعذّر تشغيل الميكروفون'); }
}
function diaHandle(act, k) {
  if (act === 'ask-voice') { askVoice(); return true; }
  if (act === 'back') { const h = S.hist || []; const prev = h.pop(); S.hist = h; S.route = prev || 'home'; S.menu = false; render(); window.scrollTo(0, 0); return true; }
