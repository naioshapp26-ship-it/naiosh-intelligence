function benchDecision() {
  const i = BB().inp;
  const market = Math.round(Math.min(100, i.interviews * 2) * 0.5 + Math.min(100, i.wtp * 3) * 0.5);
  const finance = Math.round(Math.min(100, i.runway / 12 * 100));
  const fit = Math.round(Math.min(100, i.exp * 10) * 0.6 + i.team * 0.4);
  const legal = i.legal ? 100 : 30;
  const conds = [];
  if (!i.legal) conds.push('حصر المتطلبات النظامية والتراخيص للنشاط والدولة');
  if (i.interviews < 20) conds.push('رفع مقابلات العملاء المحتملين إلى 20 على الأقل');
  if (i.wtp < 10) conds.push('اختبار الاستعداد للدفع بتجربة بيع محدودة');
  if (i.runway < 9) conds.push('سيولة تغطي 9 أشهر تشغيل على الأقل');
  if (i.team < 70) conds.push('استكمال الأدوار الأساسية في الفريق');
  let d;
  if (market < 15 && i.runway < 4) d = ['تأجيل المشروع أو عدم الاستثمار حاليًا', 't-c', 'الأدلة الحالية تُظهر طلبًا ضعيفًا وسيولة غير كافية.'];
  else if (i.interviews < 10) d = ['طلب معلومات إضافية قبل أي قرار', 't-m', 'عدد المقابلات غير كافٍ لاستنتاج وجود طلب حقيقي.'];
  else if (market < 35) d = ['تنفيذ تجربة سوقية مصغرة قبل الاستثمار الكامل', 't-h', 'هناك اهتمام، لكن لا يوجد دليل كافٍ على الاستعداد للدفع.'];
  else if (i.runway < 6) d = ['تعديل نموذج العمل أو خطة التمويل', 't-h', 'الطلب واعد لكن السيولة لا تحتمل تأخر الإيرادات.'];
  else if (i.exp < 2 && i.team < 50) d = ['طلب خبرة متخصصة أو شريك قبل التأسيس', 't-m', 'فجوة في الخبرة والفريق تزيد مخاطر التنفيذ.'];
  else if (market >= 60 && i.runway >= 9 && i.legal) d = ['الاستعداد للانتقال إلى مرحلة التأسيس بعد استكمال الشروط', 't-s', 'الأدلة كافية للانتقال مع متابعة الشروط المتبقية.'];

  const be = Math.max(4, Math.round(20 - market / 7 - Math.min(i.runway, 12) / 4));

}

function cvAnalyze(text) {

  const edu = lines.filter(l => /بكالوريوس|ماجستير|دكتوراه|دبلوم|Bachelor|Master|MBA|PhD/i.test(l));
  const certs = lines.filter(l => /NEBOSH|IOSH|OSHA|PMP|PRINCE2|Lead Auditor|CSP|Six Sigma|شهادة/i.test(l) && !/^مهارات/.test(l));
  let years = 0; (String(text).match(/(\d+)\s*(سنوات|سنة|عامًا|عاما|years)/gi) || []).forEach(m => { const n = parseInt(m, 10); if (n > years && n < 50) years = n; });
  const roles = lines.filter(l => /مهندس|مدير|مسؤول|محلل|أخصائي|Engineer|Manager|Officer|Analyst|Specialist/i.test(l) && /\d{4}/.test(l));
  const ach = lines.filter(l => /خفض|رفع|زيادة|تقليل|حقق|طوّر|طور|أطلق|قدت|نفذت|أعددت|reduced|increased|led/i.test(l)).map(l => ({ t: l.replace(/^[•\-\*]\s*/, ''), m: hasNum(l) }));
  const skills = {};
  for (const [cat, list] of Object.entries(CV_SKILLS)) {
    skills[cat] = list.filter(s => text.includes(s)).map(s => ({ s, ev: lines.some(l => l.includes(s) && hasNum(l)) ? 'مدعوم بإنجاز رقمي' : 'مذكور فقط' }));
  }
  const ambition = lines.find(l => /الطموح|أطمح|الهدف المهني|ambition|objective/i.test(l)) || '';
  const innov = ach.filter(a => /طوّر|طور|ابتكر|أتمتة|نظام|لوحة/.test(a.t));
  return { lines, edu, certs, years, roles, ach, skills, ambition, innov };
}

function engineHandle(act, k, el) {
  if (!act || !/^(bench|saf|self|cv|eng)-/.test(act)) return false;
  const [key, val] = String(k || '').split('|');
  switch (act) {
    case 'bench-track': BB().track = k; render(); return true;
    case 'bench-lvl': BB().lvl = k; render(); return true;
    case 'bench-send': log('د. عدنان', 'أرسل خطة تحسين المقارنة المعيارية (3 توصيات) إلى مركز القرار'); toast('أُرسلت التوصيات إلى مركز القرار'); go('decision'); return true;
    case 'saf-a': SF().a[key] = val; render(); return true;
    case 'saf-m': { const a = SF().a, arr = a[key] || (a[key] = []); const i = arr.indexOf(val); if (i >= 0) arr.splice(i, 1); else arr.push(val); render(); return true; }
    case 'saf-f': { const f = SF().f; f[key] = f[key] === val ? undefined : val; if (!f[key]) delete f[key]; render(); return true; }
    case 'saf-sel': SF().sel = k; render(); return true;
    case 'saf-view': SF().view = k; render(); return true;
    case 'saf-review': { const s = SF(); if (!s.reviewed) { s.reviewed = true; const m = safModel(); log('د. عدنان', `رفع تقييم السلامة للمراجعة البشرية — ${(n => n === 1 ? 'خطر حرج واحد' : n === 2 ? 'خطران حرجان' : n + ' أخطار حرجة')(m.rows.filter(r => r.pr === 1).length)}`); toast('أُرسل التقييم لمراجعة مختص السلامة'); } render(); return true; }
    case 'self-purpose': SL().purpose = val; render(); return true;
    case 'self-start': { const c = document.getElementById('self-agree'); if (!c || !c.checked) { toast('ضع علامة الموافقة أولًا'); return true; } SL().consent = true; log('د. عدنان', 'بدأ جلسة تحليل الذات (بموافقة صريحة)'); render(); window.scrollTo(0, 0); return true; }
    case 'self-dom': SL().dom = k; render(); return true;
    case 'self-skip': { const s = SL(); s.skip[k] = !s.skip[k]; render(); return true; }
    case 'self-next': { const s = SL(), i = SELF_DOMAINS.findIndex(d => d.k === s.dom); if (i < SELF_DOMAINS.length - 1) { s.dom = SELF_DOMAINS[i + 1].k; render(); window.scrollTo(0, 0); } else { render(); const r = document.getElementById('self-report'); if (r) r.scrollIntoView({ block: 'start' }); } return true; }
    case 'self-approve': { const s = SL(); const n = Object.values(s.goals).filter(Boolean).length; if (!n) { toast('اختر هدفًا واحدًا على الأقل'); return true; } s.approved = true; log('د. عدنان', `اعتمد خطة تطوير شخصية (${n === 1 ? 'هدف واحد' : n === 2 ? 'هدفان' : n + ' أهداف'})${s.link ? ' وربطها بمركز التنفيذ' : ''}`); toast('اعتُمدت خطتك — المراجعة بعد 30 يومًا'); render(); return true; }
    case 'self-delete': { const s = SL(); if (!s.del) { s.del = true; render(); return true; } S.self = undefined; delete S.self; log('د. عدنان', 'حذف بيانات تحليل الذات بالكامل'); toast('حُذفت بياناتك'); render(); return true; }
    case 'cv-mode': CVS().mode = k; render(); return true;
    case 'cv-job': CVS().job = val; render(); return true;
    case 'cv-sample': { const c = CVS(); c.text = CV_SAMPLE; c.done = true; render(); return true; }
    case 'cv-run': { const c = CVS(), t = document.getElementById('cv-text'); if (t) c.text = t.value; if (c.text.trim().length < 40) { toast('الصق نص السيرة الذاتية أولًا'); return true; } c.done = true; log('د. عدنان', 'حلّل سيرة ذاتية في تحليل السيرة الذاتية'); render(); return true; }
    case 'cv-log': log('د. عدنان', 'أحال تقرير ملاءمة مرشح للقرار البشري'); toast('أُحيل التقرير لصاحب القرار — القرار الوظيفي بشري'); return true;
    case 'eng-pdf': case 'eng-xlsx': engExportRun(k, act === 'eng-pdf' ? 'pdf' : 'xlsx'); return true;
  }
  return false;
}

      { h: 'سجل الأخطار الموحد', cols: ['الخطر', 'PEEM', 'الحدث', 'العاقبة', 'قبل الضوابط', 'المتبقي', 'الأولوية', 'إيقاف/تصعيد'], rows: m.rows.map(r => [r.n, r.cat, r.ev, r.cons, r.inh, r.res, PR[r.pr][0], r.stop ? 'نعم' : '']) },

async function engExportRun(code, fmt) {

  try {
    const blob = fmt === 'pdf' ? await buildPdf(rep) : buildXlsx(rep);
    log('د. عدنان', `صدّر «${r.title}» بصيغة ${fmt === 'pdf' ? 'PDF' : 'Excel'}`);
    await saveFile(`NAIOSH_${r.ref}_${expToday()}.${fmt === 'pdf' ? 'pdf' : 'xlsx'}`, blob);
  } catch (e) { console.error(e); toast('تعذّر إنشاء الملف'); }
}
