function renderTour() {
  const el = document.getElementById('tour');
  if (!S.tour.on) { el.innerHTML = (window.NAIOSH_SERVER && typeof svCan === 'function' && !svCan('config.edit')) ? '' : `<button type="button" class="btn sm y tour-min" data-act="tour-open" aria-label="العرض الموجّه" title="العرض الموجّه">${ic('play', 14)}<span class="tour-lbl">العرض الموجّه</span></button>`; return; }
  const i = S.tour.i, st = TOUR[i];
  el.innerHTML = `<section class="tour" aria-label="العرض الموجّه">
    <div class="row between nowrap"><span class="eyebrow">PRESENTER GUIDE · ${i + 1}/${TOUR.length}</span>
      <button type="button" class="btn link sm" data-act="tour-close">إخفاء</button></div>
    <div class="bar" style="height:4px"><i style="width:${((i + 1) / TOUR.length) * 100}%"></i></div>
    <h2 style="font-family:var(--f-display);font-size:17px">${st.t}</h2>
    <p style="font-size:13.5px;line-height:1.75;color:var(--fg2)">${st.d}</p>
    <div class="row between nowrap">
      <button type="button" class="btn sm" data-act="tour-reset" title="إعادة العرض من البداية">${ic('reset', 14)}من البداية</button>
      <div class="row nowrap">
        <button type="button" class="btn sm" data-act="tour-prev" ${i === 0 ? 'aria-disabled="true"' : ''}>السابق</button>
        <button type="button" class="btn sm primary" data-act="tour-next">${i === TOUR.length - 1 ? 'إنهاء' : 'التالي'}</button>
      </div>
    </div>
  </section>`;
}
</script>
