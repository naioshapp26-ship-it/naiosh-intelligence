function qaNorm(s) {

}

}

  const listHtml = `<section class="card" style="gap:10px"><div class="row between" style="gap:8px"><h2 class="h-sec">الأسئلة المدرّبة (${D.entries.length})</h2><span class="row nowrap" style="gap:6px"><span class="fx-menu"><button type="button" class="btn sm" data-act="fx-menu" aria-expanded="${S.fxOpen ? 'true' : 'false'}">${ic('upload', 14)}تصدير ▾</button>${S.fxOpen ? `<span class="fx-pop" role="menu"><button type="button" role="menuitem" data-act="qa-export-pdf">${ic('reports', 14)}PDF</button><button type="button" role="menuitem" data-act="qa-export-xlsx">${ic('chart', 14)}Excel</button><button type="button" role="menuitem" data-act="qa-export">${ic('clip', 14)}CSV</button></span>` : ''}</span><label class="btn sm" style="cursor:pointer">${ic('plus', 14)}استيراد من ملف<input type="file" id="qa-import2" multiple hidden></label></span></div>
    <input type="search" id="qa-filter" placeholder="ابحث في الأسئلة والإجابات…" value="${esc(S.qaFilter || '')}">
    ${list.length ? list.map(e => `<div class="fd-row ${e.active ? '' : 'off'}"><div class="row between nowrap" style="gap:8px"><span class="q">${esc(e.question)}</span><span class="row nowrap" style="gap:6px"><span class="tag t-i">${esc(e.category || 'عام')}</span>${e.uses ? `<span class="faint" style="font-size:11px">استُخدم ${e.uses}</span>` : ''}</span></div>
      ${(e.variants || []).length ? `<div class="v">${e.variants.slice(0, 6).map(v => `<span>${esc(v)}</span>`).join('')}${e.variants.length > 6 ? `<span>+${e.variants.length - 6}</span>` : ''}</div>` : ''}
      <span class="a">${esc(e.answer)}</span>
      <div class="row" style="gap:6px"><button type="button" class="btn sm" data-act="qa-edit" data-k="${e.id}">تعديل</button><button type="button" class="btn link sm" data-act="qa-toggle" data-k="${e.id}">${e.active ? 'إيقاف' : 'تفعيل'}</button></div></div>`).join('') : '<p class="faint" style="margin:0">لا نتائج.</p>'}
    <span class="faint" style="font-size:11px">الاستيراد يقبل أي ملف: Excel وCSV وWord وPDF ونصوص وJSON (جدول بأعمدة السؤال والإجابة، أو نص بصيغة «س: … ج: …» أو سؤال ينتهي بـ ؟ وتحته إجابته)، والصور والفيديو تُرفق بإجابة. الأعمدة: السؤال، الإجابة، التصنيف، الصيغ الأخرى (مفصولة بـ |).</span></section>`;
  return head + `${anKpis([['أسئلة مدرّبة', D.entries.length], ['مفعّلة', active], ['مرات الإجابة', uses], ['بانتظار التدريب', D.unanswered.length, D.unanswered.length ? 'bad' : 'good']])}
    <div class="fd-grid"><div class="stack" style="gap:16px">${form}${test}${un}</div><div class="stack" style="gap:16px">${listHtml}</div></div>
    ${egNote('التدريب هنا قواعد مطابقة: نايوش يقارن سؤال المستخدم بالأسئلة وصيغها ويختار الأقرب، ولا يؤلف إجابات من عنده. عند ربط الذكاء الاصطناعي لاحقًا تصبح هذه الأسئلة والإجابات مرجعه الأول.')}`;
};
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.qa; if (k) { (S.qaForm || (S.qaForm = {}))[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; delete QA_ERR[k]; }
  if (e.target.id === 'qa-filter') { S.qaFilter = e.target.value; const pos = e.target.selectionStart; render(); const i = document.getElementById('qa-filter'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.qa; if (k) (S.qaForm || (S.qaForm = {}))[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; });
const qaFormToEntry = (f) => ({ question: String(f.question || '').trim(), variants: String(f.variants || '').split('\n').map(x => x.trim()).filter(Boolean), answer: String(f.answer || '').trim(), category: f.category || 'عام', keywords: f.keywords || '', link: f.link || '', active: f.active !== false, attachments: (f.attachments || []).map(a => ({ ...a })) });
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'qa-test') { e.preventDefault(); const q = (document.getElementById('qa-test-q') || {}).value || ''; if (!q.trim()) return; const m = qaMatch(q, qaData().entries); QA_TEST = { q: q.trim(), best: m.best }; render(); return; }
  if (e.target.id !== 'qa-form') return; e.preventDefault();
  const f = S.qaForm, x = qaFormToEntry(f); QA_ERR = {};
  if (x.question.length < 3) QA_ERR.question = 'اكتب السؤال.'; if (x.answer.length < 3) QA_ERR.answer = 'اكتب الإجابة.';
  if (Object.keys(QA_ERR).length) { render(); return; }
  if (rdServer()) {
    try {
      if (f.id) await api('PATCH', '/api/qa/' + f.id, x);
      else { const res = await fetch('/api/qa', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Naiosh': '1', 'X-From-Unanswered': String(f.fromUn || '') }, body: JSON.stringify(x) }); if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || 'تعذّر الحفظ'); } }
      await qaLoad();
    } catch (err) { toast(err.message); return; }
  } else {
    const D = qaData();
    if (f.id) Object.assign(D.entries.find(y => y.id === f.id) || {}, x);
    else { D.entries.unshift({ id: Math.max(0, ...D.entries.map(y => y.id)) + 1, uses: 0, ...x }); if (f.fromUn) S.qaUn = D.unanswered.filter(u => u.id !== f.fromUn); }
    if (typeof log === 'function') log('د. عدنان', `درّب «اسأل نايوش»: ${x.question}`);
  }
  toast(f.id ? 'حُفظ التعديل' : 'تعلّم نايوش السؤال الجديد'); S.qaForm = null; QA_TEST = null; render();
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'qa-import' || !e.target.files[0]) return;
  const text = await e.target.files[0].text(), rows = typeof anParseCSV === 'function' ? anParseCSV(text.replace(/^﻿/, '')) : text.split('\n').map(l => l.split(','));
  const body = rows.filter(r => r && r[0] && r[1] && !/^(السؤال|question)$/i.test(String(r[0]).trim()));
  let n = 0;
  for (const r of body) {
    const x = { question: String(r[0]).trim(), answer: String(r[1]).trim(), category: String(r[2] || 'عام').trim() || 'عام', variants: String(r[3] || '').split('|').map(v => v.trim()).filter(Boolean), keywords: '', link: '', active: true };
    if (rdServer()) { try { await api('POST', '/api/qa', x); n++; } catch (err) {} }
    else { const D = qaData(); D.entries.unshift({ id: Math.max(0, ...D.entries.map(y => y.id)) + 1, uses: 0, ...x }); n++; }
  }
  if (rdServer()) await qaLoad();
  toast('استُورد ' + n + ' سؤال'); render();
});
function qaHandle(act, k) {
  const D = qaData();
  switch (act) {
    case 'fd-tab': S.fdTab = k; render(); return true;
    case 'qa-new': S.qaForm = null; QA_ERR = {}; render(); return true;
    case 'qa-edit': { const x = D.entries.find(y => String(y.id) === String(k)); if (!x) return true; S.qaForm = { id: x.id, question: x.question, variants: (x.variants || []).join('\n'), answer: x.answer, category: x.category || 'عام', keywords: x.keywords || '', link: x.link || '', active: x.active, fromUn: null, attachments: (x.attachments || []).map(a => ({ ...a })) }; QA_ERR = {}; render(); const c = document.getElementById('qa-form-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
    case 'qa-toggle': { const x = D.entries.find(y => String(y.id) === String(k)); if (!x) return true; if (rdServer()) api('PATCH', '/api/qa/' + x.id, { active: !x.active }).then(qaLoad).then(render).catch(err => toast(err.message)); else { x.active = !x.active; render(); } return true; }
    case 'qa-del': if (!confirm('حذف هذا السؤال المدرّب؟')) return true; if (rdServer()) api('DELETE', '/api/qa/' + k).then(qaLoad).then(() => { S.qaForm = null; render(); }).catch(err => toast(err.message)); else { S.qa = D.entries.filter(y => String(y.id) !== String(k)); S.qaForm = null; render(); } toast('حُذف السؤال'); return true;
    case 'qa-train-un': { const u = D.unanswered.find(y => String(y.id) === String(k)); if (!u) return true; S.qaForm = { id: null, question: u.question, variants: '', answer: '', category: 'عام', keywords: '', link: '', active: true, fromUn: u.id }; QA_ERR = {}; render(); const c = document.getElementById('qa-form-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); const a = document.querySelector('[data-qa="answer"]'); if (a) a.focus(); return true; }
    case 'qa-train-test': S.qaForm = { id: null, question: QA_TEST.q, variants: '', answer: '', category: 'عام', keywords: '', link: '', active: true, fromUn: null }; QA_TEST = null; render(); { const a = document.querySelector('[data-qa="answer"]'); if (a) a.focus(); } return true;
    case 'qa-add-variant': { const x = D.entries.find(y => String(y.id) === String(k)); if (!x || !QA_TEST) return true; const vs = [...(x.variants || []), QA_TEST.q]; if (rdServer()) api('PATCH', '/api/qa/' + x.id, { variants: vs }).then(qaLoad).then(() => { QA_TEST = null; render(); toast('أُضيفت الصيغة'); }).catch(err => toast(err.message)); else { x.variants = vs; QA_TEST = null; toast('أُضيفت الصيغة'); render(); } return true; }
    case 'qa-dismiss': if (rdServer()) api('DELETE', '/api/qa/unanswered/' + k).then(qaLoad).then(render); else { S.qaUn = D.unanswered.filter(u => String(u.id) !== String(k)); render(); } return true;
    case 'qa-export': { const rows = [['السؤال', 'الإجابة', 'التصنيف', 'الصيغ الأخرى']].concat(D.entries.map(x => [x.question, x.answer, x.category || '', (x.variants || []).join(' | ')])); saveFile('NAIOSH_ask_training.csv', new Blob(['﻿' + anRowsToCSV(rows)], { type: 'text/csv;charset=utf-8' })); return true; }
    case 'qa-ask-link': go(k); return true;
    case 'qa-sug': { const x = D.entries.find(y => String(y.id) === String(k)); if (x) qaAsk(x.question); return true; }
  }
  return false;
}

/* ---------- «اسأل نايوش» answers from the trained questions ---------- */
async function qaAsk(q) {
  q = String(q || '').trim(); if (!q) return;
  const H = S.qaChat || (S.qaChat = []); H.push({ me: true, t: q }); render(); qaScroll();
  let r;
  if (rdServer()) { try { r = await api('POST', '/api/qa/ask', { q }); } catch (e) { r = { found: false, err: e.message, suggestions: [] }; } }
  else {
    const D = qaData(), m = qaMatch(q, D.entries);
    if (m.best && m.best.s >= QA_TH) { m.best.e.uses = (m.best.e.uses || 0) + 1; r = { found: true, answer: m.best.e.answer, question: m.best.e.question, score: Math.round(m.best.s * 100), link: m.best.e.link, attachments: m.best.e.attachments || [] }; }
    else { const n = qaNorm(q), u = D.unanswered.find(x => qaNorm(x.question) === n); if (u) u.count++; else D.unanswered.unshift({ id: Date.now(), question: q, count: 1, at: new Date().toISOString() }); r = { found: false, suggestions: m.top.filter(x => x.s >= QA_SUG).map(x => ({ id: x.e.id, question: x.e.question })) }; }
  }
  H.push({ me: false, r }); S.qaChat = H.slice(-30); render(); qaScroll();
}
function qaScroll() { setTimeout(() => { const c = document.getElementById('qa-chat'); if (c) c.scrollTop = c.scrollHeight; }, 20); }
function qaChatCard() {
  const H = S.qaChat || [];
  const msg = (m) => m.me ? `<div class="qa-msg me">${esc(m.t)}</div>` : m.r.found
    ? `<div class="qa-msg bot">${esc(m.r.answer)}${m.r.link && TITLES[m.r.link] ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-act="qa-ask-link" data-k="${esc(m.r.link)}">${esc(TITLES[m.r.link][1])}${ic('chev', 13)}</button></div>` : ''}${typeof qaAttachView === 'function' ? qaAttachView(m.r.attachments) : ''}<span class="meta">من الإجابات المدرّبة · «${esc(m.r.question)}» · تطابق ${m.r.score}%</span></div>`
    : `<div class="qa-msg bot">${m.r.err ? esc(m.r.err) : 'لم أتعلّم إجابة هذا السؤال بعد. سجّلته ليُضاف إلى تدريبي.'}${(m.r.suggestions || []).length ? `<div class="stack" style="gap:4px;margin-top:8px"><span class="faint" style="font-size:12px">هل تقصد:</span>${m.r.suggestions.map(sg => `<button type="button" class="btn sm" style="justify-content:flex-start" data-act="qa-sug" data-k="${sg.id}">${esc(sg.question)}</button>`).join('')}</div>` : ''}</div>`;
  const ideas = qaData().entries.filter(e => e.active).slice(0, 4).map(e => e.question);
  return `<section class="card" style="gap:12px"><div class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">ASK NAIOSH · من الإجابات المدرّبة</span><h2 class="h-sec">اسأل نايوش</h2></div>${rdIsAdmin() ? `<button type="button" class="btn sm" data-go="feed">${ic('feed', 15)}تغذية الإجابات</button>` : ''}</div>
    <div class="qa-chat" id="qa-chat">${H.length ? H.map(msg).join('') : `<div class="qa-msg bot">مرحبًا، اسألني عن نايوش والطلبات والنقاط والتقارير.</div>`}</div>
    ${!H.length && ideas.length ? `<div class="row" style="gap:6px">${ideas.map(t => `<button type="button" class="chip" data-act="qa-q" data-k="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
    <form id="qa-ask" class="qa-in" novalidate><input type="text" id="qa-ask-q" placeholder="اكتب سؤالك…" autocomplete="off"><button type="submit" class="btn primary">${ic('ask', 16)}اسأل</button></form></section>`;
}
document.addEventListener('submit', (e) => { if (e.target.id !== 'qa-ask') return; e.preventDefault(); const i = document.getElementById('qa-ask-q'); const q = i ? i.value : ''; qaAsk(q).then(() => { const j = document.getElementById('qa-ask-q'); if (j) j.focus(); }); });
const _qaAskView = VIEWS.ask;
VIEWS.ask = () => qaChatCard() + `<details class="hm-more"><summary>${ic('consult', 18, 'style="color:var(--yellow)"')}<span style="flex:1">عرض الاستشارة التجريبية CNS-001 (السيناريو الموجّه)</span><span class="faint" style="font-size:12px">عرض ▾</span></summary><div>${_qaAskView()}</div></details>`;
const _qaH = analyticsHandle;
analyticsHandle = function (act, k, el) { if (act === 'qa-q') { qaAsk(k); return true; } if (act && (act.startsWith('qa-') || act === 'fd-tab') && qaHandle(act, k)) return true; return _qaH(act, k, el); };
</script>
