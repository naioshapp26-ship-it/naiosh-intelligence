<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>window.NAIOSH_SERVER = true;</script>
<style>html,body{margin:0;background:#0B0B0D}</style>
</head>
<body>
<title>NAIOSH Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-css">
/* Layout: fixed command sidebar (right, RTL) + scrolling workspace; one consultation flows through every screen. Single dark identity by design. */
:root{
  --bg:#0B0B0D; --surface:#121215; --raised:#16161A; --sunk:#0E0E11;
  --line:#23232A; --line2:#2E2E36; --line3:#3A3A42;
  --fg:#F5F5F7; --fg2:#D6D6DC; --soft:#C4C4CC; --muted:#A6A6B0; --faint:#85858F; --ghost:#5E5E68;
  --red:#FF2E4D; --action:#D90F2C; --redsoft:#FF8A9B; --redbg:#1F1216; --redline:#4A1822;
  --yellow:#FFCD11; --yellowbg:#15130A; --yellowline:#3A3312;
  --orange:#FF8A1F; --orangefg:#FFA552; --orangebg:#1A140E; --orangeline:#4A3218;
  --green:#2FD27A; --greenfg:#4BE08F; --greenbg:#0E1812; --greenline:#1D3A28;
  --blue:#4DA3FF; --bluefg:#7ABBFF; --purple:#C79BFF;
  --f-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:12px; --r-l:16px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;background:#0E0E11;border-inline-start:1px solid var(--line);overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:12px;height:68px;padding:0 18px;border-bottom:1px solid var(--line);flex-shrink:0;text-decoration:none;color:var(--fg);background:none;border-top:0;border-inline:0;width:100%;text-align:right}
.brand b{display:block;font-family:var(--f-display);font-size:17px;letter-spacing:2.5px;direction:ltr;text-align:right}
.brand small{display:block;font-family:var(--f-display);font-size:9.5px;letter-spacing:3.2px;color:var(--yellow);direction:ltr;text-align:right}
.nav{flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:12px 10px}
.nav h4{margin:0;padding:0 12px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.3px}
.nav-g{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;min-height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--soft);font-size:13.5px;font-weight:500;text-align:right}
.nav button:hover{background:var(--raised);color:var(--fg)}
.nav button[aria-current="page"]{background:rgba(255,46,77,.12);color:#fff;font-weight:600}
.nav button[aria-current="page"] svg{stroke:var(--red)}
.nav svg{flex-shrink:0;stroke:#8E8E98}
.nav .cnt{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#0B0B0D;font:600 11px/20px var(--f-mono);text-align:center}
.nav .cnt.y{background:var(--yellow)}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.gov-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.gov-pill b{display:block;font-size:12px}
.gov-pill span{color:var(--faint);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 24px;background:rgba(11,11,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .crumb{display:flex;flex-direction:column;min-width:0}
.top .crumb span{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1 1 340px;max-width:460px;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line2)}
.search input{flex-grow:1;min-width:0;background:transparent;border:0;outline:none;font-size:13px}
.search input::placeholder{color:var(--faint)}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.demo-chip{font-size:11px;font-weight:600;color:var(--yellow);border:1px solid rgba(255,205,17,.35);border-radius:999px;padding:4px 10px;white-space:nowrap}
.icon-btn{position:relative;width:40px;height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center}
.icon-btn .dot{position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:4px;background:var(--red)}
.avatar{width:38px;height:38px;border-radius:19px;background:#2A1116;border:1px solid #5A1B26;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--redsoft);flex-shrink:0}
.who{display:flex;flex-direction:column;line-height:1.35}
.who b{font-size:13px}.who span{font-size:11px;color:var(--faint)}
.menu-btn{display:none}
.view{padding:22px 24px 120px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{padding:14px 16px;gap:8px}
.card.warn{background:var(--yellowbg);border-color:var(--yellowline)}
.card.bad{background:var(--redbg);border-color:var(--redline)}
.card.good{background:var(--greenbg);border-color:var(--greenline)}
.card.hot{border-color:#3A1C22}
.sub{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 360px}
.split.wide{grid-template-columns:minmax(0,1fr) 420px}
.split.l{grid-template-columns:420px minmax(0,1fr)}
.h-sec{font-size:15px;font-weight:600}
.lbl{font-size:12px;color:var(--faint)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.soft{color:var(--soft)}
.big{font-family:var(--f-display);font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.title-xl{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.3px}
.title-l{font-family:var(--f-display);font-size:20px;font-weight:600}
.lead{font-size:15px;line-height:1.75;color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.6px;color:var(--faint);direction:ltr;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line3);background:transparent;color:var(--fg2);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#55555E;color:#fff}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff;font-weight:600}
.btn.primary:hover{background:#EC1535}
.btn.primary[aria-disabled="true"]{background:#26262C;border-color:#26262C;color:#6E6E78;cursor:not-allowed}
.btn.y{border-color:var(--yellow);color:var(--yellow);font-weight:600}
.btn.link{border:0;color:var(--yellow);padding:0 8px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line2);color:var(--soft);white-space:nowrap}
button.chip:hover{color:#fff;border-color:var(--line3)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-c{background:rgba(255,46,77,.16);color:#FF6B81}
.t-h{background:rgba(255,138,31,.16);color:var(--orangefg)}
.t-m{background:rgba(255,205,17,.14);color:var(--yellow)}
.t-i{background:rgba(77,163,255,.14);color:var(--bluefg)}
.t-s{background:rgba(47,210,122,.14);color:var(--greenfg)}
.t-n{background:var(--raised);color:var(--soft);border:1px solid var(--line2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;flex-shrink:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-grow:1}
.bar i{display:block;height:100%;border-radius:3px;background:var(--red)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--r-m);background:var(--raised);border:1px solid var(--line);text-align:right;color:var(--fg);min-width:0}
button.kpi:hover{border-color:var(--line3)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.list-btn{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border-radius:var(--r-m);background:var(--raised);border:1px solid var(--line);color:var(--fg);text-align:right;width:100%}
.list-btn:hover{border-color:var(--line3)}
.sel{border-color:var(--red)!important;background:var(--redbg)!important}
.opt{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line2);background:var(--raised);color:var(--fg);font-size:15px;text-align:right;width:100%}
.opt:hover{border-color:var(--line3)}
.opt .rd{width:20px;height:20px;border-radius:10px;border:2px solid #4A4A52;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"]{border-color:var(--red);background:var(--redbg)}
.opt[aria-checked="true"] .rd{border-color:var(--red)}
.opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--red)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{min-height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--raised);border-color:var(--line3);color:#fff}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-m)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--faint);text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1A1A1F;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#141418}
textarea,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=password]{min-height:44px;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;width:100%}
textarea{resize:vertical;line-height:1.7}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea:focus,input:focus{border-color:var(--line3)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.flow span{padding:4px 9px;border-radius:7px;background:var(--raised);border:1px solid var(--line)}
.flow i{font-style:normal;color:var(--ghost)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-m);font-size:13.5px}
.banner.y{background:var(--yellowbg);border:1px solid var(--yellowline)}
.banner.g{background:var(--greenbg);border:1px solid var(--greenline)}
.banner.r{background:var(--redbg);border:1px solid var(--redline)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px;border-radius:var(--r-l);border:1px dashed var(--line3);background:var(--sunk)}
svg.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:10px}

/* ---------- stepper ---------- */
.stepper{display:grid;grid-template-columns:repeat(13,minmax(64px,1fr));padding:12px 14px;margin:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.stepper li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper li::before{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--line2)}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.now::before{background:var(--action)}
.stepper .d{position:relative;width:24px;height:24px;border-radius:12px;border:2px solid #34343C;background:var(--raised);display:flex;align-items:center;justify-content:center;font:600 10.5px var(--f-mono);color:var(--faint)}
.stepper li.done .d{background:var(--action);border-color:var(--action);color:#fff}
.stepper li.now .d{background:var(--bg);border-color:var(--yellow);color:var(--yellow)}
.stepper .l{font-size:11.5px;color:var(--faint);white-space:nowrap}
.stepper li.done .l{color:var(--fg2)}
.stepper li.now .l{color:var(--yellow);font-weight:700}

/* ---------- tour ---------- */
.app.touring .view{padding-bottom:300px}
.tour{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;width:min(380px,calc(100vw - 32px));background:#141418;border:1px solid var(--yellowline);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tour .bar i{background:var(--yellow)}
.tour-min{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,205,17,.0)}50%{box-shadow:0 0 0 6px rgba(255,205,17,.18)}}
.toast{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:#10261A;border:1px solid var(--greenline);color:var(--greenfg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important;animation:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1200px){
  .split,.split.wide,.split.l{grid-template-columns:minmax(0,1fr)}
  .g6{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;right:0;width:272px;transform:translateX(105%);transition:transform .2s ease;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
  .app.open .side{transform:none}
  .menu-btn{display:inline-flex}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .who,.search{display:none}
  #set-grid{grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:620px){
  .view{padding:16px 16px 140px}
  .top{padding:10px 16px}
  .g2,.g3,.g4,.g6{grid-template-columns:minmax(0,1fr)}
  .demo-chip{display:none}
  .card{padding:16px}
  .tour{left:16px;right:16px;width:auto}
}
.nav .dia-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:1px 5px;margin-inline-start:auto;letter-spacing:.04em}
.nav .cnt + .dia-code{margin-inline-start:6px}
.nav button[aria-current="page"] .dia-code{color:var(--red);border-color:var(--redline)}
.back-btn{flex-shrink:0;gap:6px;border-color:var(--line2);background:var(--surface)}
.back-btn:hover{border-color:var(--yellow);color:var(--yellow)}
@media (max-width:640px){.back-btn span{display:none}.back-btn{padding:0 10px}.top .crumb{flex:1 1 0}.top-end{gap:6px}.top-end .avatar,.top-end [data-go="settings"]{display:none}}
/* ---------- responsive refinements ---------- */
#view [style*="repeat(5,minmax(0,1fr))"]{max-width:460px;margin-inline:auto;width:100%}
@media (max-width:1200px){
  .top .who{display:none}
  #view [style*="minmax(0,400px) minmax(0,1fr) minmax(0,320px)"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #view [style*="minmax(0,400px) minmax(0,1fr) minmax(0,320px)"] > :last-child{grid-column:1/-1}
  #view [style*="repeat(3,minmax(0,1fr)) minmax(0,320px)"]{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  #view [style*="repeat(3,minmax(0,1fr)) minmax(0,320px)"] > :last-child{grid-column:1/-1}
}
@media (max-width:980px){
  #view [style*="grid-template-columns"][style*="px)"]:not([style*="auto-fill"]):not([style*="auto-fit"]){grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:620px){
  #view [style*="minmax(0,1.3fr) repeat(3"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #view [style*="minmax(0,1.3fr) repeat(3"] > :first-child{grid-column:1/-1}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-wrap > table{min-width:600px}
  .ask-top .ask-lbl{display:none}
  .tour-min .tour-lbl{display:none}
  .tour-min{width:44px;height:44px;padding:0;justify-content:center;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .row.nowrap.orch-row{flex-wrap:wrap;row-gap:4px}
  .orch-row b{width:auto!important;flex:1 1 auto}
  .orch-row .orch-d{flex-basis:100%;padding-inline-start:38px}
  .ask-top{padding:0 10px}
  .top .crumb span{display:none}
}
@media (max-width:768px), (pointer:coarse){
  button.chip{min-height:36px}
  #view .btn.sm{min-height:38px}
  #view .hrow{min-height:36px}
}
</style>

<script type="application/json" id="naiosh-config">{}</script>
<script data-app="">
/* ================= configuration (editable from Settings) ================= */
const CFG_DEFAULT = {
  identity: { brandAr: 'نايوش', brandEn: 'NAIOSH', brandSub: 'INTELLIGENCE', user: 'د. عدنان', userInitial: 'ع', role: 'صاحب قرار · الإدارة العليا', branch: 'الفرع الشمالي', greeting: 'مساء الخير', demoBadge: true, tourDefault: true },
  theme: { red: '#FF2E4D', action: '#D90F2C', yellow: '#FFCD11' },
  modules: {},
  command: [
    { label: 'مخاطر حرجة', value: '3', color: 'r', route: 'risks', auto: '' },
    { label: 'قرارات بانتظار اعتمادك', value: '5', color: 'o', route: 'decision', auto: 'decisions' },
    { label: 'مشكلات جودة بيانات', value: '7', color: 'y', route: 'data', auto: '' },
    { label: 'فرص مكتشفة', value: '12', color: 'g', route: 'risks', auto: '' }
  ],
  health: [

/* ================= QUESTIONNAIRE ================= */
function QS() {
  return CFG.questions.map((q, i) => {

    const lines = (x) => (Array.isArray(x) ? x : String(x || '').split('\n')).map(t => String(t).trim()).filter(Boolean);
    if (q.branchWhen && q.branchText && prev === q.branchWhen) return { id, text: q.branchText, o: lines(q.branchOptions).length ? lines(q.branchOptions) : lines(q.options), why: q.branchWhy || q.why, gap: q.gap, gain: +q.gain || 0, adaptive: true };
    return { id, text: q.text, o: lines(q.options), why: q.why, gap: q.gap, gain: +q.gain || 0, adaptive: false };
  }).filter(q => q.o.length);
}

<script data-app="">
/* ================= shared solution data ================= */
const SOLS_FN = () => CFG.solutions.map((x, i) => {
  const v = (Array.isArray(x.v) ? x.v : String(x.v || '').split(/[,،\s]+/)).map(Number).filter(n => !isNaN(n));
  while (v.length < 6) v.push(0);
  const tasks = (Array.isArray(x.tasks) ? x.tasks : String(x.tasks || '').split('\n')).filter(Boolean);
  while (tasks.length < 3) tasks.push('إجراء تنفيذي');
  return { ...x, n: i + 1, v: v.slice(0, 6), tasks, score: +x.score || 0, conf: +x.conf || 0, exp: +x.exp || 64, act: +x.act || 64, short: x.short || x.name };
});
let SOLS = [];
const solSel = () => { SOLS = SOLS_FN(); return SOLS.find(s => s.n === S.sol) || SOLS[0] || { n: 1, name: '—', short: '—', v: [0,0,0,0,0,0], score: 0, conf: 0, exp: 64, act: 64, tasks: ['—','—','—'], note: '' }; };
function impactOf() { const s = solSel(); const d = s.exp - 64; return { exp: s.exp, act: s.act, ratio: d ? Math.round(((s.act - 64) / d) * 100) : 100 }; }

  const opps = [['نقل ممارسات الفرع الجنوبي الأعلى أداءً','86','الفرع الجنوبي تعافى من نمط مماثل في 2025. نقل برنامجه التدريبي ونظام المتابعة.','عالية','الآن','R-01'],['أتمتة جدولة المناوبات','78','توزيع أعدل للمهام يخفّض العمل الإضافي ويحمي الموظفين الرئيسيين.','متوسطة','60 يومًا','R-01'],['برنامج إرشاد من الموظفين القدامى','74','يحوّل المعرفة المهددة بالضياع إلى أصل مؤسسي موثّق.','عالية','30 يومًا','R-03']];

        <div dir="ltr" style="flex-grow:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">${cells}</div></div>
      <span class="muted" style="align-self:center;font-size:11.5px">الاحتمال ←</span>

    </div>
    <div class="card">
      <div class="row between" style="align-items:flex-start"><div class="stack" style="gap:3px"><span class="mono faint" style="font-size:11.5px">${r.id} · ${r.cat}</span><h2 class="title-l">${r.name}</h2></div><span class="tag ${LV[r.lv][1]}" style="font-size:12px;padding:5px 12px">${LV[r.lv][0]}</span></div>
      <div class="grid g4" style="gap:8px">${[['الاحتمال × الأثر',r.p + ' × ' + r.i],['السرعة',r.vel],['القرب الزمني',r.prox],['الاتجاه',r.tr]].map(([l, v]) => `<div class="sub" style="padding:10px 12px"><span class="lbl">${l}</span><b class="big" style="font-size:17px">${v}</b></div>`).join('')}</div>

        </div>

      </div>
      <div class="grid g2" style="gap:10px"><div class="sub" style="background:transparent"><span class="lbl">السلسلة السببية</span><span style="font-size:12.5px;line-height:1.65">${r.chain}</span></div><div class="sub" style="background:transparent"><span class="lbl">مؤشر الإنذار المبكر</span><span style="font-size:12.5px;line-height:1.65">${r.kri}</span></div></div>

};

/* ================= SOLUTIONS ================= */
VIEWS.solutions = () => {
  solSel();
  const labels = ['الأثر المتوقع','كفاءة التكلفة','انخفاض المخاطر','قابلية التنفيذ','سرعة التنفيذ','الاستدامة'];

  <section class="card tight" style="flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px">
    <span class="lbl">الهدف</span><b style="font-size:13px">${esc(S.ans.q6 || 'استعادة مستوى الأداء السابق')} خلال 90 يومًا</b>
    <span style="width:1px;height:22px;background:var(--line2)"></span><span class="lbl">القيود</span>

  </section>

    return `<div class="card" style="border:1.5px solid ${on ? 'var(--red)' : 'var(--line)'};background:${on ? '#16161B' : 'var(--surface)'}">
      <div class="row between"><span class="mono faint" style="font-size:11px">SOLUTION #${s.n}</span>${s.rec ? '<span class="tag" style="background:var(--yellow);color:#0B0B0D">الموصى به · حدّ باريتو</span>' : s.conf < 65 ? '<span class="tag t-h">ثقة منخفضة</span>' : ''}</div>
      <h3 class="title-l" style="font-size:18px">${s.name}</h3>
      <div class="grid g2" style="gap:8px"><div class="sub" style="background:var(--sunk);padding:9px 12px"><span class="lbl" style="color:var(--muted)">Score — الملاءمة</span><b class="big" style="font-size:24px">${s.score}</b></div><div class="sub" style="background:var(--sunk);padding:9px 12px"><span class="lbl" style="color:var(--muted)">Confidence — الثقة</span><b class="big" style="font-size:24px;color:${confColor(s.conf)}">${s.conf}%</b></div></div>
      <div class="stack" style="gap:6px">${s.v.map((v, i) => `<div class="row nowrap" style="font-size:12px"><span class="soft" style="width:96px">${labels[i]}</span><span class="bar"><i style="width:${v}%;background:${on ? 'var(--red)' : '#6E6E78'}"></i></span><span class="mono" style="width:26px;text-align:left">${v}</span></div>`).join('')}</div>

      <div class="row nowrap" style="margin-top:auto"><button type="button" class="btn sm" style="flex:1" data-act="sol-focus" data-k="${s.n}" aria-pressed="${on}">${on ? 'محدد' : 'تحديد'}</button><button type="button" class="btn sm ${s.rec ? 'primary' : ''}" style="flex:1" data-act="sol-choose" data-k="${s.n}">رفع للقرار</button></div>

  <section class="card" style="padding:0;gap:0"><div class="tbl-wrap"><table><thead><tr><th>مقارنة البدائل</th>${SOLS.map(s => `<th style="color:${s.n === S.sol ? '#fff' : 'var(--faint)'}">#${s.n} ${s.short}</th>`).join('')}</tr></thead><tbody>

    <tr><td class="soft">زمن ظهور الأثر</td>${SOLS.map(x => `<td style="color:${x.n === S.sol ? '#fff' : 'var(--muted)'}">${esc(x.time || '—')}</td>`).join('')}</tr>

};

/* ================= DECISION ================= */
VIEWS.decision = () => {
  const s = solSel(), ok = !!S.choice && S.why.trim().length > 3;
  const gate = [['السياق','لا ذاكرة بلا سياق',1],['المصدر','لا معرفة بلا مصدر وأصل',1],['الدليل','لا علاقة بلا دليل',S.qDone ? 1 : 2],['المبرر','لا قرار بلا مبرر',S.decided ? 1 : 3],['الملاحظات','لا نمط بلا ملاحظات متكررة',1],['التتبع','لا ذكاء بلا قابلية للتتبع',1],['جودة البيانات','87% — تمرير مع تنبيه',2],['الصلاحيات','تم التحقق من نطاق الوصول',1]];
  const GI = { 1: ['check','var(--green)'], 2: ['warn','var(--yellow)'], 3: ['dotc','var(--faint)'] };

    <div class="stack" style="gap:4px"><span class="mono" style="color:var(--yellow);font-size:12px">DEC-2026-041</span><h2 class="title-l">تم تسجيل القرار: ${choiceLabel()}</h2></div>
    <dl class="kv sub" style="margin:0;font-size:12.5px"><dt>صاحب القرار</dt><dd>د. عدنان</dd><dt>الحل</dt><dd>${s.name}</dd><dt>سجل التدقيق</dt><dd style="color:var(--green)">محفوظ</dd><dt>المبرر</dt><dd style="line-height:1.6">${esc(S.why)}</dd></dl>
    <p class="soft" style="font-size:12.5px;line-height:1.7">حُفظ القرار في ذاكرة القرار مع البدائل والأدلة والنتيجة المتوقعة (${s.exp})، وسيُقارن لاحقًا بالنتيجة الفعلية.</p>
    ${approved() ? `<button type="button" class="btn primary block" data-go="execution">فتح خطة التنفيذ</button>` : `<div class="banner y" style="font-size:12.5px">القرار «${choiceLabel()}» لا يولّد خطة تنفيذ. أُعيدت الاستشارة إلى الفريق مع مبررك.</div>`}
    <button type="button" class="btn sm block" data-act="d-undo">تعديل القرار</button>` : `
    <div class="stack" style="gap:3px"><span class="lbl">مراجعة صاحب القرار — الذكاء الاصطناعي لا يقرر وحده</span><h2 class="title-l">قرارك</h2></div>
    <dl class="kv sub" style="margin:0;font-size:12px"><dt>مستوى القرار</dt><dd>D3 — تكتيكي</dd><dt>الصلاحية المطلوبة</dt><dd>مدير القطاع أو أعلى</dd><dt>صلاحيتك</dt><dd style="color:var(--green)">مطابقة</dd></dl>
    <fieldset style="margin:0;padding:0;border:0" class="stack"><legend style="font-size:12.5px;font-weight:600;padding-bottom:6px">اختر القرار</legend>
      <div class="stack" style="gap:6px" role="radiogroup">${CHOICES.map(([k, l]) => `<button type="button" class="opt" role="radio" aria-checked="${S.choice === k}" data-act="d-pick" data-k="${k}" style="min-height:44px;font-size:14px"><span class="rd"></span>${l}</button>`).join('')}</div></fieldset>
    <label for="why" style="font-size:12.5px;font-weight:600">مبرر القرار <span style="font-weight:400;color:var(--yellow)">— مطلوب: لا قرار بلا مبرر</span></label>
    <textarea id="why" data-model="why" rows="3" placeholder="لماذا اتخذت هذا القرار؟ سيُحفظ في ذاكرة القرار المؤسسية.">${esc(S.why)}</textarea>
    <button type="button" id="d-submit" class="btn primary block" data-act="d-submit" aria-disabled="${!ok}">تسجيل القرار</button>`;
  return `${stepper(S.decided ? 10 : 9)}
  ${S.qDone ? '' : `<div class="banner y">${ic('warn', 18, 'style="color:var(--yellow)"')}<span style="flex:1 1 260px">التوصية مبنية على تحليل أولي بثقة 58%. يمكنك القرار الآن، لكن الأفضل استكمال البيانات أولًا.</span><button type="button" class="btn sm" data-go="questionnaire">استكمال البيانات</button></div>`}
  <div class="split">

      <section class="card">

          <div class="row"><span class="chip">Score <b class="big">${s.score}</b></span><span class="chip" style="background:var(--greenbg);border-color:var(--greenline);color:var(--greenfg)">الثقة <b class="big">${S.qDone ? s.conf : s.conf - 14}%</b></span></div></div>
        <div class="sub" style="background:var(--redbg);border-color:var(--redline)"><span style="font-size:11.5px;color:var(--redsoft)">الحل المرفوع للقرار ${s.rec ? '(الموصى به)' : ''}</span><b style="font-family:var(--f-display);font-size:17px">${s.name}</b>

        <div class="grid g3" style="gap:12px">${[['المشكلة','انخفاض أداء الفرع الشمالي 17% خلال 6 أسابيع.'],['الاستنتاج','أسباب محتملة: نقص التدريب (71%) وضغط العمل (58%) بعد موجة مغادرة.'],['لماذا هذا الحل؟',s.note],['المخاطر','مقاومة داخلية للتغيير · ضغط مؤقت على المشرفين.'],['المتطلبات','مالك تنفيذ من القطاع · 3 إلى 6 أسابيع.'],['حدود التوصية','بيانات الشكاوى من إفادة صاحب الاستشارة فقط (L2).']].map(([l, d]) => `<div class="stack" style="gap:4px"><span class="lbl">${l}</span><span style="font-size:13px;line-height:1.6">${d}</span></div>`).join('')}</div>

          ${[['قوة الأدلة',86],['البيانات',S.qDone ? 78 : 58],['الحالات التاريخية',91],['ثقة النموذج',79]].map(([l, v]) => `<div class="stack" style="gap:5px"><div class="row between" style="font-size:12.5px"><span>${l}</span><span class="mono" style="color:var(--yellow)">${v}%</span></div><span class="bar" style="height:7px"><i style="width:${v}%;background:var(--yellow)"></i></span></div>`).join('')}

        </section>

          ${gate.map(([n, r, k]) => `<div class="row nowrap" style="font-size:12.5px">${ic(GI[k][0], 15, `style="color:${GI[k][1]};stroke-width:2.6"`)}<b style="width:88px;flex-shrink:0">${n}</b><span class="muted" style="font-size:12px">${r}</span></div>`).join('')}
          <div class="row nowrap" style="margin-top:auto;padding:9px 12px;border-radius:10px;background:var(--greenbg);border:1px solid var(--greenline)"><span class="mono" style="font-size:11.5px;font-weight:600;color:var(--greenfg)">${S.qDone ? 'L4 · VERIFIED' : 'L3 · EVIDENCED'}</span><span style="font-size:12px;color:#B5C9BC">${S.decided ? 'اكتمل: القرار مسجّل بمبرره' : 'مؤهلة للعرض على صاحب القرار'}</span></div>
        </section>
      </div>
    </div>
    <aside class="card" style="border-color:#3A1C22">${panel}</aside>
  </div>`;
};

/* ================= EXECUTION ================= */
VIEWS.execution = () => {
  if (!approved()) return `${stepper(9)}<div class="empty"><span class="eyebrow">NO ACTION PLAN YET</span><h2 class="title-l">لا توجد خطة تنفيذ بعد</h2><p class="lead">خطة التنفيذ تُولَّد تلقائيًا من القرار المعتمد: الإجراءات، والمالكون، والمواعيد، والمؤشرات. ${S.decided ? `القرار المسجّل «${choiceLabel()}» لا يولّد خطة.` : 'لم يُسجَّل قرار لهذه الاستشارة.'}</p><button type="button" class="btn primary" data-go="decision">الذهاب إلى مركز القرار</button></div>`;
  const s = solSel(), m = S.measured;
  const A = { man: ['يدوي','var(--muted)'], ai: ['بمساعدة الذكاء','var(--bluefg)'], auto: ['مؤتمت بموافقة','var(--yellow)'] };
  const tasks = [
    ['T-01','done','اعتماد القرار DEC-2026-041','د. عدنان','اليوم','man',0],
    ['T-02','done','تعيين مالك التنفيذ وفريق المتابعة','مدير القطاع','اليوم','man',0],
    ['T-08','done','ربط مؤشر الأداء بمتابعة أسبوعية','نايوش','اليوم','auto',0],
    ['T-03',m ? 'done' : 'doing',s.tasks[0],'مدير الفرع','بعد 10 أيام','auto',60],
    ['T-04',m ? 'done' : 'doing',s.tasks[1],'الموارد البشرية','بعد 5 أيام','man',40,!m],
    ['T-05',m ? 'done' : 'doing',s.tasks[2],'التدريب','بعد 19 يومًا','ai',30],
    ['T-06',m ? 'doing' : 'todo','توثيق معرفة الموظفين الرئيسيين الثلاثة','م. ليلى','بعد 16 يومًا','ai',m ? 70 : 0],
    ['T-07','todo','تفعيل برنامج إرشاد داخلي','أ. خالد','بعد 23 يومًا','man',0]
  ];
  const cols = [['todo','قيد الانتظار','var(--faint)'],['doing','قيد التنفيذ','var(--yellow)'],['done','مكتمل','var(--green)']];
  const prog = m ? 81 : 38;

   Sign-in, shared settings, per-user progress, real uploads, decision ledger and audit trail. */

async function api(method, url, body) {
  const opt = { method, headers: { 'X-Naiosh': '1' }, credentials: 'same-origin' };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(url, opt); } catch (e) { const err = new Error('تعذّر الاتصال بالخادم — تحقق من الإنترنت.'); err.status = 0; throw err; }
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && ME) { location.reload(); }
    const err = new Error((data && data.message) || 'حدث خطأ (' + res.status + ')'); err.status = res.status; err.code = data && data.error; err.errors = data && data.errors; throw err;
  }
  return data;
}

function uploadOne(file, kind, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', '/api/uploads');
    x.setRequestHeader('X-Naiosh', '1');
    x.setRequestHeader('X-Upload-Kind', kind);
    x.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
    x.onload = () => {
      let d = null; try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300) resolve(d); else reject(new Error((d && d.message) || ('تعذّر رفع ' + file.name)));
    };
    x.onerror = () => reject(new Error('انقطع الاتصال أثناء رفع ' + file.name));
    x.send(file);
  });
}

  </section>`;
}

/* ---------- actions ---------- */
async function serverHandle(act, k) {
  switch (act) {
    case 'sv-filter': SV.filter = k; render(); return true;
    case 'sv-open': {
      SV.inboxSel = +k; render();
      try { const d = await api('GET', '/api/requests/' + k); SV.detail[+k] = d.request; } catch (e) { toast(e.message); }
      render(); const g = document.getElementById('sv-inbox-grid'); if (g && innerWidth < 900) g.lastElementChild.scrollIntoView({ block: 'start' });
      return true;
    }
    case 'sv-toggle': {
      const u = SV.users.find(x => x.id === +k); if (!u) return true;
      try { await api('PATCH', '/api/users/' + k, { active: !u.active }); toast(u.active ? 'أُوقف الحساب وانتهت جلساته' : 'فُعّل الحساب'); await svLoadUsers(); } catch (e) { toast(e.message); }
      return true;
    }
    case 'sv-reset': {
      const u = SV.users.find(x => x.id === +k); if (!u) return true;
      const pw = prompt('كلمة مرور مؤقتة جديدة لـ ' + u.name + ' (10 أحرف على الأقل، حروف وأرقام):', svTempPass());
      if (!pw) return true;
      try { await api('PATCH', '/api/users/' + k, { password: pw }); toast('عُيّنت كلمة المرور — سيُطلب تغييرها عند الدخول'); await svLoadUsers(); } catch (e) { toast(e.message); }
      return true;
    }
    case 'sv-logout': svLogout(); return true;
  }
  return false;
}
async function svLogout() { try { await api('POST', '/api/auth/logout'); } catch (e) {} location.href = '/'; }
async function svLoadUsers() { try { const d = await api('GET', '/api/users'); SV.users = d.users; ROLE_LABELS = d.roles; } catch (e) { toast(e.message); } if (S.route === 'users') render(); }

document.addEventListener('click', (e) => { if (e.target.closest('[data-sv-logout]')) svLogout(); });
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.svRole) {
    try { await api('PATCH', '/api/users/' + el.dataset.svRole, { role: el.value }); toast('حُدّث الدور'); } catch (err) { toast(err.message); }
    svLoadUsers();
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target; if (!f.id || !f.id.startsWith('sv-')) return;
  e.preventDefault();
  const v = (id) => (document.getElementById(id) || {}).value || '';
  const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'sv-login-form') {
      const err = document.getElementById('sv-login-err');
      if (!v('sv-email') || !v('sv-pass')) { err.textContent = 'أدخل البريد الإلكتروني وكلمة المرور.'; return; }
      try { await api('POST', '/api/auth/login', { email: v('sv-email'), password: v('sv-pass') }); location.reload(); }
      catch (x) { err.textContent = x.message; document.getElementById('sv-pass').select(); }
    }
    if (f.id === 'sv-force-form') {
      const err = document.getElementById('sv-force-err');
      if (v('sv-new') !== v('sv-new2')) { err.textContent = 'كلمتا المرور الجديدتان غير متطابقتين.'; return; }
      try { await api('POST', '/api/auth/password', { current: v('sv-cur'), next: v('sv-new') }); location.reload(); } catch (x) { err.textContent = x.message; }
    }
    if (f.id === 'sv-pass-form') {
      const err = document.getElementById('sv-p-err');
      try { await api('POST', '/api/auth/password', { current: v('sv-p-cur'), next: v('sv-p-new') }); toast('تم تغيير كلمة المرور'); f.reset(); err.textContent = ''; } catch (x) { err.textContent = x.message; }
    }
    if (f.id === 'sv-user-form') {
      const err = document.getElementById('sv-u-err');
      try {
        await api('POST', '/api/users', { name: v('sv-u-name'), email: v('sv-u-email'), role: v('sv-u-role'), password: v('sv-u-pass') });
        toast('أُضيف المستخدم'); await svLoadUsers();
      } catch (x) { err.textContent = x.errors ? Object.values(x.errors).join(' ') : x.message; }
    }
    if (f.id === 'sv-status-form') {

      try {
        await api('PATCH', '/api/requests/' + id, { status: v('sv-status'), note: v('sv-note') });

        const d = await api('GET', '/api/requests/' + id); SV.detail[id] = d.request; render();
      } catch (x) { toast(x.message); }

});

/* ---------- request submission with real uploads ---------- */
function svProgress(pct, label) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast" role="status" style="min-width:280px"><div style="margin-bottom:8px">${esc(label)}</div><div style="height:6px;border-radius:3px;background:#2A2A31;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--yellow);transition:width .2s"></div></div></div>`;
}
async function serverSubmitRequest(r, c, dom) {
  if (SV.busy) return; SV.busy = true;
  const items = [...(r.files || []).map(f => ({ f, kind: 'file' })), ...(r.videos || []).map(f => ({ f, kind: 'video' }))];
  const missing = items.filter(x => !RQ_FILE_OBJ[x.f.key]);
  if (missing.length) { SV.busy = false; RQ_ERR.videos = 'أعد إرفاق: ' + missing.map(x => x.f.n).join('، ') + ' (أُغلقت الصفحة بعد اختيارها).'; render(); return; }
  const total = items.reduce((a, x) => a + RQ_FILE_OBJ[x.f.key].size, 0) || 1;
  let doneBytes = 0; const ids = [];
  try {
    for (const x of items) {
      const file = RQ_FILE_OBJ[x.f.key];
      const res = await uploadOne(file, x.kind, (loaded) => svProgress(Math.round((doneBytes + loaded) / total * 100), 'جارٍ رفع المرفقات… ' + x.f.n));
      doneBytes += file.size; ids.push(res.id);
    }
    svProgress(100, 'جارٍ إرسال الطلب…');
    const { files, videos, ...payload } = r;
    const summary = { typesLabel: c.sel.map(t => t.label).join(' + '), domainLabel: dom ? dom[0] + ' ' + dom[1] : '', suff: c.suff, missing: c.missing.slice(0, 3).join('، ') || '—', output: r.outputs[0] || 'تقرير تحليلي' };
    const d = await api('POST', '/api/requests', { payload, summary, uploads: ids });
    const ref = d.request.ref;
    S.requests = [mapReq(d.request), ...(S.requests || []).filter(q => q.ref !== ref)];
    S.audit.unshift({ t: nowTime(), who: 'المنسّق', what: `أنشأ عقد بيانات لـ ${ref} — الكفاية ${c.suff}%`, kind: 'sys' }, { t: nowTime(), who: ME.name, what: `أرسل طلب تحليل بيانات ${ref}: ${r.title.trim()}`, kind: 'user' });
    S.audit = S.audit.slice(0, 300);
    S.reqDone = ref; S.req = freshReq();
    Object.keys(RQ_FILE_OBJ).forEach(k => delete RQ_FILE_OBJ[k]);
    Object.keys(RQ_VIDEO_URLS).forEach(k => { try { URL.revokeObjectURL(RQ_VIDEO_URLS[k]); } catch (e) {} delete RQ_VIDEO_URLS[k]; });
    toast('أُرسل الطلب ' + ref + (ids.length ? ' مع ' + ids.length + ' مرفق' : ''));
    render(); window.scrollTo(0, 0);
    refreshRequests();
  } catch (e) {
    if (e.errors) { RQ_ERR = { ...e.errors }; render(); }
    toast(e.message || 'تعذّر إرسال الطلب');
  } finally { SV.busy = false; }
}

/* ---------- boot ---------- */
async function serverBoot() {
  const app = document.getElementById('app'); app.style.visibility = 'hidden';
  let me;
  try { me = await api('GET', '/api/auth/me'); }
  catch (e) { if (e.status === 401) { await showLogin(); return; } gate(`<div class="card sv-gate-card"><h1 class="title-xl" style="font-size:20px">تعذّر الاتصال بالخادم</h1><p class="muted">${esc(e.message)}</p><button type="button" class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>`); return; }
  ME = me.user; ROLE_LABELS = me.roles || {};
  if (ME.mustChange) { showForcedPassword(); return; }

  try { const c = await api('GET', '/api/config'); CFG = mergeCfg(CFG_DEFAULT, c.cfg || {}); } catch (e) {}
  CFG_DIRTY = false; try { localStorage.removeItem('naiosh-cfg-draft'); } catch (e) {}
  try {
    const st = await api('GET', '/api/state');
    S = Object.assign(freshState(), st.state || {}, { menu: false });
    if (!st.state) S.tour.on = CFG.identity.tourDefault !== false;
    if (S.askStage === 1) S.askShown = ASK_STEPS.length;
  } catch (e) { S = freshState(); }
  if (S.req) { S.req.files = []; S.req.videos = []; }
  await Promise.all([refreshRequests(), svCan('audit.view') ? refreshAudit() : Promise.resolve()]);

  CAN_EDIT = svCan('config.edit'); READONLY = !CAN_EDIT;
  installServerOverrides();
  closeGate(); app.style.visibility = '';
  render();
}

function installServerOverrides() {
  // navigation entries for server features
  const last = NAV[NAV.length - 1];
  if (svCan('requests.viewAll')) last.items.splice(0, 0, ['inbox', 'صندوق طلبات التحليل', '']);
  if (svCan('users.manage')) last.items.splice(svCan('requests.viewAll') ? 1 : 0, 0, ['users', 'المستخدمون والصلاحيات', '']);
  Object.assign(TITLES, { inbox: ['DAR · كل الطلبات ومرفقاتها', 'صندوق طلبات التحليل'], users: ['الأدوار · الصلاحيات · الحسابات', 'المستخدمون والصلاحيات'], account: ['الحساب والأمان', 'حسابي'] });
  Object.assign(P, { inbox: 'M3 13l3-8h12l3 8v6H3z M3 13h5l1.5 2.5h5L16 13h5', users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1 M16 3.5a4 4 0 0 1 0 7.5 M22 21v-1a6 6 0 0 0-4-5.6', account: 'M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z M4 21a8 8 0 0 1 16 0' });
  VIEWS.inbox = svInboxView; VIEWS.users = svUsersView; VIEWS.account = svAccountView;

  // the signed-in user replaces the demo persona everywhere on screen
  const _brandify = brandify;
  brandify = function (h) {
    const I = CFG.identity, su = I.user, sr = I.role, si = I.userInitial;
    I.user = ME.name; I.role = ME.roleLabel;
    try { return _brandify(h); } finally { I.user = su; I.role = sr; I.userInitial = si; }
  };
  const _renderTop = renderTop;
  renderTop = function () {
    _renderTop();
    const who = document.querySelector('#top .who'), av = document.querySelector('#top .avatar');
    if (who) who.outerHTML = `<button type="button" class="who sv-who" data-go="account" title="حسابي"><b>${esc(ME.name)}</b><span>${esc(ME.roleLabel)}</span></button>`;
    if (av) av.textContent = (ME.name.replace(/^د\.\s*/, '').trim()[0] || '؟');
  };

  // per-user progress is saved on the server
  let saveTimer = null;
  save = function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { const { menu, audit, ...keep } = S; api('PUT', '/api/state', { state: keep }).catch(() => {}); }, 1200);
  };
  window.addEventListener('beforeunload', () => {
    if (!saveTimer) return; const { menu, audit, ...keep } = S;
    try { fetch('/api/state', { method: 'PUT', keepalive: true, headers: { 'X-Naiosh': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ state: keep }) }); } catch (e) {}
  });

  // every event goes to the tamper-evident audit trail
  let remoteLog = true;
  const _log = log;
  log = function (who, what, kind = 'user') {
    _log(kind === 'user' ? ME.name : who, what, kind);
    if (remoteLog) api('POST', '/api/audit', { who, what, kind }).catch(() => {});
  };

  // settings are published to everyone through the API
  publishCfg = async function () {
    if (!CAN_EDIT) { toast('نشر الإعدادات لمدير النظام فقط.'); return; }
    PUBLISHING = true; render();
    try { await api('PUT', '/api/config', { cfg: CFG }); CFG_DIRTY = false; clearDraft(); toast('نُشرت الإعدادات — يراها الآن كل المستخدمين'); }
    catch (e) { toast(e.message); }
    PUBLISHING = false; render();
  };
  detectEditor = async function () {};

  const _go = go;
  go = function (r) {
    _go(r);
    if (r === 'inbox') refreshRequests().then(() => { if (S.route === 'inbox') render(); });
    if (r === 'users') svLoadUsers();
    if (r === 'governance' || r === 'consult' || r === 'request') {
      Promise.all([r === 'governance' ? refreshAudit() : null, r !== 'governance' ? refreshRequests() : null]).then(() => { if (S.route === r) render(); });
    }
  };

  const _handle = handle;
  handle = function (act, k, el) {
    if (act && act.startsWith('sv-')) { serverHandle(act, k, el); return; }
    if (act === 'd-submit') {
      if (!svCan('decisions.create')) { toast('اعتماد القرار يتطلب صلاحية «صاحب قرار» — لا قرار بلا صلاحية.'); return; }
      const was = S.decided; remoteLog = false;
      try { _handle(act, k, el); } finally { remoteLog = true; }
      if (!was && S.decided) {
        api('POST', '/api/decisions', { consultation: 'CNS-001', choice: S.choice, choiceLabel: choiceLabel(), solution: solSel().name, rationale: S.why })
          .then(d => { S.lastDecisionRef = d.ref; toast('سُجّل القرار ' + d.ref + ' في سجل القرارات'); save(); })
          .catch(e => { S.decided = false; render(); toast('لم يُسجّل القرار: ' + e.message); });
      }
      return;
    }
    if (act === 'gov-tab' && k === 'audit') { _handle(act, k, el); refreshAudit().then(() => { if (S.route === 'governance') render(); }); return; }
    if (act === 'tour-reset') { const keepReq = S.requests; _handle(act, k, el); S.requests = keepReq; render(); return; }
    return _handle(act, k, el);
  };

  // audit integrity check on the governance → audit tab
  const _gov = VIEWS.governance;
  VIEWS.governance = function () {
    let h = _gov();
    if (S.govTab === 'audit') {
      h += `<div class="card row between" style="gap:10px"><div class="stack" style="gap:2px"><b>السجل محفوظ على الخادم ومحمي بسلسلة تجزئة (SHA-256)</b><span class="faint" style="font-size:12px">${SV.auditScope === 'own' ? 'تعرض أحداثك فقط — العرض الكامل للحوكمة والتدقيق والإدارة.' : 'أي تعديل على قاعدة البيانات يكسر السلسلة ويظهر هنا.'}</span></div>${svCan('audit.verify') ? '<button type="button" class="btn sm" id="sv-verify">تحقق من سلامة السجل</button>' : ''}</div>`;
    }
    return h;
  };
  document.addEventListener('click', async (e) => {
    if (!e.target.closest('#sv-verify')) return;
    try { const d = await api('GET', '/api/audit/verify'); toast(d.ok ? `السجل سليم — ${d.count} حدث دون أي تعديل` : `تحذير: انكسار في السلسلة عند الحدث ${d.brokenAt}`); refreshAudit().then(render); } catch (x) { toast(x.message); }
  });
}

  if (S.archTab === 'biz') body = `<div class="card"><h2 class="h-sec">شرائح التسعير (5.6.3) — القيمة والتكلفة والإتاحة</h2><div class="grid g3">${[['L0','FREE','أقصى وصول: معرفة عامة، أدوات أساسية، محتوى توعوي.'],['L1','SUPPORTED','تكلفة فعلية بسعر مخفّض عبر الدعم والتمويل التبادلي.'],['L2','AFFORDABLE','خدمات أساسية مدفوعة بأسعار منخفضة ومستدامة.'],['L3','PROFESSIONAL','تدريب، استشارات، ذكاء مهني، تقارير متقدمة — السعر حسب القيمة.'],['L4','ENTERPRISE','متعدد المستخدمين والفروع، صلاحيات، تكاملات، وكلاء ذكاء، SLA.'],['L5','STRATEGIC','تحول مؤسسي ومنصات مخصصة ومشاريع كبرى — نموذج تسعير استراتيجي.']].map(([c, e, d]) => `<div class="sub"><span class="mono" style="color:var(--yellow);font-size:12px">${c} · ${e}</span><span style="font-size:12.5px;line-height:1.65">${d}</span></div>`).join('')}</div></div>
    <div class="grid g2"><div class="card tight"><b style="font-size:13.5px">محرك السوق والنمو (5.7) — 16 وكيلًا</b><div class="row" style="gap:6px">${['ذكاء السوق','ذكاء القطاع','ذكاء العملاء','اكتشاف العملاء المحتملين','تأهيلهم','ذكاء الحملات','مطابقة الحلول','ذكاء المبيعات','ذكاء الشركاء','الإحالات','العروض','ذكاء العقود','ذكاء التسليم','نجاح العملاء','التجديد','ذكاء النمو'].map(x => `<span class="chip" style="font-size:11.5px">${x}</span>`).join('')}</div></div>
      <div class="card tight"><b style="font-size:13.5px">NAIOSH HUB 360 (5.6) — طبقة التشغيل</b><span class="soft" style="font-size:12.5px;line-height:1.7">هدف المستخدم ← إجراء موجّه ← معاملة ← سير عمل ← نتيجة ← أفضل إجراء تالٍ. معرّف مركزي لكل عنصر (APP · MOD · SCR · FRM · TRX · WFL · KNO · MEM · INT)، 17 دورًا قابلًا للتخصيص، و8 مستويات نطاق للصلاحيات من الشامل حتى السجل الواحد.</span></div></div>`;
  if (S.archTab === 'docs') { const docs = [['المتطلبات التأسيسية','الرؤية، 13 سؤالًا، المحركات، المراحل'],['نظام ذكاء البيانات والقرار','المحركات الثمانية وبطاقة القرار والإنذار المبكر'],['الوثيقة 2','قاعدة البيانات والعلاقات والواجهات البرمجية'],['الوثيقة 3','مواصفة الواجهات وتجربة المستخدم'],['الوثيقة التنفيذية لتحليل البيانات','طبقات التكامل والحوكمة والمحركات'],['الوثيقة 4','معمارية الذكاء و RAG'],['4.1 → 4.18','الطبقات المعمارية الثماني عشرة'],['5.0','معمارية الإعدادات الرئيسية والوراثة'],['5.1 → 5.10','إعدادات الطبقات'],['5.4.18 / 5.4.19','القاعدة الذهبية والحوكمة الموروثة'],['5.6 · 5.6.1–5.6.3','HUB 360، القيمة والتكلفة، التسعير'],['5.7','محرك السوق والنمو'],['خارطة التوسع','5.1 → 5.18'],['الفهرس العقلي','12 عائلة ومصادر المعرفة'],['الطبقة التشغيلية A–Z','مصطلحات بوابة نايوش 360'],['ما المقصود بعلم البيانات؟','المرجع العلمي للمنهجية']];
    body = `<div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>الوثيقة</th><th>ما تغطيه</th></tr></thead><tbody>${docs.map(([a, b]) => `<tr><td><b>${a}</b></td><td class="soft">${b}</td></tr>`).join('')}</tbody></table></div><p class="faint" style="font-size:12px;padding:10px 16px">52 وثيقة مرجعية بُني عليها هذا العرض.</p></div>`; }
  return `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${S.archTab === k}" data-act="arch-tab" data-k="${k}">${l}</button>`).join('')}</div>${body}`;
};

/* ================= render & events ================= */
function save() { try { const { menu, ...keep } = S; localStorage.setItem('naiosh-demo', JSON.stringify(keep)); } catch (e) {} }
function load() { try { const raw = localStorage.getItem('naiosh-demo'); if (raw) { const v = JSON.parse(raw); S = Object.assign(freshState(), v, { menu: false }); if (S.askStage === 1) S.askShown = ASK_STEPS.length; } } catch (e) {} }
function effRoute() { const r = VIEWS[S.route] ? S.route : 'home'; if (r !== 'home' && r !== 'settings' && !modOn(r)) return 'home'; return r; }
function render() {
  if (!VIEWS[S.route]) S.route = 'home';
  const R = effRoute();
  applyTheme();
  renderSide(); renderTop();
  const side = document.getElementById('side'), top = document.getElementById('top');
  side.innerHTML = brandify(side.innerHTML); top.innerHTML = brandify(top.innerHTML);
  document.getElementById('view').innerHTML = R === 'settings' ? VIEWS.settings() : brandify(VIEWS[R]());
  document.getElementById('app').classList.toggle('open', S.menu);
  document.getElementById('app').classList.toggle('touring', S.tour.on);
  renderTour(); const tr = document.getElementById('tour'); tr.innerHTML = brandify(tr.innerHTML); save();
}
function go(r) { if (r !== S.route) S.hist = (S.hist || []).concat(S.route).slice(-30); S.route = r; S.menu = false; render(); window.scrollTo(0, 0); document.getElementById('view').focus({ preventScroll: true }); }
function tourGo(i) { S.tour.i = Math.max(0, Math.min(TOUR.length - 1, i)); go(TOUR[S.tour.i].r); }

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  const a = e.target.closest('[data-act]');
  if (a && (!g || g.contains(a))) { handle(a.dataset.act, a.dataset.k, a); return; }
  if (g) { go(g.dataset.go); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-go],tr[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.model; if (!k) return;
  S[k] = e.target.value;
  if (k === 'why') { const b = document.getElementById('d-submit'); if (b) b.setAttribute('aria-disabled', String(!(S.choice && S.why.trim().length > 3))); }
  if (k === 'kq') { const r = document.getElementById('kres'); if (r) r.innerHTML = kResults(); }
  save();
});
function handle(act, k, el) {
  const qs = QS();
  switch (act) {
    case 'menu': S.menu = !S.menu; document.getElementById('app').classList.toggle('open', S.menu); return;
    case 'tour-next': if (S.tour.i >= TOUR.length - 1) { S.tour.on = false; go('home'); toast('انتهى العرض الموجّه — الحلقة مكتملة'); } else tourGo(S.tour.i + 1); return;
    case 'tour-prev': if (S.tour.i > 0) tourGo(S.tour.i - 1); return;
    case 'tour-close': S.tour.on = false; render(); return;
    case 'tour-open': S.tour.on = true; render(); return;
    case 'tour-reset': clearInterval(askTimer); S = Object.assign(freshState(), { setTab: S.setTab }); go('home'); toast('أُعيد العرض إلى البداية'); return;
    case 'ask-ex': { const ex = ['أريد معرفة سبب انخفاض مبيعات الفرع.','لماذا انخفض مؤشر الأداء في قطاع التشغيل؟','ما المتوقع خلال الأشهر الستة القادمة؟','هل هناك خطر متوقع على أداء الموظفين؟','أين توجد فرص النمو غير المستغلة؟','ما البيانات التي تنقصنا لاتخاذ القرار؟']; S.q = ex[+el.dataset.i] || S.q; render(); return; }
    case 'ask-start':
      if (!S.q.trim()) { toast('اكتب سؤالك أولًا'); return; }
      S.askStage = 1; S.askShown = 0; log('د. عدنان', 'طرح سؤالًا على نايوش: ' + S.q.slice(0, 60)); render();
      clearInterval(askTimer);
      askTimer = setInterval(() => { S.askShown++; if (S.askShown >= ASK_STEPS.length) { clearInterval(askTimer); log('المنسّق', 'عقد البيانات: الكفاية 62% — طُلب استبيان ذكي', 'sys'); } if (S.route === 'ask') render(); else save(); }, 520);
      return;
    case 'ask-reset': clearInterval(askTimer); S.askStage = 0; S.askShown = 0; render(); return;
    case 'ctab': S.consultTab = k; render(); return;
    case 'dsel': S.dataSel = k; render(); return;
    case 'q-pick': { const q = qs[Math.min(S.qi, qs.length - 1)]; S.ans[q.id] = q.o[+k]; if (q.id === 'q1') delete S.ans.q2; render(); return; }
    case 'q-next': { const q = qs[S.qi]; if (!S.ans[q.id]) { toast('اختر إجابة أولًا'); return; } if (S.qi >= qs.length - 1) { S.qDone = true; if (S.askStage !== 1) { S.askStage = 1; S.askShown = ASK_STEPS.length; } log('د. عدنان', 'أكمل الاستبيان الذكي — الثقة ارتفعت إلى 84%'); toast('اكتملت البيانات — الثقة 84%'); } else S.qi++; render(); return; }
    case 'q-back': S.qi = Math.max(0, S.qi - 1); render(); return;
    case 'q-review': S.qDone = false; S.qi = 0; render(); return;
    case 'cause': S.cause = k; render(); return;
    case 'sc': S.sc = k; render(); return;
    case 'risk': S.risk = k; render(); return;
    case 'sol-focus': S.sol = +k; render(); return;
    case 'sol-choose': S.sol = +k; log('د. عدنان', 'رفع الحل #' + k + ' إلى مركز القرار'); go('decision'); return;
    case 'd-pick': S.choice = k; render(); return;
    case 'd-submit':
      if (!(S.choice && S.why.trim().length > 3)) { toast(S.choice ? 'اكتب مبرر القرار أولًا' : 'اختر القرار أولًا'); return; }
      S.decided = true; log('د. عدنان', `سجّل القرار DEC-2026-041 (${choiceLabel()}): ${solSel().short}`);
      if (approved()) log('محرك التنفيذ', 'ولّد خطة التنفيذ AP-2026-077 من 8 إجراءات', 'sys');
      toast('سُجّل القرار في ذاكرة القرار'); render(); return;
    case 'd-undo': S.decided = false; S.measured = false; S.lessonApproved = false; render(); return;
    case 'simulate': S.measured = true; log('محرك الأثر', `بعد 30 يومًا: المؤشر ${solSel().act} مقابل المتوقع ${solSel().exp}`, 'sys'); toast('مرّ 30 يومًا — النتائج جاهزة'); render(); return;
    case 'lesson-approve': S.lessonApproved = true; log('بوابة الحوكمة', 'اعتمدت الدرس LSN-2026-093 كمعرفة مؤسسية L5', 'sys'); toast('دخل الدرس الذاكرة المؤسسية'); render(); return;
    case 'report-gen': S.reports.unshift({ n: k, t: nowTime() }); log('د. عدنان', 'ولّد ' + k + ' لـ CNS-001'); toast('تم توليد: ' + k); render(); return;
    case 'gov-tab': S.govTab = k; render(); return;
    case 'arch-tab': S.archTab = k; render(); return;
    default: if (!diaHandle(act, k) && !requestHandle(act, k, el)) settingsHandle(act, k, el);
  }
}

if (window.NAIOSH_SERVER && typeof serverBoot === 'function') serverBoot();
else { load(); render(); detectEditor(); }
try { if (sessionStorage.getItem('naiosh-published') === '1') { sessionStorage.removeItem('naiosh-published'); toast('نُشرت الإعدادات — يراها الآن كل من يفتح الرابط'); } } catch (e) {}
</script>

</body>
</html>
